<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StoryForge</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #root { margin: 0; padding: 0; height: 100%; }
    body { font-family: -apple-system, 'Segoe UI', sans-serif; }
    select { appearance: auto; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;

// ─── PALETTE: white bg, black text, hairline borders ─────────────────────────
const T = {
  bg:       "#FFFFFF",
  surface:  "#FAFAFA",
  card:     "#F4F4F4",
  border:   "#E8E8E8",
  border2:  "#D0D0D0",
  text:     "#0A0A0A",
  sub:      "#666666",
  muted:    "#AAAAAA",
  black:    "#000000",
  // Mode colors — only color in the whole UI
  modes: {
    action:    { color: "#000000", bg: "#F0F0F0", label: "ACTION"    },
    character: { color: "#000000", bg: "#000000", label: "CHARACTER", textColor: "#FFFFFF" },
    dialogue:  { color: "#444444", bg: "#E8E8E8", label: "DIALOGUE"  },
    location:  { color: "#000000", bg: "#000000", label: "LOCATION",  textColor: "#FFFFFF", mono: true },
    direction: { color: "#666666", bg: "#F0F0F0", label: "DIRECTION", italic: true },
    note:      { color: "#888888", bg: "#F4F4F4", label: "NOTE",      italic: true },
  },
};

// ─── FORMAT MODE CYCLES ───────────────────────────────────────────────────────
const FORMAT_CYCLES = {
  film:      ["action","character","dialogue","direction","location"],
  tv:        ["action","character","dialogue","direction","location"],
  novel:     ["action","character","dialogue","note"],
  anime:     ["action","character","dialogue","direction","location","note"],
  manga:     ["action","character","dialogue","direction","note"],
  voiceover: ["character","dialogue","direction","note"],
  audiobook: ["action","character","dialogue","note"],
  stage:     ["action","character","dialogue","direction","location"],
};

const FORMATS = [
  { id:"film",      label:"Film Script"         },
  { id:"tv",        label:"TV / Series"          },
  { id:"novel",     label:"Novel"                },
  { id:"anime",     label:"Anime Script"         },
  { id:"manga",     label:"Manga / Graphic Novel"},
  { id:"voiceover", label:"Voice Over"           },
  { id:"audiobook", label:"Audiobook"            },
  { id:"stage",     label:"Stage Play"           },
];

const GENRES = [
  // Drama & General
  "Drama","Comedy","Tragicomedy","Satire","Dark Comedy","Romantic Comedy",
  // Action & Thriller  
  "Action / Adventure","Thriller","Spy / Espionage","Heist","Legal Thriller","Political Thriller",
  // Crime
  "Crime","Crime Noir","Crime Drama","Detective","Gangster","True Crime",
  // Horror & Dark
  "Horror","Psychological Horror","Supernatural Horror","Slasher","Body Horror","Gothic",
  // Sci-Fi & Fantasy
  "Sci-Fi","Hard Sci-Fi","Cyberpunk","Space Opera","Dark Fantasy","High Fantasy","Urban Fantasy","Supernatural",
  // Romance
  "Romance","Romantic Drama","Period Romance",
  // Mystery
  "Mystery / Thriller","Whodunit","Noir",
  // Historical & Period
  "Historical","Period Drama","War","Epic",
  // Family & Youth
  "Coming of Age","Family","Kids","Teen Drama","Slice of Life",
  // Animation styles
  "Shonen","Shojo","Seinen","Josei","Isekai","Mecha","Martial Arts",
  // Specialized
  "Post-Apocalyptic","Dystopian","Western","Musical","Sports","Biopic",
  "Political Drama","Social Drama","Religious / Spiritual","Philosophical",
  // Experimental
  "Experimental","Anthology","Docudrama","Mockumentary",
];

// ─── INLINE STYLES ────────────────────────────────────────────────────────────
const css = {
  input: {
    background: "#FFFFFF", border: "1px solid #D0D0D0", borderRadius: 4,
    color: "#0A0A0A", padding: "9px 12px", width: "100%",
    outline: "none", fontSize: 13, fontFamily: "inherit", boxSizing: "border-box",
  },
  label: {
    fontSize: 10, fontWeight: 700, color: "#AAAAAA",
    textTransform: "uppercase", letterSpacing: "0.12em",
    display: "block", marginBottom: 6,
  },
};

// ─── STORAGE ──────────────────────────────────────────────────────────────────
const LS = {
  get: (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// ─── LINE STYLE FOR EACH MODE ─────────────────────────────────────────────────
// IMPORTANT: never use paddingLeft/paddingRight on textarea styles —
// it collapses the writable width. Use marginLeft/marginRight on the
// wrapper div instead (handled in SmartEditor render).
function lineStyle(mode, format) {
  const isAudio    = format === "audiobook";
  const isNovel    = format === "novel";
  const isFilm     = format === "film" || format === "tv" || format === "stage";
  const isAnime    = format === "anime" || format === "manga" || format === "animation";
  const isVO       = format === "voiceover";

  switch (mode) {
    case "character":
      return {
        fontWeight: 800,
        textTransform: "uppercase",
        textAlign: isAudio || isNovel ? "left" : "center",
        letterSpacing: "0.1em",
        fontSize: 13,
        marginTop: 16,
        color: "#000",
      };

    case "dialogue":
      // audiobook/novel: full width, normal prose feel
      // screenplay: indented feel — but we handle indent via wrapper margin, not padding
      return {
        color: "#222",
        fontSize: isAudio || isNovel ? 14 : 13,
        lineHeight: isAudio || isNovel ? 2.0 : 1.85,
        fontStyle: "normal",
      };

    case "direction":
      return {
        fontStyle: "italic",
        color: "#666",
        fontSize: 12,
        lineHeight: 1.7,
      };

    case "location":
      return {
        fontWeight: 800,
        textTransform: "uppercase",
        letterSpacing: "0.08em",
        fontSize: 12,
        marginTop: 20,
        color: "#000",
      };

    case "note":
      return {
        fontStyle: "italic",
        color: "#999",
        fontSize: 12,
        lineHeight: 1.7,
      };

    default: // action / narration
      return {
        color: "#111",
        fontSize: isAudio || isNovel ? 14 : 13,
        lineHeight: isAudio || isNovel ? 2.1 : 1.9,
      };
  }
}

// ── wrapper margin per mode+format (indentation lives HERE, not on textarea) ──
function wrapperStyle(mode, format) {
  const isScreen = format === "film" || format === "tv" || format === "stage";
  const isAnime  = format === "anime" || format === "manga" || format === "animation";
  const isVO     = format === "voiceover";
  const isAudio  = format === "audiobook";
  const isNovel  = format === "novel";

  switch (mode) {
    case "dialogue":
      if (isAudio || isNovel) return { marginLeft: 0, marginRight: 0 };   // full width
      if (isScreen)           return { marginLeft: "18%", marginRight: "16%" }; // screenplay column
      if (isAnime || isVO)    return { marginLeft: "12%", marginRight: "8%" };
      return { marginLeft: "10%", marginRight: "8%" };

    case "direction":
      if (isAudio || isNovel) return { marginLeft: 0, marginRight: 0 };
      if (isScreen)           return { marginLeft: "22%", marginRight: "20%" };
      return { marginLeft: "14%", marginRight: "12%" };

    case "character":
      if (isAudio || isNovel) return { marginLeft: 0 };
      return { marginLeft: "30%", marginRight: "30%" };   // centered column

    case "note":
      return { marginLeft: 16, borderLeft: "2px solid #E8E8E8", paddingLeft: 8 };

    case "location":
      return { borderTop: "1px solid #EBEBEB", paddingTop: 8, marginTop: 4 };

    default:
      return {};
  }
}

// ─── CAST AUTOCOMPLETE ────────────────────────────────────────────────────────
function CharPopup({ matches, onSelect, onCreate, query, style }) {
  // show whenever there's a query — even if no existing matches (shows "Add" option)
  if (!query || query.trim().length === 0) return null;
  return (
    <div style={{
      position: "fixed", background: "#FFF", border: "1px solid #D0D0D0",
      borderRadius: 6, boxShadow: "0 4px 20px rgba(0,0,0,0.12)",
      minWidth: 200, zIndex: 1000, overflow: "hidden", ...style,
    }}>
      {matches.map((c, i) => (
        <button key={c.id} onClick={() => onSelect(c)} style={{
          display: "flex", alignItems: "center", gap: 10, width: "100%",
          padding: "9px 14px", background: "none", border: "none",
          borderBottom: "1px solid #F0F0F0", cursor: "pointer",
          textAlign: "left", fontFamily: "inherit",
        }}>
          <div style={{
            width: 28, height: 28, borderRadius: "50%", background: "#000",
            display: "flex", alignItems: "center", justifyContent: "center",
            fontSize: 10, fontWeight: 800, color: "#FFF", flexShrink: 0,
          }}>{c.name?.[0]?.toUpperCase() || "?"}</div>
          <div>
            <p style={{ margin: 0, fontSize: 13, fontWeight: 700, color: "#000" }}>{c.name}</p>
            <p style={{ margin: 0, fontSize: 11, color: "#999" }}>{c.role}</p>
          </div>
          <span style={{ marginLeft: "auto", fontSize: 10, color: "#CCC", fontWeight: 600 }}>TAB</span>
        </button>
      ))}
      {query && (
        <button onClick={() => onCreate(query)} style={{
          display: "flex", alignItems: "center", gap: 10, width: "100%",
          padding: "9px 14px", background: "#FAFAFA", border: "none",
          cursor: "pointer", textAlign: "left", fontFamily: "inherit",
        }}>
          <div style={{ width: 28, height: 28, borderRadius: "50%", border: "2px dashed #CCC", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14, color: "#CCC" }}>+</div>
          <p style={{ margin: 0, fontSize: 13, color: "#888" }}>Add <strong style={{ color: "#000" }}>{query}</strong> to cast</p>
          <span style={{ marginLeft: "auto", fontSize: 10, color: "#CCC", fontWeight: 600 }}>ENTER</span>
        </button>
      )}
    </div>
  );
}

// ─── MODE PILL ────────────────────────────────────────────────────────────────
function ModePill({ mode, visible, x, y }) {
  const m = T.modes[mode] || T.modes.action;
  return (
    <div style={{
      position: "fixed", left: x, top: y - 32,
      background: m.bg, color: m.textColor || m.color,
      border: "1px solid #D0D0D0",
      borderRadius: 3, padding: "2px 8px", fontSize: 9,
      fontWeight: 800, letterSpacing: "0.14em", pointerEvents: "none",
      opacity: visible ? 1 : 0, transition: "opacity 0.3s", zIndex: 900,
      fontFamily: "-apple-system,sans-serif",
    }}>{m.label}</div>
  );
}

// ─── RIGHT CLICK MENU ────────────────────────────────────────────────────────
function ContextMenu({ x, y, selectedText, onAddToCase, onClose }) {
  useEffect(() => {
    const h = () => onClose();
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, [onClose]);
  return (
    <div style={{
      position: "fixed", left: x, top: y, background: "#FFF",
      border: "1px solid #D0D0D0", borderRadius: 6,
      boxShadow: "0 4px 20px rgba(0,0,0,0.15)", zIndex: 2000,
      minWidth: 200, overflow: "hidden",
    }}>
      <div style={{ padding: "8px 14px 6px", borderBottom: "1px solid #F0F0F0" }}>
        <p style={{ margin: 0, fontSize: 10, color: "#AAA", fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase" }}>"{selectedText}"</p>
      </div>
      <button onClick={onAddToCase} style={{
        display: "flex", alignItems: "center", gap: 10, width: "100%",
        padding: "10px 14px", background: "none", border: "none",
        cursor: "pointer", fontFamily: "inherit", textAlign: "left",
      }}>
        <span style={{ fontSize: 15 }}>◉</span>
        <div>
          <p style={{ margin: 0, fontSize: 13, fontWeight: 600, color: "#000" }}>Add to Cast</p>
          <p style={{ margin: 0, fontSize: 11, color: "#999" }}>Remember as a character</p>
        </div>
      </button>
      <button onClick={onClose} style={{
        display: "flex", alignItems: "center", gap: 10, width: "100%",
        padding: "10px 14px", background: "none", border: "none",
        borderTop: "1px solid #F0F0F0", cursor: "pointer", fontFamily: "inherit",
      }}>
        <span style={{ fontSize: 13, color: "#999" }}>Keep as regular text</span>
      </button>
    </div>
  );
}

// ─── SMART EDITOR ─────────────────────────────────────────────────────────────
// Uses textarea-per-line. React only owns mode + line structure.
// Text value is owned entirely by the DOM (uncontrolled) — cursor never jumps.
function SmartEditor({ project, cast, onUpdateContent, onAddCharacter, format, onPageChange, focusMode, scrollRef, darkCanvas, onCharFocus }) {
  const [lines, setLines] = useState(() =>
    project?.lines?.length ? project.lines : [{ id: Date.now(), text: "", mode: "action" }]
  );
  const [curLine, setCurLine] = useState(0);
  const [pillVisible, setPillVisible] = useState(false);
  const [pillPos, setPillPos]   = useState({ x: 0, y: 0 });
  const [popup, setPopup]       = useState({ visible: false, x: 0, y: 0, query: "", matches: [] });
  const [contextMenu, setContextMenu] = useState(null);
  const [inlineNote, setInlineNote] = useState(null); // { x, y, lineIdx, meta }

  // refs[idx] → the <textarea> DOM node
  const refs     = useRef({});
  // textCache[idx] → live text owned by DOM, read on demand
  const textCache = useRef({});
  const pillTimerRef = useRef(null);
  const syncTimerRef = useRef(null);
  const cycle = FORMAT_CYCLES[format] || FORMAT_CYCLES.film;

  // ── page break tracking — all refs, zero setState, never causes re-renders ──
  const PAGE_H = 864; // 11" page minus 2" margins @ 96dpi
  const lineHeights = useRef({});
  const wrapperRefs = useRef({});
  const pageCounterRef = useRef(null); // direct DOM ref for the counter

  // pure computation from lineHeights ref — no state, no re-render
  const computePageMap = (lns) => {
    const breakSet = new Set();
    const lineToPage = {};
    let acc = 0, page = 1;
    for (let i = 0; i < lns.length; i++) {
      const h = lineHeights.current[i] || 28;
      if (acc + h > PAGE_H && acc > 0) { breakSet.add(i); acc = h; page++; }
      else acc += h;
      lineToPage[i] = page;
    }
    return { breakSet, lineToPage, total: page };
  };

  // computed inline during render — zero setState
  const pageMap = computePageMap(lines);

  // write counter to DOM directly — no re-render
  const updateCounter = (lineIdx) => {
    const p = pageMap.lineToPage[lineIdx] || 1;
    const t = pageMap.total;
    if (pageCounterRef.current) pageCounterRef.current.textContent = `${p} / ${t}`;
    if (onPageChange) onPageChange(p, t);
  };

  // ── restore when project switches ──
  useEffect(() => {
    const next = project?.lines?.length
      ? project.lines
      : [{ id: Date.now(), text: "", mode: "action" }];
    setLines(next);
    next.forEach((l, i) => { textCache.current[i] = l.text; });
    setCurLine(0);
    lineHeights.current = {};
  }, [project?.id]);

  // ── expose scroll-to-line function via scrollRef ──
  const containerRef = useRef(null);
  useEffect(() => {
    if (scrollRef) {
      scrollRef.current = (idx) => {
        const el = wrapperRefs.current[idx];
        if (el && containerRef.current) {
          el.scrollIntoView({ behavior: "smooth", block: "center" });
          refs.current[idx]?.focus();
        }
      };
    }
  }, [scrollRef]);

  // ── typewriter scroll: keep cursor line centered when in focusMode ──
  useEffect(() => {
    if (!focusMode) return;
    const el = wrapperRefs.current[curLine];
    if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
  }, [curLine, focusMode]);

  // ── expose scroll-to-line via scrollRef ──
  useEffect(() => {
    if (scrollRef) scrollRef.current = (idx) => {
      const el = wrapperRefs.current[idx];
      if (el) { el.scrollIntoView({ behavior:"smooth", block:"center" }); refs.current[idx]?.focus(); }
    };
  });

  // ── typewriter scroll: keep cursor centered in focus mode ──
  useEffect(() => {
    if (!focusMode) return;
    const el = wrapperRefs.current[curLine];
    if (el) el.scrollIntoView({ behavior:"smooth", block:"center" });
  }, [curLine, focusMode]);

  // ── debounced sync to parent (300 ms after last keystroke) ──
  const scheduleSync = () => {
    clearTimeout(syncTimerRef.current);
    syncTimerRef.current = setTimeout(() => {
      setLines(prev => {
        const updated = prev.map((l, i) => ({ ...l, text: textCache.current[i] ?? l.text }));
        onUpdateContent(updated);
        return updated;
      });
    }, 300);
  };

  // ── show mode pill briefly ──
  const showPill = (el) => {
    if (!el) return;
    const r = el.getBoundingClientRect();
    setPillPos({ x: r.left, y: r.top });
    setPillVisible(true);
    clearTimeout(pillTimerRef.current);
    pillTimerRef.current = setTimeout(() => setPillVisible(false), 1800);
  };

  // ── focus helper ──
  const focusLine = (idx, atEnd = true) => {
    setTimeout(() => {
      const el = refs.current[idx];
      if (!el) return;
      el.focus();
      if (atEnd) {
        const len = el.value.length;
        el.setSelectionRange(len, len);
      }
    }, 0);
  };

  // ── onChange: update text cache only, no React state → cursor safe ──
  const handleChange = (e, idx) => {
    const text = e.target.value;
    textCache.current[idx] = text;
    scheduleSync();

    // autocomplete — always show when typing in character mode, even with empty cast
    const mode = lines[idx]?.mode;
    if (mode === "character" && text.trim().length > 0) {
      const el = refs.current[idx];
      if (!el) return;
      const r = el.getBoundingClientRect();
      const q = text.trim();
      const matches = cast.filter(c => c.name.toUpperCase().startsWith(q.toUpperCase()));
      // always show: offers existing matches OR "Add to cast" when matches empty
      setPopup({ visible: true, x: r.left, y: r.bottom + 6, query: q, matches });
    } else {
      setPopup(p => ({ ...p, visible: false }));
    }
  };

  // ── keydown: structure changes only ──
  const handleKeyDown = (e, idx) => {
    const lineMode = lines[idx]?.mode;

    // ── pass through all Ctrl/Cmd combos except ones we own ──
    if ((e.ctrlKey || e.metaKey) && e.key === "a") {
      e.preventDefault();
      const el = refs.current[idx];
      if (el) { el.focus(); el.select(); }
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key === "n") {
      e.preventDefault();
      const el = refs.current[idx];
      if (el) {
        const r = el.getBoundingClientRect();
        const meta = { page: pageMap.lineToPage[idx] || 1, character: lines[idx]?.mode === "character" ? (textCache.current[idx] || "") : "", mode: lines[idx]?.mode };
        setInlineNote({ x: r.left + 40, y: r.bottom + 8, lineIdx: idx, meta });
      }
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key !== "k") return;

    // ── pass through Shift combos (native selection) ──
    if (e.shiftKey && e.key !== "Tab") return;

    // ── TAB: cycle mode (no text change) ──
    if (e.key === "Tab" && !popup.visible) {
      e.preventDefault();
      const ci = cycle.indexOf(lineMode);
      const nextMode = cycle[(ci + 1) % cycle.length];
      setLines(prev => prev.map((l, i) => i === idx ? { ...l, mode: nextMode } : l));
      showPill(refs.current[idx]);
      return;
    }

    // ── TAB while popup open: accept first match ──
    if (e.key === "Tab" && popup.visible) {
      e.preventDefault();
      if (popup.matches.length > 0) acceptChar(popup.matches[0], idx);
      else if (popup.query)         createChar(popup.query, idx);
      return;
    }

    // ── ENTER while popup open: create new char ──
    if (e.key === "Enter" && popup.visible) {
      e.preventDefault();
      if (popup.query) createChar(popup.query, idx);
      return;
    }

    // ── ESCAPE: close popup / back to action ──
    if (e.key === "Escape") {
      if (popup.visible) { setPopup(p => ({ ...p, visible: false })); return; }
      if (lineMode === "character") {
        setLines(prev => prev.map((l, i) => i === idx ? { ...l, mode: "action" } : l));
        showPill(refs.current[idx]);
      }
      return;
    }

    // ── ENTER: if line is blank → delete it; if not → create smart next line ──
    if (e.key === "Enter") {
      e.preventDefault();
      setPopup(p => ({ ...p, visible: false }));

      const curVal = refs.current[idx]?.value ?? (textCache.current[idx] ?? "");

      // Enter on a blank line = delete it (same as Backspace on empty)
      if (curVal === "" && lines.length > 1) {
        setLines(prev => {
          const next = prev.filter((_, i) => i !== idx);
          const newCache = {};
          next.forEach((_, i) => { newCache[i] = textCache.current[i < idx ? i : i + 1] ?? ""; });
          textCache.current = newCache;
          return next;
        });
        const prevIdx = Math.max(0, idx - 1);
        setCurLine(prevIdx);
        focusLine(prevIdx);
        return;
      }

      // Enter on a non-empty line → create smart next line
      const nextMode =
        lineMode === "character" ? "dialogue" :
        lineMode === "dialogue"  ? "character" :
        lineMode === "location"  ? "action" : "action";
      const newLine = { id: Date.now(), text: "", mode: nextMode };

      // flush current textarea into cache
      textCache.current[idx] = refs.current[idx]?.value ?? (textCache.current[idx] || "");

      // shift cache synchronously BEFORE setLines
      for (let i = lines.length; i > idx + 1; i--) {
        textCache.current[i] = textCache.current[i - 1] ?? "";
      }
      textCache.current[idx + 1] = "";

      setLines(prev => {
        const next = [...prev];
        next.splice(idx + 1, 0, newLine);
        return next;
      });
      setCurLine(idx + 1);
      focusLine(idx + 1, false);
      return;
    }

    // ── BACKSPACE on empty line: remove line ──
    if (e.key === "Backspace") {
      // Prefer DOM value (always current), fall back to cache
      // textCache[idx] being undefined means line was just created and is empty
      const domVal = refs.current[idx]?.value;
      const curVal = domVal !== undefined ? domVal : (textCache.current[idx] ?? "");
      if (curVal === "" && lines.length > 1) {
        e.preventDefault();
        setPopup(p => ({ ...p, visible: false }));
        setLines(prev => {
          const next = prev.filter((_, i) => i !== idx);
          // reindex cache
          const newCache = {};
          next.forEach((_, i) => { newCache[i] = textCache.current[i < idx ? i : i + 1] ?? ""; });
          textCache.current = newCache;
          return next;
        });
        const prevIdx = Math.max(0, idx - 1);
        setCurLine(prevIdx);
        focusLine(prevIdx);
        return;
      }
    }
  };

  // ── accept existing char from popup ──
  const acceptChar = (char, idx) => {
    const el = refs.current[idx];
    if (el) { el.value = char.name.toUpperCase(); }
    textCache.current[idx] = char.name.toUpperCase();
    setPopup(p => ({ ...p, visible: false }));
    scheduleSync();
    focusLine(idx);
  };

  // ── create new char from popup ──
  const createChar = (name, idx) => {
    const formatted = name.toUpperCase();
    onAddCharacter({ id: Date.now(), name: formatted, role: "Supporting", voice: "", notes: "" });
    const el = refs.current[idx];
    if (el) { el.value = formatted; }
    textCache.current[idx] = formatted;
    setPopup(p => ({ ...p, visible: false }));
    scheduleSync();
    focusLine(idx);
  };

  // ── right-click context menu ──
  const handleContextMenu = (e, idx) => {
    const sel = window.getSelection()?.toString()?.trim();
    // also try textarea selection
    const taEl = refs.current[idx];
    const taSel = taEl ? taEl.value.slice(taEl.selectionStart, taEl.selectionEnd).trim() : "";
    const chosen = taSel || sel;
    if (!chosen || chosen.length < 2) return;
    e.preventDefault();
    setContextMenu({ x: e.clientX, y: e.clientY, text: chosen });
  };

  const addToCastFromContext = () => {
    if (!contextMenu) return;
    const name = contextMenu.text.toUpperCase();
    if (!cast.some(c => c.name.toUpperCase() === name)) {
      onAddCharacter({ id: Date.now(), name, role: "Supporting", voice: "", notes: "" });
    }
    setContextMenu(null);
  };

  // ── save inline note ──
  const saveInlineNote = (text) => {
    if (!inlineNote) return;
    const { lineIdx, meta } = inlineNote;
    const note = { id: Date.now(), text, lineIdx, meta, created: Date.now() };
    setLines(prev => prev.map((l, i) => i === lineIdx ? { ...l, notes: [...(l.notes || []), note] } : l));
    setInlineNote(null);
  };

  // ── placeholder text per mode ──
  const placeholder = (mode) => ({
    character: "CHARACTER NAME",
    dialogue:  "Dialogue...",
    location:  "INT./EXT. LOCATION — DAY/NIGHT",
    direction: "(parenthetical)",
    note:      "// note...",
    action:    "Action / description...",
  }[mode] || "");

  // ── textarea style — NO padding/margin here, wrapper handles indentation ──
  const taStyle = (mode) => {
    const ls = lineStyle(mode, format);
    return {
      width: "100%",
      border: "none",
      outline: "none",
      resize: "none",
      background: "transparent",
      fontFamily: "'Courier New', Courier, monospace",
      fontSize: 14,
      lineHeight: 1.9,
      overflowY: "hidden",
      overflowX: "hidden",
      minHeight: 28,
      padding: 0,
      margin: 0,
      caretColor: "#000",
      boxSizing: "border-box",
      display: "block",
      ...ls,
    };
  };

  // auto-grow textarea height only — no setState here, page recompute handled by useEffect
  const autoGrow = (el) => {
    if (!el) return;
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  };

  return (
    <div ref={containerRef} style={{ flex: 1, position: "relative", overflowY: "auto", background: darkCanvas ? "#1A1A1A" : "#D8D8D8", padding: "40px 0 80px" }}>
      {/* Mode pill */}
      <ModePill mode={lines[curLine]?.mode || "action"} visible={pillVisible} x={pillPos.x} y={pillPos.y} />

      {/* Page canvas — 816px = 8.5" @ 96dpi */}
      <div style={{ width: 816, margin: "0 auto", background: "#FFFFFF", boxShadow: darkCanvas ? "0 2px 32px rgba(0,0,0,0.5)" : "0 2px 16px rgba(0,0,0,0.18)" }}>
        {/* Top page margin */}
        <div style={{ height: 96 }} />

        {/* Content area — 1" left+right margins (96px each) inside the page */}
        <div style={{ padding: "0 96px" }}>
          {lines.map((line, idx) => {
            const isBreakBefore = pageMap.breakSet.has(idx);
            return (
              <div key={line.id}>
                {/* Page break rule */}
                {isBreakBefore && (
                  <div style={{
                    display: "flex", alignItems: "center", gap: 12,
                    margin: "16px -96px",
                    padding: "6px 96px",
                    borderTop: "1px dashed #CCCCCC",
                    borderBottom: "1px dashed #CCCCCC",
                    background: "#F8F8F8",
                  }}>
                    <div style={{ flex: 1 }} />
                    <span style={{
                      fontSize: 10, color: "#BBBBBB", fontWeight: 700,
                      letterSpacing: "0.12em", textTransform: "uppercase",
                      fontFamily: "-apple-system,sans-serif",
                    }}>— page {pageMap.lineToPage[idx] || 1} —</span>
                    <div style={{ flex: 1 }} />
                  </div>
                )}
                {/* Line wrapper — wrapperStyle provides screenplay indentation */}
                <div style={{ position: "relative" }}>
                {line.notes?.length > 0 && (
                  <span style={{ position: "absolute", left: -20, top: 4, fontSize: 9, color: "#AAA", fontWeight: 700, cursor: "default", userSelect: "none" }} title={line.notes.map(n => n.text).join(" / ")}>¹</span>
                )}
                {/* Character photo dot — hover to preview */}
                {line.mode === "character" && (() => {
                  const charName = (textCache.current[idx] || line.text || "").trim().toUpperCase();
                  const charData = cast.find(c => c.name.toUpperCase() === charName);
                  if (!charData?.image) return null;
                  return (
                    <div style={{ position: "absolute", right: -20, top: 4, zIndex: 50 }}
                      onMouseEnter={e => {
                        const preview = document.getElementById("char-preview-global");
                        const rect = e.currentTarget.getBoundingClientRect();
                        if (preview) {
                          preview.src = charData.image;
                          preview.style.display = "block";
                          preview.style.top = (rect.top - 60) + "px";
                          preview.style.left = (rect.left - 120) + "px";
                        }
                      }}
                      onMouseLeave={() => {
                        const preview = document.getElementById("char-preview-global");
                        if (preview) preview.style.display = "none";
                      }}
                    >
                      <div style={{ width: 7, height: 7, borderRadius: "50%", background: "#000", opacity: 0.15, cursor: "pointer" }} />
                    </div>
                  );
                })()}
                <div
                  ref={el => { wrapperRefs.current[idx] = el; if (el && el.offsetHeight > 0) lineHeights.current[idx] = el.offsetHeight; }}
                  style={{ position: "relative", ...wrapperStyle(line.mode, format) }}
                >
                  <textarea
                    ref={el => {
                      refs.current[idx] = el;
                      if (el) autoGrow(el);
                    }}
                    defaultValue={line.text}
                    placeholder={placeholder(line.mode)}
                    rows={1}
                    spellCheck={true}
                    autoCorrect="on"
                    autoCapitalize="sentences"
                    autoComplete="off"
                    onFocus={() => { setCurLine(idx); showPill(refs.current[idx]); updateCounter(idx); if (onCharFocus && lines[idx]?.mode === "character") onCharFocus((textCache.current[idx] || lines[idx]?.text || "").trim()); else if (onCharFocus) onCharFocus(""); }}
                    onChange={e => { autoGrow(e.target); const w = wrapperRefs.current[idx]; if (w) lineHeights.current[idx] = w.offsetHeight; handleChange(e, idx); }}
                    onKeyDown={e => handleKeyDown(e, idx)}
                    onContextMenu={e => handleContextMenu(e, idx)}
                    style={taStyle(line.mode)}
                  />
                </div>
                </div>
              </div>
            );
          })}
        </div>

        {/* Bottom page margin */}
        <div style={{ height: 96 }} />
      </div>

      {/* Char autocomplete popup */}
      {popup.visible && (
        <CharPopup
          matches={popup.matches}
          query={popup.query}
          onSelect={c => acceptChar(c, curLine)}
          onCreate={name => createChar(name, curLine)}
          style={{ left: popup.x, top: popup.y }}
        />
      )}

      {/* Context menu */}
      {contextMenu && (
        <ContextMenu
          x={contextMenu.x} y={contextMenu.y}
          selectedText={contextMenu.text}
          onAddToCase={addToCastFromContext}
          onClose={() => setContextMenu(null)}
        />
      )}

      {/* Inline note popup */}
      {inlineNote && (
        <InlineNotePopup
          x={inlineNote.x} y={inlineNote.y}
          meta={inlineNote.meta}
          onSave={saveInlineNote}
          onClose={() => setInlineNote(null)}
        />
      )}


      {/* Inline note popup */}
      {inlineNote && (
        <InlineNotePopup
          x={inlineNote.x} y={inlineNote.y}
          meta={inlineNote.meta}
          onSave={saveInlineNote}
          onClose={() => setInlineNote(null)}
        />
      )}

      {/* Global character photo preview — positioned by JS on hover */}
      <img id="char-preview-global" src="" alt="" style={{
        display: "none", position: "fixed", zIndex: 1200,
        width: 110, height: 110, objectFit: "cover",
        borderRadius: 6, border: "1px solid #D0D0D0",
        boxShadow: "0 4px 16px rgba(0,0,0,0.18)",
        pointerEvents: "none",
      }} />

      <style>{`
        textarea::placeholder { color: #CCCCCC; font-style: italic; }
        textarea { scrollbar-width: none; }
        textarea::-webkit-scrollbar { display: none; }
      `}</style>
    </div>
  );
}

// ─── AI PANEL ─────────────────────────────────────────────────────────────────
function AIPanel({ project, cast, onClose }) {
  const [mode, setMode] = useState("write");
  const [prompt, setPrompt] = useState("");
  const [response, setResponse] = useState("");
  const [loading, setLoading] = useState(false);
  const [corrType, setCorrType] = useState("grammar");

  const fmt = FORMATS.find(f => f.id === project?.format)?.label || "Script";
  const genre = project?.genre || "Unspecified";
  const charList = cast.map(c => c.name).join(", ") || "none";
  const content = project?.lines?.map(l => l.text).join("\n").slice(-1500) || "";
  const moodContext = (project?.moodCards || []).length > 0
    ? "\n\nREFERENCE CARDS (use these as creative context):\n" +
      (project.moodCards || []).map(c => `[${c.tag}] ${c.title}: ${c.body}`).join("\n")
    : "";

  const run = async (sys, usr) => {
    setLoading(true); setResponse("");
    const isArtifact = window.location.hostname.includes("claude.ai") || window.location.protocol === "blob:";
    // Check for locally stored API key (set in Profile → API Key)
    const localKey = LS.get("sf_api_key", null);
    let url, headers;
    if (isArtifact) {
      url = "https://api.anthropic.com/v1/messages";
      headers = { "Content-Type": "application/json" };
    } else if (localKey) {
      url = "https://api.anthropic.com/v1/messages";
      headers = { "Content-Type": "application/json", "x-api-key": localKey, "anthropic-version": "2023-06-01" };
    } else {
      url = "/api/chat";
      headers = { "Content-Type": "application/json" };
    }
    try {
      const res = await fetch(url, { method: "POST", headers, body: JSON.stringify({ model: "claude-sonnet-4-5", max_tokens: 1000, system: sys, messages: [{ role: "user", content: usr }] }) });
      const d = await res.json();
      if (d.error) {
        setResponse(`API error: ${d.error?.message || d.error?.type || JSON.stringify(d.error)}`);
      } else if (d.content) {
        setResponse(d.content.filter(b => b.type === "text").map(b => b.text).join("") || "No response.");
      } else {
        setResponse("Unexpected response: " + JSON.stringify(d).slice(0, 200));
      }
    } catch (err) { setResponse("Connection error: " + err.message); }
    setLoading(false);
  };

  const doWrite = () => {
    if (!prompt.trim()) return;
    run(
      `You are a master writer. Format: ${fmt}. Genre: ${genre}. Characters: ${charList}.${moodContext} Write in exact ${fmt} format — vivid, specific, never generic.`,
      `Script so far (last section):\n${content}\n\nRequest: ${prompt}`
    );
  };

  const doCorrect = () => {
    const map = {
      grammar: "List every grammar, spelling, and punctuation issue with context and the fix.",
      style: "Identify weak verbs, passive voice, vague writing. Give specific rewrites.",
      dialogue: "Analyze dialogue. Flag anything on-the-nose or generic. Give punchy rewrites.",
      pacing: "Evaluate pacing. Where does it drag or rush? Specific notes.",
      continuity: "Find continuity errors — inconsistencies, contradictions, timeline issues.",
      format: `Check formatting against ${fmt} industry standards.`,
    };
    run(
      `You are a professional script editor. Format: ${fmt}. Genre: ${genre}. Give specific, actionable notes.`,
      `${map[corrType]}\n\nSCRIPT:\n${content}`
    );
  };

  return (
    <div style={{
      position: "fixed", right: 0, top: 0, bottom: 0, width: 340,
      background: "#FFF", borderLeft: "1px solid #E8E8E8",
      display: "flex", flexDirection: "column", zIndex: 500,
      boxShadow: "-4px 0 20px rgba(0,0,0,0.06)",
    }}>
      {/* Header */}
      <div style={{ padding: "16px 20px", borderBottom: "1px solid #E8E8E8", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <div>
          <p style={{ margin: 0, fontSize: 13, fontWeight: 800, color: "#000" }}>AI Assistant</p>
          <p style={{ margin: "2px 0 0", fontSize: 11, color: "#AAA" }}>{fmt} · {genre}</p>
        </div>
        <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 20, color: "#AAA", lineHeight: 1, padding: 4 }}>×</button>
      </div>

      {/* Mode tabs */}
      <div style={{ display: "flex", borderBottom: "1px solid #E8E8E8" }}>
        {[["write","Write"],["correct","Corrections"],["voice","Voice"]].map(([id, lbl]) => (
          <button key={id} onClick={() => setMode(id)} style={{
            flex: 1, padding: "10px 4px", background: "none", border: "none",
            borderBottom: `2px solid ${mode === id ? "#000" : "transparent"}`,
            color: mode === id ? "#000" : "#AAA", cursor: "pointer",
            fontFamily: "inherit", fontSize: 11, fontWeight: 700,
            letterSpacing: "0.08em", textTransform: "uppercase", transition: "all 0.12s",
          }}>{lbl}</button>
        ))}
      </div>

      <div style={{ flex: 1, overflowY: "auto", padding: 20, display: "flex", flexDirection: "column", gap: 16 }}>
        {mode === "write" && (
          <>
            <div>
              <label style={css.label}>Quick prompts</label>
              <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                {["Continue the scene","Next dialogue exchange","An action beat","A scene transition","A character reveal","A quiet emotional moment","Tense confrontation"].map(q => (
                  <button key={q} onClick={() => setPrompt(q)} style={{
                    padding: "8px 12px", background: "#FAFAFA", border: "1px solid #EBEBEB",
                    borderRadius: 4, color: "#555", cursor: "pointer", fontSize: 12,
                    fontFamily: "inherit", textAlign: "left", transition: "all 0.1s",
                  }}>{q}</button>
                ))}
              </div>
            </div>
            <div>
              <label style={css.label}>Describe what you need</label>
              <textarea value={prompt} onChange={e => setPrompt(e.target.value)} placeholder="e.g. Kael confronts Mira but can't reveal he knows the truth..." style={{ ...css.input, resize: "none", minHeight: 72, lineHeight: 1.6, fontSize: 12 }} />
              <button onClick={doWrite} disabled={loading || !prompt.trim()} style={{
                marginTop: 8, width: "100%", padding: "10px", borderRadius: 4,
                background: "#000", color: "#FFF", border: "none", cursor: loading ? "wait" : "pointer",
                fontFamily: "inherit", fontWeight: 700, fontSize: 13, opacity: loading || !prompt.trim() ? 0.4 : 1,
              }}>{loading ? "Writing..." : "Write"}</button>
            </div>
          </>
        )}

        {mode === "correct" && (
          <div>
            <label style={css.label}>Correction type</label>
            <div style={{ display: "flex", flexDirection: "column", gap: 4, marginBottom: 16 }}>
              {[["grammar","Grammar & Spelling"],["style","Style & Flow"],["dialogue","Dialogue Punch"],["pacing","Pacing"],["continuity","Continuity"],["format","Format Check"]].map(([id, lbl]) => (
                <button key={id} onClick={() => setCorrType(id)} style={{
                  padding: "9px 12px", background: corrType === id ? "#000" : "#FAFAFA",
                  border: `1px solid ${corrType === id ? "#000" : "#EBEBEB"}`,
                  borderRadius: 4, color: corrType === id ? "#FFF" : "#555",
                  cursor: "pointer", fontSize: 12, fontFamily: "inherit",
                  textAlign: "left", fontWeight: corrType === id ? 700 : 400, transition: "all 0.1s",
                }}>{lbl}</button>
              ))}
            </div>
            <button onClick={doCorrect} disabled={loading} style={{
              width: "100%", padding: "10px", borderRadius: 4,
              background: "#000", color: "#FFF", border: "none",
              cursor: loading ? "wait" : "pointer", fontFamily: "inherit",
              fontWeight: 700, fontSize: 13, opacity: loading ? 0.4 : 1,
            }}>{loading ? "Analyzing..." : "Analyze Script"}</button>
          </div>
        )}

        {mode === "voice" && (
          <div>
            <label style={css.label}>Character voice profiles</label>
            {cast.length === 0
              ? <p style={{ fontSize: 12, color: "#AAA", fontStyle: "italic" }}>Add characters to your cast first.</p>
              : cast.map(c => (
                  <button key={c.id} onClick={() => run(
                    "You are a voice director. Give a specific voice profile and 3 sample dialogue lines in correct script format.",
                    `Character: ${c.name}, Role: ${c.role}, Voice: ${c.voice || "not set"}, Genre: ${genre}, Format: ${fmt}`
                  )} style={{
                    display: "flex", alignItems: "center", gap: 10, width: "100%",
                    padding: "10px 12px", background: "#FAFAFA", border: "1px solid #EBEBEB",
                    borderRadius: 4, marginBottom: 4, cursor: "pointer", fontFamily: "inherit",
                  }}>
                    <div style={{ width: 28, height: 28, borderRadius: "50%", background: "#000", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 800, color: "#FFF" }}>{c.name[0]}</div>
                    <div style={{ textAlign: "left" }}>
                      <p style={{ margin: 0, fontSize: 12, fontWeight: 700, color: "#000" }}>{c.name}</p>
                      <p style={{ margin: 0, fontSize: 11, color: "#AAA" }}>{c.role}</p>
                    </div>
                  </button>
                ))
            }
          </div>
        )}

        {/* Response */}
        {(response || loading) && (
          <div style={{ borderTop: "1px solid #EBEBEB", paddingTop: 16 }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 10 }}>
              <label style={css.label}>Response</label>
              {response && <button onClick={() => { setResponse(""); setPrompt(""); }} style={{ background: "none", border: "none", color: "#AAA", cursor: "pointer", fontSize: 12 }}>Clear</button>}
            </div>
            <div style={{ background: "#FAFAFA", border: "1px solid #EBEBEB", borderRadius: 6, padding: "14px 16px", maxHeight: 300, overflowY: "auto" }}>
              <p style={{ margin: 0, fontSize: 12, color: "#333", whiteSpace: "pre-wrap", lineHeight: 1.8, fontFamily: "'Courier New', monospace" }}>
                {loading ? "..." : response}
              </p>
            </div>
          </div>
        )}
      </div>

      {/* Keyboard hint */}
      <div style={{ padding: "12px 20px", borderTop: "1px solid #EBEBEB" }}>
        <p style={{ margin: 0, fontSize: 10, color: "#CCC", letterSpacing: "0.04em" }}>Close with <kbd style={{ background: "#F4F4F4", border: "1px solid #DDD", borderRadius: 3, padding: "1px 5px", fontSize: 10 }}>Ctrl+Space</kbd></p>
      </div>
    </div>
  );
}

// ─── CAST PANEL (inline collapsible, not an overlay) ─────────────────────────
function CastPanel({ cast, onUpdate, onAdd, onDelete, onClose }) {
  const [sel, setSel] = useState(0);
  const [saved, setSaved] = useState(false);
  const imgInputRef = useRef(null);
  const cur = cast[sel];

  const upd = (field, val) => {
    onUpdate(cast[sel].id, field, val);
  };

  const handleDone = () => {
    setSaved(true);
    setTimeout(() => { setSaved(false); onClose(); }, 600);
  };

  // Read file as base64 and store on character
  const handleImageChange = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      upd("image", ev.target.result);
    };
    reader.readAsDataURL(file);
    // reset so same file can be re-selected
    e.target.value = "";
  };

    <div style={{
      width: 420, borderRight: "1px solid #EBEBEB",

                }
              </div>
              <div style={{ overflow: "hidden", flex: 1 }}>
                <p style={{ margin: 0, fontSize: 12, fontWeight: i === sel ? 700 : 500, color: i === sel ? "#000" : "#666", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{c.name}</p>
                <p style={{ margin: "2px 0 0", fontSize: 10, color: "#AAA" }}>{c.role}</p>
              </div>
              {c.image && (
                <div style={{ position: "relative", flexShrink: 0 }}
                  onMouseEnter={e => {
                    const dot = e.currentTarget;
                    const r = dot.getBoundingClientRect();
                    dot.querySelector(".photo-popup").style.display = "block";
                  }}

                  }}
                >
                  <span style={{ width: 7, height: 7, borderRadius: "50%", background: "#000", display: "inline-block", opacity: 0.25, cursor: "pointer" }} />
                  <div className="photo-popup" style={{
                    display: "none", position: "fixed", zIndex: 900,
                    width: 120, height: 120, borderRadius: 6, overflow: "hidden",
                    border: "1px solid #D0D0D0", boxShadow: "0 4px 16px rgba(0,0,0,0.15)",
                    transform: "translateX(-130px) translateY(-50px)",
                  }}>
                    <img src={c.image} alt={c.name} style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                  </div>
                </div>
              )}
            </button>
          ))}

          <p style={{ ...css.label, marginBottom: 12 }}>Voice</p>

            <div key={f} style={{ marginBottom: 10 }}>
              <label style={css.label}>{l}</label>
              <input value={cur[f] || ""} onChange={e => upd(f, e.target.value)} style={{ ...css.input, fontSize: 12 }} />
            </div>
          ))}

          <p style={{ ...css.label, marginBottom: 12 }}>Psychology</p>
          {[["motivation","Motivation"],["fear","Fear"],["secret","Secret"],["arc","Arc"]].map(([f, l]) => (
            <div key={f} style={{ marginBottom: 10 }}>
              <label style={css.label}>{l}</label>

          ))}

          {/* Done button */}

            <button onClick={handleDone} style={{

        </div>
      ) : (
        <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 12 }}>

          )}
        </div>
      )}
    </div>
  );
}

// ─── ROOT ─────────────────────────────────────────────────────────────────────
function Root() {
  const [screen, setScreen] = useState("landing"); // landing | auth | setup | dashboard | app
  const [profile, setProfile] = useState(() => LS.get("sf_profile", null));
  const [user, setUser] = useState(() => LS.get("sf_current_user", null));
  const [dashProjects, setDashProjects] = useState([]);
  const [dashSave, setDashSave] = useState(null);
  const [activeProject, setActiveProject] = useState(null);

  const enter = () => {
    if (!user) { setScreen("auth"); return; }
    const ps = LS.get(`sf_projects_${user.email}`, []);
    if (ps.length === 1) { openProject(ps[0], (updated) => { LS.set(`sf_projects_${user.email}`, updated); setDashProjects(updated); }, ps); return; }
    setScreen("dashboard");
  };
  const save = (p) => { setProfile(p); LS.set("sf_profile", p); setScreen(profile ? "dashboard" : "dashboard"); };
  const goHome = () => setScreen("landing");

  const handleAuth = (u) => {
    setUser(u);
    LS.set("sf_current_user", u);
    if (!profile) { setScreen("setup"); return; }
    setScreen("dashboard");
  };
  const signOut = () => {
    LS.set("sf_current_user", null);
    setUser(null);
    setActiveProject(null);
    setScreen("landing");
  };

  const openProject = (p, saveFn, allProjects) => {
    setActiveProject(p);
    setDashSave(() => saveFn);
    setDashProjects(allProjects);
    setScreen("app");
  };

  const newProject = (saveFn, allProjects) => {
    if (!profile) return;
    const p = { id: Date.now(), title: "Untitled", format: profile.format, genre: profile.genre, lines: [], cast: [], notes: "", moodCards: [], created: Date.now() };
    const updated = [p, ...allProjects];
    saveFn(updated);
    setActiveProject(p);
    setDashSave(() => saveFn);
    setDashProjects(updated);
    setScreen("app");
  };

  if (screen === "landing") return <Landing onStart={enter} hasProfile={!!profile} />;
  if (screen === "auth")    return <AuthScreen onAuth={handleAuth} />;
  if (screen === "setup")   return <Setup existing={profile} onSave={save} />;
  if (screen === "dashboard" && user) {
    const projectsKey = `sf_projects_${user.email}`;
    return <Dashboard
      user={user}
      onOpen={openProject}
      onNew={newProject}
      onSignOut={signOut}
    />;
  }
  return <App
    profile={profile || { name: user?.name || "", format: "film", genre: "Dark Fantasy", genres: [], styles: [] }}
    onEditProfile={() => setScreen("setup")}
    onHome={() => setScreen("dashboard")}
    initialProject={activeProject}
    onSaveProject={(updated) => {
      if (!user || !dashSave) return;
      const allProjects = LS.get(`sf_projects_${user.email}`, []);
      const newAll = allProjects.map(p => p.id === updated.id ? updated : p);
      if (!newAll.find(p => p.id === updated.id)) newAll.unshift(updated);
      LS.set(`sf_projects_${user.email}`, newAll);
      setDashProjects(newAll);
    }}
    onBackToDash={() => setScreen("dashboard")}
  />;
}

function MoodBoard({ project, onUpdateCards, onClose }) {
  const [prompt, setPrompt] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const cards = project?.moodCards || [];

  const research = async () => {
    if (!prompt.trim()) return;
    setLoading(true); setError("");
    try {
      const _isArtifact = window.location.hostname.includes("claude.ai") || window.location.protocol === "blob:";
      const _localKey = LS.get("sf_api_key", null);
      const _apiUrl = (_isArtifact || _localKey) ? "https://api.anthropic.com/v1/messages" : "/api/chat";
      const _headers = { "Content-Type": "application/json", ...(_localKey && !_isArtifact ? { "x-api-key": _localKey, "anthropic-version": "2023-06-01" } : {}) };
      const res = await fetch(_apiUrl, {
        method: "POST",
        headers: _headers,
        body: JSON.stringify({
          model: "claude-sonnet-4-5",
          max_tokens: 1000,
          system: "You are a creative research assistant for writers. Return ONLY valid JSON — an array of objects with keys: title (short, 3-5 words), body (2-3 sentence insight, vivid and specific), tag (one word category: Tone / World / Character / Style / Theme / Visual). No markdown, no preamble.",
          messages: [{ role: "user", content: `Research this for a writing project. Extract 4-6 key creative reference points a writer could use:

${prompt}` }],
        }),
      });
      const d = await res.json();
      const raw = d.content?.filter(b => b.type === "text").map(b => b.text).join("") || "[]";
      const parsed = JSON.parse(raw.replace(/```json|```/g, "").trim());
      const newCards = parsed.map((c, i) => ({ id: Date.now() + i, ...c, source: prompt.trim() }));
      onUpdateCards([...cards, ...newCards]);
      setPrompt("");
    } catch(e) { setError("Research failed. Check your prompt and try again."); }
    setLoading(false);
  };

  const removeCard = (id) => onUpdateCards(cards.filter(c => c.id !== id));

  const TAG_COLORS = { Tone: "#F0F0F0", World: "#F0F0F0", Character: "#000", Style: "#F0F0F0", Theme: "#F0F0F0", Visual: "#F0F0F0" };
  const TAG_TEXT = { Character: "#FFF" };

  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column", overflowY: "auto", padding: "48px 64px 80px", maxWidth: 900, margin: "0 auto", width: "100%", boxSizing: "border-box" }}>
      <div style={{ marginBottom: 32 }}>
        <h2 style={{ margin: "0 0 6px", fontSize: 22, fontWeight: 900, color: "#000", letterSpacing: "-0.02em" }}>Mood Board</h2>
        <p style={{ margin: 0, fontSize: 13, color: "#AAA" }}>Research reference points — injected into AI context when you write.</p>
      </div>

      {/* Research input */}
      <div style={{ display: "flex", gap: 10, marginBottom: 40 }}>
        <input
          value={prompt}
          onChange={e => setPrompt(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter" && !loading) research(); }}
          placeholder="e.g. Kingdom Hearts lore, Blade Runner visual tone, Breaking Bad character arcs..."
          style={{ ...css.input, flex: 1, fontSize: 13 }}
        />
        <button onClick={research} disabled={loading || !prompt.trim()} style={{
          padding: "9px 20px", background: "#000", color: "#FFF", border: "none",
          borderRadius: 4, cursor: loading || !prompt.trim() ? "not-allowed" : "pointer",
          fontFamily: "inherit", fontWeight: 700, fontSize: 13,
          opacity: loading || !prompt.trim() ? 0.4 : 1, whiteSpace: "nowrap",
        }}>{loading ? "Researching..." : "Research"}</button>
      </div>

      {error && <p style={{ fontSize: 12, color: "#888", marginBottom: 16 }}>{error}</p>}

      {/* Cards grid */}
      {cards.length === 0 ? (
        <div style={{ textAlign: "center", padding: "60px 0", color: "#CCC" }}>
          <p style={{ fontSize: 32, margin: "0 0 12px" }}>◈</p>
          <p style={{ fontSize: 13, margin: 0 }}>No reference cards yet. Research something above.</p>
        </div>
      ) : (
        <>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(260px, 1fr))", gap: 16 }}>
            {cards.map(card => (
              <div key={card.id} style={{
                background: "#FAFAFA", border: "1px solid #EBEBEB", borderRadius: 8,
                padding: "16px 18px", position: "relative",
              }}>
                <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 8 }}>
                  <span style={{
                    fontSize: 9, fontWeight: 800, letterSpacing: "0.12em", textTransform: "uppercase",
                    padding: "3px 8px", borderRadius: 3,
                    background: TAG_COLORS[card.tag] || "#F0F0F0",
                    color: TAG_TEXT[card.tag] || "#555",
                    border: card.tag === "Character" ? "none" : "1px solid #E0E0E0",
                  }}>{card.tag}</span>
                  <button onClick={() => removeCard(card.id)} style={{
                    background: "none", border: "none", cursor: "pointer",
                    color: "#CCC", fontSize: 14, lineHeight: 1, padding: "0 0 0 8px",
                  }}>×</button>
                </div>
                <p style={{ margin: "0 0 6px", fontSize: 13, fontWeight: 700, color: "#000", lineHeight: 1.3 }}>{card.title}</p>
                <p style={{ margin: "0 0 10px", fontSize: 12, color: "#666", lineHeight: 1.6 }}>{card.body}</p>
                <p style={{ margin: 0, fontSize: 10, color: "#CCC", fontStyle: "italic" }}>via: {card.source}</p>
              </div>
            ))}
          </div>
          <p style={{ marginTop: 20, fontSize: 11, color: "#CCC" }}>
            {cards.length} card{cards.length !== 1 ? "s" : ""} · All cards are included in AI context when you write in this project.
          </p>
        </>
      )}
    </div>
  );
}

// ─── SCRIPT IMPORT MODAL ──────────────────────────────────────────────────────
function ImportModal({ profile, onImport, onClose }) {
  const [raw, setRaw] = useState("");
  const [filePayload, setFilePayload] = useState(null);
  const [fileName, setFileName] = useState("");
  const [fmt, setFmt] = useState(profile?.format || "film");
  const [genre, setGenre] = useState(profile?.genre || "Dark Fantasy");
  const [title, setTitle] = useState("Imported Script");
  const [loading, setLoading] = useState(false);
  const [status, setStatus] = useState("");
  const [error, setError] = useState("");
  const [pendingLines, setPendingLines] = useState(null);
  const [uncertainLines, setUncertainLines] = useState([]);
  const fileRef = useRef(null);

  const readAsBase64 = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });

  const loadScript = (src) => new Promise((resolve, reject) => {
    if (document.querySelector(`script[src="${src}"]`)) { resolve(); return; }
    const s = document.createElement("script");
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });

  const handleFile = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    e.target.value = "";
    setError(""); setStatus("Reading file...");
    setFileName(file.name);
    setTitle(file.name.replace(/\.[^.]+$/, "").replace(/[-_]/g, " ") || "Imported Script");

    const ext = file.name.split(".").pop().toLowerCase();
    const imageTypes = ["jpg","jpeg","png","gif","webp","bmp","tiff","heic"];
    const textTypes = ["txt","fountain","fdx","md","rtf"];

    if (imageTypes.includes(ext)) {
      const b64 = await readAsBase64(file);
      setFilePayload({ type: "image", base64: b64, mediaType: file.type || "image/jpeg" });
      setRaw(""); setStatus("Image loaded — AI will read it on import.");
    } else if (ext === "pdf") {
      const b64 = await readAsBase64(file);
      setFilePayload({ type: "pdf", base64: b64, mediaType: "application/pdf" });
      setRaw(""); setStatus("PDF loaded — AI will extract text on import.");
    } else if (ext === "docx") {
      setStatus("Extracting text from DOCX...");
      try {
        await loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");
        const arrayBuffer = await file.arrayBuffer();
        const result = await window.mammoth.extractRawText({ arrayBuffer });
        setRaw(result.value); setFilePayload(null);
        setStatus(`DOCX extracted — ${result.value.split("\n").filter(l=>l.trim()).length} lines`);
      } catch(err) {
        setError("Could not read DOCX. Try saving as .txt from Word first.");
        setStatus("");
      }
    } else if (textTypes.includes(ext)) {
      const reader = new FileReader();
      reader.onload = ev => {
        setRaw(ev.target.result); setFilePayload(null);
        setStatus(`Text loaded — ${ev.target.result.split("\n").filter(l=>l.trim()).length} lines`);
      };
      reader.readAsText(file);
    } else {
      // try as plain text
      const reader = new FileReader();
      reader.onload = ev => {
        const text = ev.target.result;
        if (typeof text === "string" && text.trim()) {
          setRaw(text); setFilePayload(null);
          setStatus(`File loaded — ${text.split("\n").filter(l=>l.trim()).length} lines`);
        } else {
          setError("Could not read this file. Try exporting as PDF, DOCX, or TXT first.");
          setStatus("");
        }
      };
      reader.onerror = () => setError("File could not be read.");
      reader.readAsText(file);
    }
  };

  const canImport = raw.trim().length > 0 || filePayload !== null;

  const doImport = async () => {
    if (!canImport) return;
    setLoading(true); setError(""); setStatus("AI is reading your script...");
    const fmt_label = FORMATS.find(f => f.id === fmt)?.label || "Script";
    const _isArtifact = window.location.hostname.includes("claude.ai") || window.location.protocol === "blob:";
    const _localKey = LS.get("sf_api_key", null);
    const _apiUrl = (_isArtifact || _localKey) ? "https://api.anthropic.com/v1/messages" : "/api/chat";
    const _headers = { "Content-Type": "application/json", ...(_localKey && !_isArtifact ? { "x-api-key": _localKey, "anthropic-version": "2023-06-01" } : {}) };

    try {
      let messages;
      if (filePayload?.type === "image") {
        messages = [{ role: "user", content: [
          { type: "image", source: { type: "base64", media_type: filePayload.mediaType, data: filePayload.base64 } },
          { type: "text", text: `Extract ALL text from this script image and classify each line as: action, character, dialogue, location, direction, or note.\nFormat: ${fmt_label}. Genre: ${genre}.\nReturn ONLY valid JSON array of {text, mode} objects. No markdown. Omit blank lines.` }
        ]}];
      } else if (filePayload?.type === "pdf") {
        messages = [{ role: "user", content: [
          { type: "document", source: { type: "base64", media_type: "application/pdf", data: filePayload.base64 } },
          { type: "text", text: `Extract ALL text from this script PDF and classify each line as: action, character, dialogue, location, direction, or note.\nFormat: ${fmt_label}. Genre: ${genre}.\nReturn ONLY valid JSON array of {text, mode} objects. No markdown. Omit blank lines.` }
        ]}];
      } else {
        messages = [{ role: "user", content: `Format: ${fmt_label}. Genre: ${genre}.\n\nClassify every line of this script:\n\n${raw.slice(0, 8000)}` }];
      }

      const res = await fetch(_apiUrl, {
        method: "POST", headers: _headers,
        body: JSON.stringify({
          model: "claude-sonnet-4-5", max_tokens: 4000,
          system: "You are a script formatting engine. Classify each line into modes: action, character, dialogue, location, direction, note. For lines you are less than 90% confident about, add a \"uncertain\": true field. Return ONLY valid JSON — array of {text, mode, uncertain?} objects. No markdown, no preamble. Omit blank lines.",
          messages,
        }),
      });
      const d = await res.json();
      const raw_text = d.content?.filter(b => b.type === "text").map(b => b.text).join("") || "[]";
      const parsed = JSON.parse(raw_text.replace(/```json|```/g, "").trim());
      if (parsed.length === 0) { setError("No lines found. Try a different file."); setLoading(false); setStatus(""); return; }
      const uncertain = parsed.filter(l => l.uncertain);
      if (uncertain.length > 0) {
        // Show confirmation for uncertain lines
        setPendingLines(parsed);
        setUncertainLines(uncertain);
        setLoading(false);
        setStatus(`${parsed.length} lines classified. ${uncertain.length} need your review.`);
        return;
      }
      const lines = parsed.map((l, i) => ({ id: Date.now() + i, text: l.text || "", mode: l.mode || "action" }));
      setStatus(`Done — ${lines.length} lines imported.`);
      onImport({ title, format: fmt, genre, lines });
    } catch(err) {
      setError("Import failed: " + (err.message || "unknown error"));
      setStatus("");
    }
    setLoading(false);
  };

  const ACCEPTED = ".txt,.fountain,.fdx,.pdf,.doc,.docx,.md,.rtf,.jpg,.jpeg,.png,.gif,.webp,.bmp,.tiff,.heic";

  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.4)", zIndex:2000, display:"flex", alignItems:"center", justifyContent:"center" }}
      onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div style={{ width:700, maxHeight:"92vh", background:"#FFF", borderRadius:10, display:"flex", flexDirection:"column", overflow:"hidden", boxShadow:"0 8px 40px rgba(0,0,0,0.2)" }}>
        <div style={{ padding:"20px 24px", borderBottom:"1px solid #EBEBEB", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <div>
            <p style={{ margin:0, fontSize:15, fontWeight:800, color:"#000" }}>Import Script</p>
            <p style={{ margin:"3px 0 0", fontSize:12, color:"#AAA" }}>Upload any file or paste text — AI reads and formats everything.</p>
          </div>
          <button onClick={onClose} style={{ background:"none", border:"none", cursor:"pointer", fontSize:22, color:"#AAA", lineHeight:1, padding:4 }}>×</button>
        </div>

        <div style={{ flex:1, overflowY:"auto", padding:24, display:"flex", flexDirection:"column", gap:16 }}>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:12 }}>
            <div><label style={css.label}>Project title</label><input value={title} onChange={e => setTitle(e.target.value)} style={css.input} /></div>
            <div><label style={css.label}>Format</label>
              <select value={fmt} onChange={e => setFmt(e.target.value)} style={{ ...css.input, fontSize:12 }}>
                {FORMATS.map(f => <option key={f.id} value={f.id}>{f.label}</option>)}
              </select>
            </div>
            <div><label style={css.label}>Genre</label>
              <select value={genre} onChange={e => setGenre(e.target.value)} style={{ ...css.input, fontSize:12 }}>
                {GENRES.map(g => <option key={g}>{g}</option>)}
              </select>
            </div>
          </div>

          {/* Uncertain lines review */}
          {pendingLines && uncertainLines.length > 0 && (
            <div style={{ background: "#FAFAFA", border: "1px solid #E0E0E0", borderRadius: 6, padding: 16 }}>
              <p style={{ margin: "0 0 4px", fontSize: 13, fontWeight: 700, color: "#000" }}>Review {uncertainLines.length} uncertain line{uncertainLines.length !== 1 ? "s" : ""}</p>
              <p style={{ margin: "0 0 14px", fontSize: 12, color: "#AAA" }}>The AI wasn't sure about these. Pick the correct mode for each.</p>
              {uncertainLines.map((line, i) => (
                <div key={i} style={{ marginBottom: 12, padding: "10px 12px", background: "#FFF", border: "1px solid #EBEBEB", borderRadius: 4 }}>
                  <p style={{ margin: "0 0 8px", fontSize: 12, fontFamily: "'Courier New', monospace", color: "#333" }}>{line.text}</p>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
                    {["action","character","dialogue","location","direction","note"].map(mode => (
                      <button key={mode} onClick={() => {
                        const updated = pendingLines.map(l => l === line ? { ...l, mode, uncertain: false } : l);
                        setPendingLines(updated);
                        const stillUncertain = updated.filter(l => l.uncertain);
                        setUncertainLines(stillUncertain);
                      }} style={{
                        padding: "4px 10px", borderRadius: 3, cursor: "pointer", fontFamily: "inherit",
                        fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.06em",
                        background: line.mode === mode ? "#000" : "#F4F4F4",
                        color: line.mode === mode ? "#FFF" : "#666",
                        border: `1px solid ${line.mode === mode ? "#000" : "#E0E0E0"}`,
                      }}>{mode}</button>
                    ))}
                  </div>
                </div>
              ))}
              <button onClick={() => {
                const lines = pendingLines.map((l, i) => ({ id: Date.now() + i, text: l.text || "", mode: l.mode || "action" }));
                onImport({ title, format: fmt, genre, lines });
              }} style={{ width: "100%", padding: "9px", background: "#000", color: "#FFF", border: "none", borderRadius: 4, cursor: "pointer", fontFamily: "inherit", fontWeight: 700, fontSize: 13, marginTop: 8 }}>
                Looks good — Import
              </button>
            </div>
          )}

          {/* Uncertain lines review */}
          {pendingLines && uncertainLines.length > 0 && (
            <div style={{ background: "#FAFAFA", border: "1px solid #E0E0E0", borderRadius: 6, padding: 16 }}>
              <p style={{ margin: "0 0 4px", fontSize: 13, fontWeight: 700, color: "#000" }}>Review {uncertainLines.length} uncertain line{uncertainLines.length !== 1 ? "s" : ""}</p>
              <p style={{ margin: "0 0 14px", fontSize: 12, color: "#AAA" }}>The AI wasn't sure about these. Pick the correct mode for each.</p>
              {uncertainLines.map((line, i) => (
                <div key={i} style={{ marginBottom: 12, padding: "10px 12px", background: "#FFF", border: "1px solid #EBEBEB", borderRadius: 4 }}>
                  <p style={{ margin: "0 0 8px", fontSize: 12, fontFamily: "'Courier New', monospace", color: "#333" }}>{line.text}</p>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
                    {["action","character","dialogue","location","direction","note"].map(mode => (
                      <button key={mode} onClick={() => {
                        const updated = pendingLines.map(l => l === line ? { ...l, mode, uncertain: false } : l);
                        setPendingLines(updated);
                        setUncertainLines(updated.filter(l => l.uncertain));
                      }} style={{ padding: "4px 10px", borderRadius: 3, cursor: "pointer", fontFamily: "inherit", fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.06em", background: line.mode === mode ? "#000" : "#F4F4F4", color: line.mode === mode ? "#FFF" : "#666", border: `1px solid ${line.mode === mode ? "#000" : "#E0E0E0"}` }}>{mode}</button>
                    ))}
                  </div>
                </div>
              ))}
              <button onClick={() => { const ls = pendingLines.map((l,i) => ({ id: Date.now()+i, text: l.text||"", mode: l.mode||"action" })); onImport({ title, format: fmt, genre, lines: ls }); }} style={{ width:"100%", padding:"9px", background:"#000", color:"#FFF", border:"none", borderRadius:4, cursor:"pointer", fontFamily:"inherit", fontWeight:700, fontSize:13, marginTop:8 }}>Looks good — Import</button>
            </div>
          )}

          {/* Drop zone */}
          <div
            onDragOver={e => { e.preventDefault(); e.currentTarget.style.borderColor="#000"; }}
            onDragLeave={e => { e.currentTarget.style.borderColor="#D0D0D0"; }}
            onDrop={e => {
              e.preventDefault(); e.currentTarget.style.borderColor="#D0D0D0";
              const file = e.dataTransfer.files?.[0];
              if (file) { const dt = new DataTransfer(); dt.items.add(file); fileRef.current.files = dt.files; handleFile({ target: fileRef.current }); }
            }}
            onClick={() => fileRef.current?.click()}
            style={{ border:"1px dashed #D0D0D0", borderRadius:6, padding:"20px 24px", textAlign:"center", cursor:"pointer", transition:"border-color 0.15s", background: fileName ? "#FAFAFA" : "#FFF" }}
          >
            {fileName ? (
              <div>
                <p style={{ margin:"0 0 4px", fontSize:13, fontWeight:700, color:"#000" }}>📄 {fileName}</p>
                <p style={{ margin:0, fontSize:11, color:"#AAA" }}>{status}</p>
              </div>
            ) : (
              <div>
                <p style={{ margin:"0 0 6px", fontSize:13, color:"#555" }}>Drop file here or click to browse</p>
                <p style={{ margin:0, fontSize:11, color:"#BBB" }}>PDF · DOCX · TXT · Fountain · JPG · PNG · and more</p>
              </div>
            )}
            <input ref={fileRef} type="file" accept={ACCEPTED} style={{ display:"none" }} onChange={handleFile} />
          </div>

          <div style={{ display:"flex", alignItems:"center", gap:12 }}>
            <div style={{ flex:1, height:1, background:"#EBEBEB" }} />
            <span style={{ fontSize:10, color:"#CCC", fontWeight:600, textTransform:"uppercase", letterSpacing:"0.1em" }}>or paste text</span>
            <div style={{ flex:1, height:1, background:"#EBEBEB" }} />
          </div>

          <textarea value={raw}
            onChange={e => { setRaw(e.target.value); setFileName(""); setFilePayload(null); setStatus(""); }}
            placeholder={"Paste your script here...\n\nFADE IN:\n\nEXT. CITY — NIGHT\n\nKAEL moves through the dark...\n\n                    KAEL\n          I know what I saw."}
            style={{ ...css.input, resize:"none", height:180, fontFamily:"'Courier New',monospace", fontSize:12, lineHeight:1.7, color:"#333" }}
          />

          <div style={{ background:"#FAFAFA", border:"1px solid #EBEBEB", borderRadius:4, padding:"10px 14px" }}>
            <p style={{ margin:0, fontSize:11, color:"#888", lineHeight:1.6 }}>
              <strong style={{ color:"#555" }}>Google Docs:</strong> File → Download → Microsoft Word (.docx), then upload here.
            </p>
          </div>

          {error && <p style={{ fontSize:12, color:"#888", margin:0 }}>{error}</p>}
        </div>

        <div style={{ padding:"16px 24px", borderTop:"1px solid #EBEBEB", display:"flex", justifyContent:"space-between", alignItems:"center", gap:10 }}>
          <p style={{ margin:0, fontSize:11, color:"#CCC" }}>{loading ? status : canImport ? "Ready to import" : "Upload a file or paste text above"}</p>
          <div style={{ display:"flex", gap:10 }}>
            <button onClick={onClose} style={{ padding:"9px 20px", background:"none", border:"1px solid #D0D0D0", borderRadius:4, cursor:"pointer", fontFamily:"inherit", fontSize:13, color:"#666" }}>Cancel</button>
            <button onClick={doImport} disabled={loading || !canImport} style={{
              padding:"9px 24px", background:"#000", color:"#FFF", border:"none", borderRadius:4,
              cursor: loading || !canImport ? "not-allowed" : "pointer",
              fontFamily:"inherit", fontWeight:700, fontSize:13, opacity: loading || !canImport ? 0.4 : 1,
            }}>{loading ? "Importing..." : "Import & Format"}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

    <div style={{

  );
}

// ─── AUTH SCREEN (Feature 6) ──────────────────────────────────────────────────
function AuthScreen({ onAuth }) {
  const [mode, setMode] = useState("signin"); // signin | signup
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [pass, setPass] = useState("");
  const [err, setErr] = useState("");

  const submit = () => {
    setErr("");
    if (!email.trim() || !pass.trim()) { setErr("Email and password required."); return; }
    const key = `sf_user_${email.trim().toLowerCase()}`;
    if (mode === "signup") {
      if (!name.trim()) { setErr("Name required."); return; }
      if (LS.get(key, null)) { setErr("Account already exists. Sign in instead."); return; }
      const user = { name: name.trim(), email: email.trim().toLowerCase(), pass };
      LS.set(key, user);
      onAuth(user);
    } else {
      const user = LS.get(key, null);
      if (!user) { setErr("No account found. Sign up instead."); return; }
      if (user.pass !== pass) { setErr("Incorrect password."); return; }
      onAuth(user);
    }
  };

  return (
    <div style={{ minHeight: "100vh", background: "#FFF", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
      <p style={{ margin: "0 0 40px", fontSize: 11, fontWeight: 900, letterSpacing: "0.25em", textTransform: "uppercase", color: "#000" }}>STORYFORGE</p>
      <div style={{ width: 360, border: "1px solid #E8E8E8", borderRadius: 8, padding: "40px 36px" }}>
        <h2 style={{ margin: "0 0 28px", fontSize: 22, fontWeight: 900, color: "#000", letterSpacing: "-0.02em" }}>
          {mode === "signin" ? "Sign in" : "Create account"}
        </h2>
        {mode === "signup" && (
          <div style={{ marginBottom: 14 }}>
            <label style={css.label}>Name</label>
            <input value={name} onChange={e => setName(e.target.value)} placeholder="B. Hill" style={css.input}
              onKeyDown={e => e.key === "Enter" && submit()} />
          </div>
        )}
        <div style={{ marginBottom: 14 }}>
          <label style={css.label}>Email</label>
          <input value={email} onChange={e => setEmail(e.target.value)} placeholder="you@email.com" style={css.input}
            onKeyDown={e => e.key === "Enter" && submit()} />
        </div>
        <div style={{ marginBottom: 20 }}>
          <label style={css.label}>Password</label>
          <input type="password" value={pass} onChange={e => setPass(e.target.value)} placeholder="••••••••" style={css.input}
            onKeyDown={e => e.key === "Enter" && submit()} />
        </div>
        {err && <p style={{ margin: "0 0 14px", fontSize: 12, color: "#888" }}>{err}</p>}
        <button onClick={submit} style={{ width: "100%", padding: "11px", background: "#000", color: "#FFF", border: "none", borderRadius: 4, cursor: "pointer", fontFamily: "inherit", fontWeight: 700, fontSize: 14 }}>
          {mode === "signin" ? "Sign in" : "Create account"}
        </button>
        <p style={{ margin: "16px 0 0", fontSize: 12, color: "#AAA", textAlign: "center" }}>
          {mode === "signin" ? "No account? " : "Have an account? "}
          <button onClick={() => { setMode(mode === "signin" ? "signup" : "signin"); setErr(""); }}
            style={{ background: "none", border: "none", cursor: "pointer", color: "#000", fontWeight: 700, fontSize: 12, fontFamily: "inherit", padding: 0 }}>
            {mode === "signin" ? "Sign up" : "Sign in"}
          </button>
        </p>
      </div>
    </div>
  );
}

// ─── PROJECT DASHBOARD (Feature 6) ───────────────────────────────────────────

  const [projects, setProjects] = useState(() => LS.get(projectsKey, []));

  const deleteProject = (id) => save(projects.filter(p => p.id !== id));

    const copy = { ...p, id: Date.now(), title: p.title + " (copy)", created: Date.now() };

    <div style={{ minHeight: "100vh", background: "#FFF", display: "flex", flexDirection: "column" }}>

          <span style={{ fontSize: 12, color: "#AAA" }}>{user.name}</span>
          <button onClick={onSignOut} style={{ background: "none", border: "1px solid #E8E8E8", borderRadius: 4, padding: "6px 14px", fontSize: 12, cursor: "pointer", fontFamily: "inherit", color: "#666" }}>Sign out</button>
        </div>

          <h2 style={{ margin: 0, fontSize: 26, fontWeight: 900, color: "#000", letterSpacing: "-0.02em" }}>Your Projects</h2>
          <button onClick={() => onNew(save, projects)} style={{ padding: "9px 20px", background: "#000", color: "#FFF", border: "none", borderRadius: 4, cursor: "pointer", fontFamily: "inherit", fontWeight: 700, fontSize: 13 }}>+ New Project</button>

// ─── KEYBOARD SHORTCUTS OVERLAY (Section 10) ─────────────────────────────────
function ShortcutsOverlay({ onClose }) {
  useEffect(() => {
    const h = (e) => { if (e.key === "Escape" || (e.key === "/" && (e.metaKey || e.ctrlKey))) onClose(); };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [onClose]);
  const shortcuts = [
    ["Tab","Cycle block type"],["Enter","New line (smart)"],["Shift+Tab","—"],["Esc","Cancel / back to action"],
    ["⌘K","Toggle AI panel"],["⌘N","Inline note at cursor"],["⌘A","Select current block"],
    ["⌘B","Beat Board"],["⌘M","Scene Navigator"],["⌘F","Focus / Typewriter mode"],
    ["⌘/","This shortcuts list"],["Right-click","Add to cast"],
  ];
  return (
    <div onClick={onClose} style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.35)", zIndex:3000, display:"flex", alignItems:"center", justifyContent:"center" }}>
      <div onClick={e=>e.stopPropagation()} style={{ background:"#FFF", border:"1px solid #D0D0D0", borderRadius:8, padding:"32px 36px", width:480, boxShadow:"0 8px 40px rgba(0,0,0,0.18)" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:24 }}>
          <p style={{ margin:0, fontSize:13, fontWeight:800, color:"#000", letterSpacing:"-0.01em" }}>Keyboard Shortcuts</p>
          <button onClick={onClose} style={{ background:"none", border:"none", cursor:"pointer", color:"#CCC", fontSize:18 }}>×</button>
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"8px 32px" }}>
          {shortcuts.map(([k,v]) => (
            <div key={k} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"5px 0", borderBottom:"1px solid #F5F5F5" }}>
              <span style={{ fontSize:11, color:"#888" }}>{v}</span>
              <kbd style={{ background:"#F4F4F4", border:"1px solid #DDD", borderRadius:3, padding:"2px 7px", fontSize:10, fontWeight:700, color:"#555", fontFamily:"inherit", whiteSpace:"nowrap" }}>{k}</kbd>
            </div>
          ))}
        </div>
        <p style={{ margin:"20px 0 0", fontSize:10, color:"#CCC", textAlign:"center" }}>Click anywhere or press ⌘/ to close</p>
      </div>
    </div>
  );
}

// ─── BEAT BOARD (Section 1) ───────────────────────────────────────────────────
const ACT_LABELS = ["Act 1","Act 2A","Midpoint","Act 2B","Act 3","Custom"];

function BeatBoard({ project, onUpdate }) {
  const beats = project?.beats || [];
  const [dragging, setDragging] = useState(null);
  const [editing, setEditing] = useState(null); // id of card being edited
  const [dragOver, setDragOver] = useState(null);

  const save = (newBeats) => onUpdate({ beats: newBeats });

  const addBeat = () => {
    const b = { id: Date.now(), title:"New Beat", body:"", act:"Act 1" };
    save([...beats, b]);
    setEditing(b.id);
  };

  const updateBeat = (id, changes) => save(beats.map(b => b.id === id ? { ...b, ...changes } : b));
  const deleteBeat = (id) => save(beats.filter(b => b.id !== id));

  const handleDragStart = (e, idx) => { setDragging(idx); e.dataTransfer.effectAllowed = "move"; };
  const handleDragOver = (e, idx) => { e.preventDefault(); setDragOver(idx); };
  const handleDrop = (e, idx) => {
    e.preventDefault();
    if (dragging === null || dragging === idx) return;
    const next = [...beats];
    const [moved] = next.splice(dragging, 1);
    next.splice(idx, 0, moved);
    save(next);
    setDragging(null); setDragOver(null);
  };

  // group by act
  const actGroups = ACT_LABELS.filter(a => beats.some(b => b.act === a));

  return (
    <div style={{ flex:1, overflowY:"auto", padding:"32px 40px 80px", background:"#FAFAFA" }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:28 }}>
        <div>
          <h2 style={{ margin:"0 0 4px", fontSize:18, fontWeight:900, color:"#000", letterSpacing:"-0.02em" }}>Beat Board</h2>
          <p style={{ margin:0, fontSize:12, color:"#AAA" }}>Drag to reorder — planning only, does not affect script.</p>
        </div>
        <button onClick={addBeat} style={{ padding:"7px 16px", background:"#000", color:"#FFF", border:"none", borderRadius:4, cursor:"pointer", fontFamily:"inherit", fontWeight:700, fontSize:12 }}>+ Beat</button>
      </div>

      {beats.length === 0 && (
        <div style={{ textAlign:"center", padding:"60px 0", color:"#CCC" }}>
          <p style={{ fontSize:13, margin:"0 0 16px" }}>No beats yet. Click + Beat to start planning.</p>
        </div>
      )}

      {ACT_LABELS.map(act => {
        const group = beats.filter(b => b.act === act);
        if (group.length === 0) return null;
        return (
          <div key={act} style={{ marginBottom:32 }}>
            <p style={{ margin:"0 0 12px", fontSize:9, fontWeight:800, color:"#AAA", letterSpacing:"0.16em", textTransform:"uppercase" }}>{act}</p>
            <div style={{ display:"flex", flexWrap:"wrap", gap:12 }}>
              {group.map(beat => {
                const globalIdx = beats.indexOf(beat);
                return (
                  <div key={beat.id}
                    draggable
                    onDragStart={e => handleDragStart(e, globalIdx)}
                    onDragOver={e => handleDragOver(e, globalIdx)}
                    onDrop={e => handleDrop(e, globalIdx)}
                    onDragEnd={() => { setDragging(null); setDragOver(null); }}
                    style={{
                      width:200, background:"#FFF", border:`1px solid ${dragOver === globalIdx ? "#000" : "#E0E0E0"}`,
                      borderRadius:6, padding:"12px 14px", cursor:"grab",
                      boxShadow: dragging === globalIdx ? "none" : "0 1px 4px rgba(0,0,0,0.07)",
                      opacity: dragging === globalIdx ? 0.4 : 1, transition:"opacity 0.1s",
                    }}
                  >
                    {editing === beat.id ? (
                      <>
                        <input value={beat.title} onChange={e => updateBeat(beat.id, { title: e.target.value })}
                          style={{ width:"100%", border:"none", borderBottom:"1px solid #E0E0E0", outline:"none", fontSize:12, fontWeight:700, marginBottom:6, background:"transparent", fontFamily:"inherit" }}
                          onBlur={() => setEditing(null)} autoFocus />
                        <textarea value={beat.body} onChange={e => updateBeat(beat.id, { body: e.target.value })}
                          style={{ width:"100%", border:"1px solid #EBEBEB", borderRadius:3, outline:"none", fontSize:11, resize:"none", minHeight:60, padding:6, fontFamily:"inherit", lineHeight:1.5, boxSizing:"border-box" }} />
                        <select value={beat.act} onChange={e => updateBeat(beat.id, { act: e.target.value })}
                          style={{ ...css.input, fontSize:10, padding:"3px 6px", marginTop:6 }}>
                          {ACT_LABELS.map(a => <option key={a}>{a}</option>)}
                        </select>
                      </>
                    ) : (
                      <>
                        <p style={{ margin:"0 0 5px", fontSize:12, fontWeight:700, color:"#000", lineHeight:1.3 }}>{beat.title || "Untitled"}</p>
                        {beat.body && <p style={{ margin:"0 0 6px", fontSize:11, color:"#666", lineHeight:1.5 }}>{beat.body.slice(0,80)}{beat.body.length > 80 ? "…" : ""}</p>}
                      </>
                    )}
                    <div style={{ display:"flex", justifyContent:"space-between", marginTop:8 }}>
                      <button onClick={() => setEditing(beat.id)} style={{ background:"none", border:"none", cursor:"pointer", fontSize:10, color:"#BBB", padding:0, fontFamily:"inherit" }}>Edit</button>
                      <button onClick={() => deleteBeat(beat.id)} style={{ background:"none", border:"none", cursor:"pointer", fontSize:10, color:"#CCC", padding:0, fontFamily:"inherit" }}>×</button>
                    </div>
                  </div>
                );
              })}
            </div>
            <div style={{ borderTop:"1px solid #EBEBEB", marginTop:20 }} />
          </div>
        );
      })}

      {/* beats not yet in any act group - show ungrouped */}
      {beats.filter(b => !ACT_LABELS.includes(b.act)).map(beat => (
        <div key={beat.id} style={{ width:200, background:"#FFF", border:"1px solid #E0E0E0", borderRadius:6, padding:"12px 14px", marginBottom:12, display:"inline-block", marginRight:12 }}>
          <p style={{ margin:0, fontSize:12, fontWeight:700 }}>{beat.title}</p>
        </div>
      ))}
    </div>
  );
}

// ─── SCENE NAVIGATOR (Section 8) ──────────────────────────────────────────────
const SCENE_STATUS = { todo:"○", inprogress:"◑", done:"●", revision:"✗" };

function SceneNavigator({ lines, onJumpTo, collapsed, onToggle }) {
  const scenes = [];
  let page = 1;
  lines.forEach((line, idx) => {
    if (line.mode === "location" && line.text?.trim()) {
      scenes.push({ idx, text: line.text.trim(), page });
    }
    // rough page estimation
    if (idx > 0 && idx % 55 === 0) page++;
  });

  const [statuses, setStatuses] = useState({});
  const cycleStatus = (idx, e) => {
    e.stopPropagation();
    const keys = Object.keys(SCENE_STATUS);
    const cur = statuses[idx] || "todo";
    const next = keys[(keys.indexOf(cur) + 1) % keys.length];
    setStatuses(s => ({ ...s, [idx]: next }));
  };

  if (collapsed) return null;

  return (
    <div style={{ width:220, minWidth:220, borderRight:"1px solid #EBEBEB", background:"#FAFAFA", display:"flex", flexDirection:"column", flexShrink:0, overflow:"hidden" }}>
      <div style={{ padding:"12px 12px 10px", borderBottom:"1px solid #EBEBEB", display:"flex", justifyContent:"space-between", alignItems:"center", flexShrink:0 }}>
        <span style={{ fontSize:9, fontWeight:800, color:"#AAA", letterSpacing:"0.14em", textTransform:"uppercase" }}>Scenes</span>
        <button onClick={onToggle} style={{ background:"none", border:"none", cursor:"pointer", color:"#BBB", fontSize:13, padding:2 }}>×</button>
      </div>
      <div style={{ flex:1, overflowY:"auto" }}>
        {scenes.length === 0 && <p style={{ padding:"16px 12px", fontSize:11, color:"#CCC", fontStyle:"italic" }}>No scene headings yet.</p>}
        {scenes.map((s, i) => (
          <div key={s.idx} onClick={() => onJumpTo(s.idx)}
            style={{ padding:"8px 12px", borderBottom:"1px solid #F0F0F0", cursor:"pointer", display:"flex", alignItems:"flex-start", gap:8 }}
            onMouseEnter={e => e.currentTarget.style.background="#F5F5F5"}
            onMouseLeave={e => e.currentTarget.style.background="transparent"}
          >
            <span style={{ fontSize:9, color:"#CCC", marginTop:2, flexShrink:0, minWidth:16 }}>{i+1}</span>
            <div style={{ flex:1, overflow:"hidden" }}>
              <p style={{ margin:0, fontSize:11, color:"#333", lineHeight:1.4, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{s.text}</p>
              <span style={{ fontSize:9, color:"#BBB" }}>p.{s.page}</span>
            </div>
            <button onClick={e => cycleStatus(s.idx, e)} style={{ background:"none", border:"none", cursor:"pointer", fontSize:11, color:"#AAA", flexShrink:0, padding:0 }} title="Cycle status">
              {SCENE_STATUS[statuses[s.idx] || "todo"]}
            </button>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── ALTERNATE DIALOGUE (Section 7) ──────────────────────────────────────────
function AlternatesPanel({ lineId, alts, onSave, onClose }) {
  const [takes, setTakes] = useState(alts?.takes || [""]);
  const [active, setActive] = useState(alts?.active || 0);

  const save = (newTakes, newActive) => {
    onSave({ takes: newTakes, active: newActive ?? active });
  };

  const addTake = () => {
    const next = [...takes, ""];
    setTakes(next);
    setActive(next.length - 1);
    save(next, next.length - 1);
  };

  const updateTake = (i, val) => {
    const next = takes.map((t, idx) => idx === i ? val : t);
    setTakes(next);
    save(next);
  };

  const selectTake = (i) => { setActive(i); save(takes, i); };
  const removeTake = (i) => {
    if (takes.length <= 1) return;
    const next = takes.filter((_, idx) => idx !== i);
    const newActive = Math.min(active, next.length - 1);
    setTakes(next); setActive(newActive); save(next, newActive);
  };

  return (
    <div style={{ background:"#FAFAFA", border:"1px solid #E0E0E0", borderRadius:4, padding:"10px 12px", marginTop:4 }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
        <span style={{ fontSize:9, fontWeight:800, color:"#AAA", letterSpacing:"0.12em", textTransform:"uppercase" }}>Alternates</span>
        <div style={{ display:"flex", gap:8, alignItems:"center" }}>
          <button onClick={addTake} style={{ background:"none", border:"none", cursor:"pointer", fontSize:11, color:"#555", padding:0, fontFamily:"inherit" }}>+ Take</button>
          <button onClick={onClose} style={{ background:"none", border:"none", cursor:"pointer", fontSize:13, color:"#CCC" }}>×</button>
        </div>
      </div>
      {takes.map((t, i) => (
        <div key={i} style={{ display:"flex", alignItems:"flex-start", gap:6, marginBottom:6 }}>
          <button onClick={() => selectTake(i)} style={{
            flexShrink:0, width:18, height:18, borderRadius:"50%", border:`1px solid ${i === active ? "#000" : "#CCC"}`,
            background: i === active ? "#000" : "none", cursor:"pointer", marginTop:2,
          }} />
          <textarea value={t} onChange={e => updateTake(i, e.target.value)}
            style={{ flex:1, border:"1px solid #E8E8E8", borderRadius:3, outline:"none", resize:"none", minHeight:36, padding:"4px 8px", fontSize:12, fontFamily:"'Courier New',monospace", lineHeight:1.5, background: i === active ? "#FFF" : "#F8F8F8", boxSizing:"border-box" }} />
          {takes.length > 1 && <button onClick={() => removeTake(i)} style={{ background:"none", border:"none", cursor:"pointer", color:"#CCC", fontSize:12, padding:0, marginTop:4 }}>×</button>}
        </div>
      ))}
      <p style={{ margin:"4px 0 0", fontSize:9, color:"#CCC" }}>Filled circle = active take shown in script</p>
    </div>
  );
}

// ─── FORMAT GUIDE (Section 5) ─────────────────────────────────────────────────
function FormatGuide({ format, onClose }) {
  const cycle = FORMAT_CYCLES[format] || FORMAT_CYCLES.film;
  const tips = {
    action: "Describe what happens — full width, present tense.",
    character: "Character name — auto-uppercase, centered.",
    dialogue: "What they say — indented column.",
    location: "INT./EXT. LOCATION — DAY/NIGHT — scene heading.",
    direction: "(Parenthetical) — acting note in parens.",
    note: "// private note — not printed in final script.",
  };
  return (
    <div style={{ position:"fixed", bottom:48, right:20, width:260, background:"#FFF", border:"1px solid #D0D0D0", borderRadius:8, boxShadow:"0 4px 20px rgba(0,0,0,0.12)", zIndex:800, overflow:"hidden" }}>
      <div style={{ padding:"10px 14px", borderBottom:"1px solid #EBEBEB", display:"flex", justifyContent:"space-between" }}>
        <span style={{ fontSize:10, fontWeight:800, color:"#000", letterSpacing:"0.1em", textTransform:"uppercase" }}>Format Guide</span>
        <button onClick={onClose} style={{ background:"none", border:"none", cursor:"pointer", color:"#CCC", fontSize:14 }}>×</button>
      </div>
      <div style={{ padding:"10px 14px" }}>
        <p style={{ margin:"0 0 8px", fontSize:9, color:"#AAA", fontWeight:700, letterSpacing:"0.1em", textTransform:"uppercase" }}>Tab Cycle → {cycle.join(" → ")}</p>
        {cycle.map(m => (
          <div key={m} style={{ marginBottom:7 }}>
            <span style={{ fontSize:10, fontWeight:700, color:"#000", textTransform:"uppercase", letterSpacing:"0.06em" }}>{m}</span>
            <span style={{ fontSize:10, color:"#888", marginLeft:6 }}>{tips[m] || ""}</span>
          </div>
        ))}
      </div>
    </div>
  );
}


// ─── API KEY FIELD ────────────────────────────────────────────────────────────
function ApiKeyField() {
  const [key, setKey] = useState(() => LS.get("sf_api_key", "") || "");
  const [saved, setSaved] = useState(false);
  const [show, setShow] = useState(false);

  const save = () => {
    LS.set("sf_api_key", key.trim());
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  const clear = () => { setKey(""); LS.set("sf_api_key", null); };

  const display = show ? key : (key ? key.slice(0, 8) + "••••••••••••••••••••" : "");

  return (
    <div>
      <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
        <input
          value={display}
          onChange={e => { if (show) setKey(e.target.value); }}
          placeholder="sk-ant-api03-..."
          style={{ ...css.input, flex: 1, fontFamily: "monospace", fontSize: 12 }}
          onFocus={() => setShow(true)}
          onBlur={() => setShow(false)}
        />
        <button onClick={save} style={{
          padding: "9px 18px", background: saved ? "#444" : "#000", color: "#FFF",
          border: "none", borderRadius: 4, cursor: "pointer", fontFamily: "inherit",
          fontWeight: 700, fontSize: 12, whiteSpace: "nowrap", flexShrink: 0,
        }}>{saved ? "✓ Saved" : "Save"}</button>
      </div>
      {key && (
        <button onClick={clear} style={{ background: "none", border: "none", fontSize: 11, color: "#BBB", cursor: "pointer", fontFamily: "inherit", padding: 0 }}>
          Remove key
        </button>
      )}
    </div>
  );
}

// ─── SCENE GALLERY PANEL ──────────────────────────────────────────────────────
function SceneGallery({ project, onUpdate, currentPage }) {
  const scenes = project?.sceneGallery || [];
  const [adding, setAdding] = useState(false);
  const [form, setForm] = useState({ label: "", fromPage: "", toPage: "", image: null });
  const fileRef = useRef(null);

  const save = (updated) => onUpdate({ sceneGallery: updated });

  const handleImage = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => setForm(f => ({ ...f, image: ev.target.result }));
    reader.readAsDataURL(file);
    e.target.value = "";
  };

  const addScene = () => {
    if (!form.fromPage || !form.toPage || !form.image) return;
    const entry = { id: Date.now(), label: form.label || `p.${form.fromPage}–${form.toPage}`, fromPage: parseInt(form.fromPage), toPage: parseInt(form.toPage), image: form.image };
    save([...scenes, entry]);
    setForm({ label: "", fromPage: "", toPage: "", image: null });
    setAdding(false);
  };

  const deleteScene = (id) => save(scenes.filter(s => s.id !== id));

  // find scenes that cover the current page
  const active = scenes.filter(s => currentPage >= s.fromPage && currentPage <= s.toPage);
  // all other scenes
  const inactive = scenes.filter(s => currentPage < s.fromPage || currentPage > s.toPage);

  const gridCols = active.length <= 1 ? 1 : active.length <= 2 ? 2 : active.length <= 4 ? 2 : 3;

  return (
    <div style={{ width: 220, minWidth: 220, borderLeft: "1px solid #EBEBEB", background: "#FAFAFA", display: "flex", flexDirection: "column", flexShrink: 0, overflow: "hidden" }}>
      {/* Header */}
      <div style={{ padding: "12px 14px 10px", borderBottom: "1px solid #EBEBEB", display: "flex", justifyContent: "space-between", alignItems: "center", flexShrink: 0 }}>
        <span style={{ fontSize: 9, fontWeight: 800, color: "#AAA", letterSpacing: "0.14em", textTransform: "uppercase" }}>Scene Gallery</span>
        <button onClick={() => setAdding(o => !o)} style={{ background: "none", border: "none", cursor: "pointer", color: adding ? "#000" : "#BBB", fontSize: 16, lineHeight: 1, padding: 0 }}>+</button>
      </div>

      <div style={{ flex: 1, overflowY: "auto", padding: "12px 12px 48px" }}>

        {/* Add form */}
        {adding && (
          <div style={{ background: "#FFF", border: "1px solid #E0E0E0", borderRadius: 6, padding: 12, marginBottom: 14 }}>
            <p style={{ margin: "0 0 8px", fontSize: 10, fontWeight: 800, color: "#AAA", letterSpacing: "0.1em", textTransform: "uppercase" }}>New Scene</p>
            <input value={form.label} onChange={e => setForm(f => ({ ...f, label: e.target.value }))}
              placeholder="Label (e.g. Mountain Chase)"
              style={{ ...css.input, fontSize: 11, marginBottom: 6 }} />
            <div style={{ display: "flex", gap: 6, marginBottom: 6 }}>
              <input value={form.fromPage} onChange={e => setForm(f => ({ ...f, fromPage: e.target.value }))}
                placeholder="From p." type="number" min="1"
                style={{ ...css.input, fontSize: 11, flex: 1 }} />
              <input value={form.toPage} onChange={e => setForm(f => ({ ...f, toPage: e.target.value }))}
                placeholder="To p." type="number" min="1"
                style={{ ...css.input, fontSize: 11, flex: 1 }} />
            </div>
            {/* Image upload */}
            <div onClick={() => fileRef.current?.click()} style={{
              border: "1px dashed #D0D0D0", borderRadius: 4, padding: "8px",
              textAlign: "center", cursor: "pointer", marginBottom: 8,
              background: form.image ? "none" : "#FAFAFA", overflow: "hidden",
            }}>
              {form.image
                ? <img src={form.image} alt="" style={{ width: "100%", height: 80, objectFit: "cover", borderRadius: 3 }} />
                : <p style={{ margin: 0, fontSize: 11, color: "#BBB" }}>Click to add image</p>
              }
            </div>
            <input ref={fileRef} type="file" accept="image/*" style={{ display: "none" }} onChange={handleImage} />
            <div style={{ display: "flex", gap: 6 }}>
              <button onClick={addScene} disabled={!form.fromPage || !form.toPage || !form.image} style={{
                flex: 1, padding: "6px", background: "#000", color: "#FFF", border: "none",
                borderRadius: 4, cursor: "pointer", fontFamily: "inherit", fontSize: 11, fontWeight: 700,
                opacity: (!form.fromPage || !form.toPage || !form.image) ? 0.4 : 1,
              }}>Add</button>
              <button onClick={() => { setAdding(false); setForm({ label: "", fromPage: "", toPage: "", image: null }); }} style={{
                padding: "6px 10px", background: "none", border: "1px solid #E0E0E0",
                borderRadius: 4, cursor: "pointer", fontFamily: "inherit", fontSize: 11, color: "#888",
              }}>Cancel</button>
            </div>
          </div>
        )}

        {/* Current page scenes */}
        {active.length > 0 && (
          <div style={{ marginBottom: 16 }}>
            <p style={{ margin: "0 0 8px", fontSize: 9, fontWeight: 800, color: "#000", letterSpacing: "0.12em", textTransform: "uppercase" }}>Now — p.{currentPage}</p>
            <div style={{
              display: "grid",
              gridTemplateColumns: `repeat(${gridCols}, 1fr)`,
              gap: 4,
            }}>
              {active.map(s => (
                <div key={s.id} style={{ position: "relative", borderRadius: 4, overflow: "hidden", aspectRatio: "4/3" }}>
                  <img src={s.image} alt={s.label} style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
                  <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, background: "rgba(0,0,0,0.45)", padding: "3px 6px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <span style={{ fontSize: 9, color: "#FFF", fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", flex: 1 }}>{s.label}</span>
                    <button onClick={() => deleteScene(s.id)} style={{ background: "none", border: "none", cursor: "pointer", color: "rgba(255,255,255,0.6)", fontSize: 11, padding: 0, lineHeight: 1, marginLeft: 4, flexShrink: 0 }}>×</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Characters on this page */}
        {(() => {
          const pageLines = project?.lines || [];
          const pageStart = Math.max(0, (currentPage - 1) * 55);
          const pageEnd = pageStart + 55;
          const pageSlice = pageLines.slice(pageStart, pageEnd);
          const charNames = [...new Set(pageSlice.filter(l => l.mode === "character" && l.text?.trim()).map(l => l.text.trim().toUpperCase()))];
          const charData = charNames.map(name => (project?.cast || []).find(c => c.name.toUpperCase() === name)).filter(Boolean);
          if (charData.length === 0) return null;
          return (
            <div style={{ marginBottom: 16 }}>
              <p style={{ margin: "0 0 8px", fontSize: 9, fontWeight: 800, color: "#AAA", letterSpacing: "0.12em", textTransform: "uppercase" }}>Characters this page</p>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                {charData.map(c => (
                  <div key={c.id} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 3 }}>
                    <div style={{ width: 44, height: 44, borderRadius: 6, overflow: "hidden", border: "1px solid #E0E0E0", background: "#F4F4F4", display: "flex", alignItems: "center", justifyContent: "center" }}>
                      {c.image
                        ? <img src={c.image} alt={c.name} style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                        : <span style={{ fontSize: 14, fontWeight: 700, color: "#AAA" }}>{c.name[0]}</span>
                      }
                    </div>
                    <span style={{ fontSize: 8, color: "#888", fontWeight: 600, textAlign: "center", maxWidth: 48, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{c.name}</span>
                  </div>
                ))}
              </div>
            </div>
          );
        })()}

        {/* All other scene entries */}
        {inactive.length > 0 && (
          <div>
            <p style={{ margin: "0 0 8px", fontSize: 9, fontWeight: 800, color: "#CCC", letterSpacing: "0.12em", textTransform: "uppercase" }}>All Scenes</p>
            {inactive.map(s => (
              <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 0", borderBottom: "1px solid #F0F0F0" }}>
                <div style={{ width: 36, height: 28, borderRadius: 3, overflow: "hidden", flexShrink: 0 }}>
                  <img src={s.image} alt={s.label} style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                </div>
                <div style={{ flex: 1, overflow: "hidden" }}>
                  <p style={{ margin: 0, fontSize: 11, fontWeight: 600, color: "#555", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{s.label}</p>
                  <span style={{ fontSize: 9, color: "#CCC" }}>p.{s.fromPage}–{s.toPage}</span>
                </div>
                <button onClick={() => deleteScene(s.id)} style={{ background: "none", border: "none", cursor: "pointer", color: "#CCC", fontSize: 13, padding: 0, flexShrink: 0 }}>×</button>
              </div>
            ))}
          </div>
        )}

        {scenes.length === 0 && !adding && (
          <div style={{ textAlign: "center", padding: "32px 0", color: "#CCC" }}>
            <p style={{ fontSize: 12, margin: "0 0 8px" }}>No scenes yet.</p>
            <p style={{ fontSize: 11, margin: 0, lineHeight: 1.6 }}>Click + to attach an image to a page range.</p>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── APP SHELL ────────────────────────────────────────────────────────────────
const NAV_ITEMS = [
  { id: "write",   icon: "✍", label: "Write"       },
  { id: "cast",    icon: "◉", label: "Cast"        },
  { id: "beats",   icon: "⊞", label: "Beat Board"  },
  { id: "mood",    icon: "◈", label: "Mood Board"  },
  { id: "notes",   icon: "≡", label: "Notes"       },
  { id: "profile", icon: "◎", label: "Profile"     },
];

function App({ profile, onEditProfile, onHome, initialProject, onSaveProject, onBackToDash }) {
  const [nav, setNav] = useState("write");
  const [projects, setProjects] = useState(() => initialProject ? [initialProject] : LS.get("sf_projects", []));
  const [activeId, setActiveId] = useState(() => initialProject?.id || null);
  const [aiOpen, setAiOpen] = useState(false);
  const [castOpen, setCastOpen] = useState(false);
  const [hoveredNav, setHoveredNav] = useState(null);
  const [pageInfo, setPageInfo] = useState({ cur: 1, total: 1 });
  const [importOpen, setImportOpen] = useState(false);
  const [focusMode, setFocusMode] = useState(false);
  const [shortcutsOpen, setShortcutsOpen] = useState(false);
  const [sceneNavCollapsed, setSceneNavCollapsed] = useState(true);
  const [showFormatGuide, setShowFormatGuide] = useState(false);
  const [wordCount, setWordCount] = useState(0);
  const [lastSaved, setLastSaved] = useState(null);
  const [altDialogue, setAltDialogue] = useState(null);
  const [projectMenuOpen, setProjectMenuOpen] = useState(false);
  const [darkCanvas, setDarkCanvas] = useState(false);
  const [galleryOpen, setGalleryOpen] = useState(false);
  const [charPanelOpen, setCharPanelOpen] = useState(false);
  const [currentCharName, setCurrentCharName] = useState("");

  const active = projects.find(p => p.id === activeId) || projects[0] || null;

  useEffect(() => {
    if (onSaveProject && active) onSaveProject(active);
    else LS.set("sf_projects", projects);
  }, [projects]);

  useEffect(() => {
    const handler = (e) => {
      if (!(e.metaKey || e.ctrlKey)) return;
      if (e.key === "k") { e.preventDefault(); setAiOpen(o => !o); }
      if (e.key === "b") { e.preventDefault(); setNav(n => n === "beats" ? "write" : "beats"); }
      if (e.key === "f") { e.preventDefault(); setFocusMode(o => !o); }
      if (e.key === "m") { e.preventDefault(); setSceneNavCollapsed(o => !o); }
      if (e.key === "/") { e.preventDefault(); setShortcutsOpen(o => !o); }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, []);

  // word count — compute on load and on every change
  useEffect(() => {
    const wc = (active?.lines || []).reduce((acc, l) => acc + (l.text || "").split(/\s+/).filter(Boolean).length, 0);
    setWordCount(wc);
  }, [active?.id, active?.lines]);

  useEffect(() => {
    const timer = setInterval(() => {
      if (active) { setLastSaved(new Date()); }
    }, 30000);
    return () => clearInterval(timer);
  }, [active?.id]);

  const newProject = () => {
    const p = { id: Date.now(), title: "Untitled", format: profile.format, genre: profile.genre, lines: [], cast: [], notes: "", created: Date.now() };
    setProjects(prev => [p, ...prev]);
    setActiveId(p.id);
    setNav("write");
  };

  const updateProject = (id, changes) => setProjects(prev => prev.map(p => p.id === id ? { ...p, ...changes } : p));

  const updateLines = (lines) => { if (active) updateProject(active.id, { lines }); };
  const updateNotes = (notes) => { if (active) updateProject(active.id, { notes }); };

  const addCharacter = (char) => {
    if (!active) return;
    const exists = active.cast?.some(c => c.name.toUpperCase() === char.name.toUpperCase());
    if (!exists) updateProject(active.id, { cast: [...(active.cast || []), char] });
  };

  const updateCharacter = (charId, field, val) => {
    if (!active) return;
    updateProject(active.id, { cast: active.cast.map(c => c.id === charId ? { ...c, [field]: val } : c) });
  };

  const updateMoodCards = (cards) => { if (active) updateProject(active.id, { moodCards: cards }); };
  const updateBeats = (changes) => { if (active) updateProject(active.id, changes); };
  const updateSceneGallery = (changes) => { if (active) updateProject(active.id, changes); };

  const importScript = (imported) => {
    const p = { id: Date.now(), title: imported.title, format: imported.format, genre: imported.genre, lines: imported.lines, cast: [], notes: "", moodCards: [], created: Date.now() };
    setProjects(prev => [p, ...prev]);
    setActiveId(p.id);
    setNav("write");
    setImportOpen(false);
  };

  const cast = active?.cast || [];

  // jump to a scene line in the editor
  const sceneNavRef = useRef(null); // passed down to SmartEditor to expose scroll fn
  const jumpToLine = (idx) => {
    if (sceneNavRef.current) sceneNavRef.current(idx);
  };

  const fmtLastSaved = () => {
    if (!lastSaved) return "Not saved";
    const sec = Math.floor((Date.now() - lastSaved) / 1000);
    if (sec < 60) return "Just now";
    return `${Math.floor(sec/60)}m ago`;
  };

  const sceneCount = (active?.lines || []).filter(l => l.mode === "location" && l.text?.trim()).length;

  return (
    <div style={{ height: "100vh", display: "flex", background: "#FFF", color: "#0A0A0A", fontFamily: "-apple-system,'Segoe UI',sans-serif", overflow: "hidden" }}>
      {/* ── FOCUS MODE OVERLAY ── */}
      {focusMode && (
        <div style={{ position:"fixed", inset:0, zIndex:2000, background:"#FFF", display:"flex", flexDirection:"column" }}>
          <div style={{ padding:"10px 20px", display:"flex", justifyContent:"space-between", alignItems:"center", borderBottom:"1px solid #EBEBEB" }}>
            <span style={{ fontSize:12, fontWeight:700, color:"#000" }}>{active?.title || "Untitled"}</span>
            <div style={{ display:"flex", gap:16, alignItems:"center" }}>
              <span style={{ fontSize:11, color:"#AAA" }}>p.{pageInfo.cur}/{pageInfo.total} · {wordCount.toLocaleString()} words</span>
              <button onClick={() => setFocusMode(false)} style={{ background:"none", border:"1px solid #DDD", borderRadius:4, padding:"4px 12px", cursor:"pointer", fontSize:11, fontFamily:"inherit", color:"#666" }}>Exit Focus ⌘F</button>
            </div>
          </div>
          <div style={{ flex:1, overflow:"hidden" }}>
            {active && <SmartEditor project={active} cast={cast} onUpdateContent={updateLines} onAddCharacter={addCharacter} format={active.format} onPageChange={(cur,total)=>setPageInfo({cur,total})} focusMode={true} scrollRef={sceneNavRef} />}
          </div>
        </div>
      )}
      {/* ── LEFT RAIL ── */}
      <div style={{ width: 52, background: "#FFF", borderRight: "1px solid #EBEBEB", display: "flex", flexDirection: "column", alignItems: "center", paddingTop: 16, flexShrink: 0, zIndex: 600 }}>
        {/* Wordmark — home button */}
        <div style={{ marginBottom: 20, paddingBottom: 16, borderBottom: "1px solid #EBEBEB", width: "100%", display: "flex", justifyContent: "center" }}
          onMouseEnter={() => setHoveredNav("home")} onMouseLeave={() => setHoveredNav(null)}
          style={{ position: "relative", marginBottom: 20, paddingBottom: 16, borderBottom: "1px solid #EBEBEB", width: "100%", display: "flex", justifyContent: "center" }}>
          <button onClick={onBackToDash || onHome} style={{ background: "none", border: "none", cursor: "pointer", padding: 4 }} title="Projects">
            <p style={{ margin: 0, fontSize: 10, fontWeight: 900, color: "#000", letterSpacing: "0.1em", writingMode: "vertical-lr", textOrientation: "mixed", transform: "rotate(180deg)" }}>SF</p>
          </button>
          {hoveredNav === "home" && (
            <div style={{ position: "absolute", left: 44, top: "50%", transform: "translateY(-50%)", background: "#000", color: "#FFF", padding: "4px 10px", borderRadius: 4, fontSize: 11, fontWeight: 700, letterSpacing: "0.06em", whiteSpace: "nowrap", pointerEvents: "none", zIndex: 700 }}>Home</div>
          )}
        </div>

        {NAV_ITEMS.map(item => {
          const isActive = item.id === "cast" ? castOpen : nav === item.id && item.id !== "cast";
          return (
            <div key={item.id} style={{ position: "relative", width: "100%", display: "flex", justifyContent: "center", marginBottom: 4 }}
              onMouseEnter={() => setHoveredNav(item.id)} onMouseLeave={() => setHoveredNav(null)}>
              <button onClick={() => {
                if (item.id === "cast") {
                  setCastOpen(o => !o);
                } else if (nav === item.id) {
                  // pressing the active tab deselects — go back to write
                  setNav("write");
                  setCastOpen(false);
                } else {
                  setNav(item.id);
                  setCastOpen(false);
                }
              }} style={{
                width: 36, height: 36, borderRadius: 8, border: "none",
                background: isActive ? "#000" : "transparent",
                color: isActive ? "#FFF" : "#999",
                cursor: "pointer", fontSize: 16, display: "flex",
                alignItems: "center", justifyContent: "center",
                transition: "all 0.12s",
              }}>{item.icon}</button>
              {/* Tooltip */}
              {hoveredNav === item.id && (
                <div style={{
                  position: "absolute", left: 44, top: "50%", transform: "translateY(-50%)",
                  background: "#000", color: "#FFF", padding: "4px 10px", borderRadius: 4,
                  fontSize: 11, fontWeight: 700, letterSpacing: "0.06em", whiteSpace: "nowrap",
                  pointerEvents: "none", zIndex: 700,
                }}>{item.label}</div>
              )}
            </div>
          );
        })}

        {/* New project */}
        <div style={{ marginTop: "auto", marginBottom: 16, width: "100%", display: "flex", justifyContent: "center" }}>
          <button onClick={newProject} style={{ width: 36, height: 36, borderRadius: 8, border: "1px dashed #CCC", background: "none", color: "#CCC", cursor: "pointer", fontSize: 18, display: "flex", alignItems: "center", justifyContent: "center", transition: "all 0.12s" }}>+</button>
        </div>
      </div>

      {/* ── SCENE NAVIGATOR ── */}
      {nav === "write" && (
        <SceneNavigator
          lines={active?.lines || []}
          onJumpTo={jumpToLine}
          collapsed={sceneNavCollapsed}
          onToggle={() => setSceneNavCollapsed(o => !o)}
        />
      )}

      {/* ── CAST PANEL (inline, collapses) ── */}
      {castOpen && (
        <CastPanel
          cast={cast}
          onUpdate={updateCharacter}
          onAdd={(onAdded) => {
            const c = { id: Date.now(), name: "NEW CHARACTER", role: "Supporting", voice: "", notes: "" };
            addCharacter(c);
            if (onAdded) onAdded(cast.length);
          }}
          onDelete={(charId) => {
            if (!active) return;
            updateProject(active.id, { cast: active.cast.filter(c => c.id !== charId) });
          }}
          onClose={() => setCastOpen(false)}
        />
      )}

      {/* ── MAIN AREA ── */}
      <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
        {/* Top bar */}
        <div style={{ height: 48, borderBottom: "1px solid #EBEBEB", display: "flex", alignItems: "center", padding: "0 20px", gap: 16, flexShrink: 0 }}>
          {nav === "write" && active && (
            <>
              <div style={{ flex: 1, minWidth: 0, position: "relative", display: "flex", alignItems: "center", gap: 6 }}>
                <input value={active.title} onChange={e => updateProject(active.id, { title: e.target.value })}
                  style={{ background: "none", border: "none", color: "#000", fontSize: 14, fontWeight: 700, outline: "none", fontFamily: "inherit", flex: 1, minWidth: 0 }} />
                {projects.length > 1 && (
                  <button onClick={() => setProjectMenuOpen(o => !o)} style={{ background: "none", border: "none", cursor: "pointer", color: "#CCC", fontSize: 10, padding: "2px 4px", flexShrink: 0 }}>▾</button>
                )}
                {projectMenuOpen && (
                  <div style={{ position: "absolute", top: "100%", left: 0, background: "#FFF", border: "1px solid #E0E0E0", borderRadius: 6, boxShadow: "0 4px 16px rgba(0,0,0,0.1)", zIndex: 600, minWidth: 220, maxHeight: 280, overflowY: "auto" }}>
                    {projects.map(p => (
                      <button key={p.id} onClick={() => { setActiveId(p.id); setProjectMenuOpen(false); }} style={{
                        display: "block", width: "100%", padding: "9px 14px", background: p.id === active.id ? "#FAFAFA" : "none",
                        border: "none", borderBottom: "1px solid #F5F5F5", cursor: "pointer", textAlign: "left",
                        fontFamily: "inherit", fontSize: 12, fontWeight: p.id === active.id ? 700 : 400,
                        color: p.id === active.id ? "#000" : "#555",
                      }}>
                        {p.title || "Untitled"}
                        <span style={{ float: "right", fontSize: 10, color: "#CCC", fontWeight: 400 }}>{FORMATS.find(f => f.id === p.format)?.label}</span>
                      </button>
                    ))}
                    <button onClick={() => { newProject(); setProjectMenuOpen(false); }} style={{ display: "block", width: "100%", padding: "9px 14px", background: "none", border: "none", borderTop: "1px solid #EBEBEB", cursor: "pointer", textAlign: "left", fontFamily: "inherit", fontSize: 12, color: "#888" }}>
                      + New project
                    </button>
                  </div>
                )}
              </div>
              <div style={{ width: 1, height: 20, background: "#EBEBEB", flexShrink: 0 }} />
              <select value={active.format} onChange={e => updateProject(active.id, { format: e.target.value })}
                style={{ background: "none", border: "none", color: "#888", fontSize: 12, outline: "none", fontFamily: "inherit", cursor: "pointer", flexShrink: 0 }}>
                {FORMATS.map(f => <option key={f.id} value={f.id}>{f.label}</option>)}
              </select>
              <div style={{ width: 1, height: 20, background: "#EBEBEB", flexShrink: 0 }} />
              <button onClick={() => setAiOpen(o => !o)} style={{
                padding: "6px 14px", borderRadius: 4, flexShrink: 0,
                border: `1px solid ${aiOpen ? "#000" : "#D0D0D0"}`,
                background: aiOpen ? "#000" : "#FAFAFA",
                color: aiOpen ? "#FFF" : "#444",
                fontSize: 12, fontWeight: 700, cursor: "pointer",
                fontFamily: "inherit", transition: "all 0.12s",
                display: "flex", alignItems: "center", gap: 6,
              }}>
                ✦ AI
                <span style={{ fontSize: 10, color: aiOpen ? "#888" : "#BBB", fontWeight: 500 }}>⌘K</span>
              </button>
              <button onClick={() => setImportOpen(true)} style={{
                padding: "6px 12px", borderRadius: 4, border: "1px solid #D0D0D0", flexShrink: 0,
                background: "#FAFAFA", color: "#555", fontSize: 12, fontWeight: 600,
                cursor: "pointer", fontFamily: "inherit",
              }}>↑ Import</button>
              <button onClick={() => setSceneNavCollapsed(o => !o)} title="Scene Navigator ⌘M" style={{
                padding: "6px 10px", borderRadius: 4, flexShrink: 0,
                border: `1px solid ${!sceneNavCollapsed ? "#000" : "#D0D0D0"}`,
                background: !sceneNavCollapsed ? "#000" : "#FAFAFA",
                color: !sceneNavCollapsed ? "#FFF" : "#555",
                fontSize: 12, cursor: "pointer", fontFamily: "inherit",
              }}>≡ Scenes</button>
              <button onClick={() => setGalleryOpen(o => !o)} title="Scene Gallery" style={{
                padding: "6px 10px", borderRadius: 4, flexShrink: 0,
                border: `1px solid ${galleryOpen ? "#000" : "#D0D0D0"}`,
                background: galleryOpen ? "#000" : "#FAFAFA",
                color: galleryOpen ? "#FFF" : "#555",
                fontSize: 12, cursor: "pointer", fontFamily: "inherit",
              }}>⬚ Gallery</button>
              <button onClick={() => setCharPanelOpen(o => !o)} title="Character Panel" style={{
                padding: "6px 10px", borderRadius: 4, flexShrink: 0,
                border: `1px solid ${charPanelOpen ? "#000" : "#D0D0D0"}`,
                background: charPanelOpen ? "#000" : "#FAFAFA",
                color: charPanelOpen ? "#FFF" : "#555",
                fontSize: 12, cursor: "pointer", fontFamily: "inherit",
              }}>◉ Cast</button>
            </>
          )}
        {/* ── CONTENT ── */}
        <div style={{ flex: 1, overflow: "hidden", display: "flex" }}>
          {/* Editor always shows for write AND notes (notes is a sidebar beside it) */}
          {(nav === "write" || nav === "notes") && (
            active ? (
              <SmartEditor project={active} cast={cast} onUpdateContent={updateLines} onAddCharacter={addCharacter} format={active.format} onPageChange={(cur,total)=>setPageInfo({cur,total})} focusMode={focusMode} scrollRef={sceneNavRef} darkCanvas={darkCanvas} onCharFocus={setCurrentCharName} />
            ) : (
              <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 16 }}>
                <p style={{ fontSize: 16, color: "#AAA" }}>No project open</p>
                <button onClick={newProject} style={{ padding: "10px 24px", background: "#000", color: "#FFF", border: "none", borderRadius: 4, cursor: "pointer", fontFamily: "inherit", fontWeight: 700 }}>New Project</button>
              </div>
            )
          )}

          {/* Character Context Panel — right sidebar */}
          {charPanelOpen && nav === "write" && (
            <CharacterContextPanel
              cast={cast}
              currentCharName={currentCharName}
              onClose={() => setCharPanelOpen(false)}
            />
          )}

          {/* Scene Gallery — right sidebar beside editor */}
          {galleryOpen && nav === "write" && active && (
            <SceneGallery
              project={active}
              onUpdate={updateSceneGallery}
              currentPage={pageInfo.cur}
            />
          )}
          {/* Notes sidebar — slides in beside the editor */}
          {nav === "notes" && (
            <NotesPanel
              notes={active?.notes || ""}
              onChange={updateNotes}
            />
          )}

          {/* Beat Board — full content panel */}
          {nav === "beats" && (
            active
              ? <BeatBoard project={active} onUpdate={updateBeats} />
              : <div style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center" }}>
                  <p style={{ color:"#CCC", fontSize:13 }}>Open a project first.</p>
                </div>
          )}

          {nav === "mood" && active && (
            <MoodBoard
              project={active}
              onUpdateCards={updateMoodCards}
              onClose={() => setNav("write")}
            />
          )}
          {nav === "mood" && !active && (
            <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center" }}>
              <p style={{ color: "#CCC", fontSize: 13 }}>Open a project first.</p>
            </div>
          )}

          {nav === "profile" && (
            <div style={{ flex: 1, overflowY: "auto", padding: "48px 64px" }}>
              <div style={{ maxWidth: 480 }}>
                <h2 style={{ fontSize: 28, fontWeight: 900, color: "#000", margin: "0 0 32px", letterSpacing: "-0.02em" }}>{profile.name}</h2>
                <div style={{ borderTop: "1px solid #EBEBEB" }}>
                  {[
                    ["Default Format", FORMATS.find(f => f.id === profile.format)?.label],
                    ["Default Genre", profile.genre],
                    ["Genres", profile.genres?.join(", ") || "—"],
                    ["Writing Styles", profile.styles?.join(", ") || "—"],
                  ].map(([k, v]) => (
                    <div key={k} style={{ display: "flex", justifyContent: "space-between", padding: "14px 0", borderBottom: "1px solid #EBEBEB" }}>
                      <span style={{ fontSize: 13, color: "#AAA", fontWeight: 600 }}>{k}</span>
                      <span style={{ fontSize: 13, color: "#000", maxWidth: 280, textAlign: "right" }}>{v}</span>
                    </div>
                  ))}
                </div>
                <button onClick={onEditProfile} style={{ marginTop: 24, padding: "10px 24px", background: "#000", color: "#FFF", border: "none", borderRadius: 4, cursor: "pointer", fontFamily: "inherit", fontWeight: 700 }}>Edit Profile</button>

                {/* API Key section */}
                <div style={{ marginTop: 40, paddingTop: 32, borderTop: "1px solid #EBEBEB" }}>
                  <p style={{ margin: "0 0 6px", fontSize: 13, fontWeight: 700, color: "#000" }}>Anthropic API Key</p>
                  <p style={{ margin: "0 0 14px", fontSize: 12, color: "#AAA", lineHeight: 1.6 }}>
                    Paste your key from console.anthropic.com to enable AI features. Stored locally in your browser only — never sent anywhere except directly to Anthropic.
                  </p>
                  <ApiKeyField />
                </div>
              </div>
            </div>
          )}
        </div>
      </div>

      {/* ── IMPORT MODAL ── */}
      {importOpen && <ImportModal profile={profile} onImport={importScript} onClose={() => setImportOpen(false)} />}

      {/* ── AI PANEL ── */}
      {aiOpen && active && <AIPanel project={active} cast={cast} onClose={() => setAiOpen(false)} />}

      {/* ── STATUS BAR (Section 11) ── */}
      <div style={{
        position:"fixed", bottom:0, left:52, right:0,
        padding:"0 20px", background:"#FAFAFA", borderTop:"1px solid #EBEBEB",
        display:"flex", alignItems:"center", height:32, zIndex:400, gap:0,
      }}>
        {nav === "write" && active ? (
          <>
            <span style={{ fontSize:10, color:"#AAA" }}>p.{pageInfo.cur} of {pageInfo.total}</span>
            <span style={{ margin:"0 10px", color:"#DDD" }}>|</span>
            <span style={{ fontSize:10, color:"#AAA" }}>Scene {sceneCount > 0 ? Math.min(sceneCount, pageInfo.cur) : "—"}</span>
            <span style={{ margin:"0 10px", color:"#DDD" }}>|</span>
            <span style={{ fontSize:10, color:"#AAA" }}>{wordCount.toLocaleString()} words</span>
            <span style={{ margin:"0 10px", color:"#DDD" }}>|</span>
            <span style={{ fontSize:10, color:"#AAA" }}>~{pageInfo.total} min read</span>
            <span style={{ margin:"0 10px", color:"#DDD" }}>|</span>
            <span style={{ fontSize:10, color:"#AAA" }}>{lastSaved ? `Saved ${fmtLastSaved()}` : "Not saved"}</span>
          </>
        ) : (
          <span style={{ fontSize:10, color:"#CCC", fontStyle:"italic" }}>
            {["Tab","Enter","Esc","⌘K"].map(k => <span key={k} style={{ marginRight:14 }}><kbd style={{ background:"#FFF", border:"1px solid #DDD", borderRadius:3, padding:"1px 5px", fontSize:9, fontWeight:700, color:"#666" }}>{k}</kbd></span>)}
          </span>
        )}
        <div style={{ marginLeft:"auto", display:"flex", gap:10, alignItems:"center" }}>
          <button onClick={() => setShowFormatGuide(o => !o)} title="Format Guide (?)" style={{ background:"none", border:"1px solid #E0E0E0", borderRadius:3, padding:"2px 8px", fontSize:10, cursor:"pointer", color:"#888", fontFamily:"inherit" }}>?</button>
          <button onClick={() => setShortcutsOpen(o => !o)} title="Shortcuts ⌘/" style={{ background:"none", border:"1px solid #E0E0E0", borderRadius:3, padding:"2px 8px", fontSize:10, cursor:"pointer", color:"#888", fontFamily:"inherit" }}>⌘/</button>
          <button onClick={() => setFocusMode(o => !o)} title="Focus Mode ⌘F" style={{ background:"none", border:"1px solid #E0E0E0", borderRadius:3, padding:"2px 8px", fontSize:10, cursor:"pointer", color:"#888", fontFamily:"inherit" }}>⌘F</button>
          <button onClick={() => setDarkCanvas(o => !o)} title="Toggle canvas color" style={{ background: darkCanvas ? "#333" : "none", border:"1px solid #E0E0E0", borderRadius:3, padding:"2px 8px", fontSize:10, cursor:"pointer", color: darkCanvas ? "#FFF" : "#888", fontFamily:"inherit" }}>◐</button>
        </div>
      </div>

      {/* ── SHORTCUTS OVERLAY ── */}
      {shortcutsOpen && <ShortcutsOverlay onClose={() => setShortcutsOpen(false)} />}

      {/* ── FORMAT GUIDE ── */}
    </div>
    </div>
  );
}    const container = document.getElementById('root');
    const reactRoot = ReactDOM.createRoot(container);
    reactRoot.render(<Root />);
  </script>
</body>
</html>

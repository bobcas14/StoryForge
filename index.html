         once at the very top/bottom of the whole flowing document, so
         page 2 onward printed with no top margin at all. */
      @page { margin: 1in 1in 1in 1.5in; }

         actual print/PDF context — but for the real print, @page above is

         here to avoid stacking both. */

// ── MEDIA STORE (IndexedDB) ─────────────────────────────────────────────────
// Character photos, storyboard images, free-page images, and voice-over
// takes used to live as base64 text directly inside the project's own JSON
// blob in localStorage (capped around 5-10MB total, shared across every
// project). That's fine for a couple of photos; it falls over for a real
// audiobook's worth of takes or a production's worth of storyboard art.
// Blobs now live in IndexedDB (effectively unbounded by comparison) and
// only a small reference key is stored on the project/cast/etc. object.
// Existing projects with old inline "data:" URLs keep working unchanged —
// isMediaKey/useMediaUrl below transparently support both, so nothing that
// was already saved needs to be migrated by hand.
const MediaStore=(()=>{
  const DB_NAME="sf_media",STORE="blobs";
  let dbPromise=null;
  const openDB=()=>{
    if(dbPromise) return dbPromise;
    dbPromise=new Promise((resolve,reject)=>{
      if(!window.indexedDB){reject(new Error("IndexedDB unavailable"));return;}
      const req=indexedDB.open(DB_NAME,1);
      req.onupgradeneeded=()=>{req.result.createObjectStore(STORE);};
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error);
    });
    return dbPromise;
  };
  return{
    async set(key,blob){
      const db=await openDB();
      return new Promise((resolve,reject)=>{
        const tx=db.transaction(STORE,"readwrite");
        tx.objectStore(STORE).put(blob,key);
        tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);
      });
    },
    async get(key){
      const db=await openDB();
      return new Promise((resolve,reject)=>{
        const tx=db.transaction(STORE,"readonly");
        const req=tx.objectStore(STORE).get(key);
        req.onsuccess=()=>resolve(req.result||null);
        req.onerror=()=>reject(req.error);
      });
    },
    async delete(key){
      const db=await openDB();
      return new Promise((resolve,reject)=>{
        const tx=db.transaction(STORE,"readwrite");
        tx.objectStore(STORE).delete(key);
        tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);
      });
    },
  };
})();
const genMediaKey=()=>`idb:${Date.now()}-${Math.random().toString(36).slice(2)}`;
const isMediaKey=(v)=>typeof v==="string"&&v.startsWith("idb:");

// Resolves either a legacy inline "data:" URL or a new IndexedDB key into a
// displayable/playable object URL. Returns null while loading or if empty
// — callers already treat a falsy image/audio as "nothing set", so a brief
// loading gap just looks like the same empty state for a moment.
function useMediaUrl(ref){
  const [url,setUrl]=useState(null);
  useEffect(()=>{
    if(!ref){setUrl(null);return;}
    if(!isMediaKey(ref)){setUrl(ref);return;} // legacy inline data: URL
    let cancelled=false,objectUrl=null;
    MediaStore.get(ref).then(blob=>{
      if(cancelled||!blob) return;
      objectUrl=URL.createObjectURL(blob);
      setUrl(objectUrl);
    }).catch(()=>{});
    return ()=>{cancelled=true;if(objectUrl) URL.revokeObjectURL(objectUrl);};
  },[ref]);
  return url;
}

function MediaImage({src,alt,style}){
  const url=useMediaUrl(src);
  if(!url) return null;
  return <img src={url} alt={alt||""} style={style}/>;
}

async function parseApiResponse(res) {
  const ct = res.headers.get("content-type")||"";
  if(!res.ok||!ct.includes("application/json")){
    if(res.status===504||res.status===408) throw new Error("The request timed out.");
    const text=await res.text().catch(()=>"");
    throw new Error(`Server returned an unexpected response (status ${res.status}). ${text.slice(0,150)||"Try again."}`);
  }
  return res.json();
}

function lineStyle(mode,format,dark){
  const isAudio=format==="audiobook",isNovel=format==="novel";
  switch(mode){
    case"character":return{fontWeight:800,textTransform:"uppercase",textAlign:isAudio||isNovel?"left":"center",letterSpacing:"0.1em",fontSize:13,marginTop:16,color:dark?"#F0F0F0":"#000"};
    case"dialogue":return{color:dark?"#D8D8D8":"#222",fontSize:isAudio||isNovel?14:13,lineHeight:isAudio||isNovel?2.0:1.85,fontStyle:"normal"};
    case"direction":return{fontStyle:"italic",color:dark?"#999":"#666",fontSize:12,lineHeight:1.7};
    case"location":return{fontWeight:800,textTransform:"uppercase",letterSpacing:"0.08em",fontSize:12,marginTop:20,color:dark?"#F0F0F0":"#000"};
    case"note":return{fontStyle:"italic",color:dark?"#888":"#999",fontSize:12,lineHeight:1.7};
    default:return{color:dark?"#E0E0E0":"#111",fontSize:isAudio||isNovel?14:13,lineHeight:isAudio||isNovel?2.1:1.9};
  }
}

function wrapperStyle(mode,format){
  const isScreen=format==="film"||format==="tv"||format==="stage";
  const isAnime=format==="anime"||format==="manga"||format==="animation";
  const isVO=format==="voiceover",isAudio=format==="audiobook",isNovel=format==="novel";
  switch(mode){
    case"dialogue":
      if(isAudio||isNovel) return{marginLeft:0,marginRight:0};
      if(isScreen) return{marginLeft:"18%",marginRight:"16%"};
      if(isAnime||isVO) return{marginLeft:"12%",marginRight:"8%"};
      return{marginLeft:"10%",marginRight:"8%"};
    case"direction":
      if(isAudio||isNovel) return{marginLeft:0,marginRight:0};
      if(isScreen) return{marginLeft:"22%",marginRight:"20%"};
      return{marginLeft:"14%",marginRight:"12%"};
    case"character":
      if(isAudio||isNovel) return{marginLeft:0};
      return{marginLeft:"30%",marginRight:"30%"};
    case"note": return{marginLeft:16,borderLeft:"2px solid #E8E8E8",paddingLeft:8};
    case"location": return{borderTop:"1px solid #EBEBEB",paddingTop:8,marginTop:4};
    default: return{};
  }
}

function InlineNotePopup({x,y,meta,onSave,onClose}){
  const [text,setText]=useState("");
  const inputRef=useRef(null);
  useEffect(()=>{setTimeout(()=>inputRef.current?.focus(),0);},[]);
  return(
    <div style={{position:"fixed",left:Math.min(x,window.innerWidth-320),top:Math.max(y-20,60),
      width:300,background:"#FFF",border:"1px solid #D0D0D0",borderRadius:6,
      boxShadow:"0 4px 20px rgba(0,0,0,0.12)",zIndex:1500,overflow:"hidden"}}>
      <div style={{padding:"8px 12px",borderBottom:"1px solid #F0F0F0",display:"flex",
        justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:10,color:"#AAA",fontWeight:600}}>
          p.{meta.page}{meta.character?` · ${meta.character}`:""}{meta.mode?` · ${meta.mode}`:""}
        </span>
        <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",color:"#CCC",fontSize:14}}>×</button>
      </div>
      <textarea ref={inputRef} value={text} onChange={e=>setText(e.target.value)}
        onKeyDown={e=>{
          if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();if(text.trim())onSave(text.trim());}
          if(e.key==="Escape")onClose();
        }}
        placeholder="Note..."
        style={{width:"100%",border:"none",outline:"none",resize:"none",padding:"10px 12px",
          fontSize:12,lineHeight:1.6,fontFamily:"inherit",boxSizing:"border-box",minHeight:72,background:"#FAFAFA"}}

        <button onClick={()=>{if(text.trim())onSave(text.trim());}} style={{background:"#000",color:"#FFF",border:"none",
          borderRadius:3,padding:"4px 12px",fontSize:11,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>Save ↵</button>
      </div>
    </div>
  );
}

// ─── TITLE PAGE ───────────────────────────────────────────────────────────────
// ─── FREE PAGE ──────────────────────────────────────────────────────────────
// A non-screenplay page you can drop into the flow anywhere — an image, free
// text, or both. Deliberately kept OUTSIDE the lines[] array and its
// uncontrolled-textarea system entirely (stored on the project as its own
// freePages array) so it can't interfere with the fragile per-line editor,
// undo history, DOCX parsing, or pagination. A single controlled textarea
// here is safe since it's fully isolated, one per free page.
function FreePageBlock({page,onChange,onDelete,dark}){
  const fileRef=useRef(null);
  const handleImage=(e)=>{
    const file=e.target.files?.[0];if(!file) return;
    const key=genMediaKey();
    MediaStore.set(key,file).then(()=>onChange({...page,image:key}));
    e.target.value="";
  };
  return(
    <div style={{width:816,margin:"40px auto",background:dark?"#242424":"#FFFFFF",
      boxShadow:dark?"0 0 60px rgba(0,0,0,0.55)":"0 2px 16px rgba(0,0,0,0.18)",
      minHeight:1056,padding:"64px 80px",boxSizing:"border-box",position:"relative",
      fontFamily:"-apple-system,'Segoe UI',sans-serif",transition:"background 0.25s ease"}}>
      <div style={{position:"absolute",top:16,left:80,fontSize:9,fontWeight:800,color:dark?"#666":"#CCC",letterSpacing:"0.12em",textTransform:"uppercase"}}>Free Page</div>
      <div style={{position:"absolute",top:16,right:16,display:"flex",gap:8,alignItems:"center"}}>
        <button onClick={()=>onChange({...page,position:page.position==="back"?"front":"back"})} title="Toggle whether this sits before the script or after it" style={{background:"none",border:`1px solid ${dark?"#444":"#D0D0D0"}`,borderRadius:4,padding:"4px 10px",fontSize:10,cursor:"pointer",color:dark?"#888":"#AAA",fontWeight:700,textTransform:"uppercase"}}>{page.position==="back"?"↑ Move to front":"↓ Move to back"}</button>
        <button onClick={onDelete} title="Remove this page" style={{background:"none",border:`1px solid ${dark?"#444":"#D0D0D0"}`,borderRadius:4,padding:"4px 10px",fontSize:10,cursor:"pointer",color:dark?"#888":"#AAA",fontWeight:700,textTransform:"uppercase"}}>Remove</button>
      </div>
      <div onClick={()=>fileRef.current?.click()} style={{border:`1px dashed ${dark?"#444":"#D0D0D0"}`,borderRadius:6,minHeight:240,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",marginTop:24,marginBottom:24,overflow:"hidden",background:dark?"#1E1E1E":"#FAFAFA"}}>
        {page.image?<MediaImage src={page.image} style={{width:"100%",maxHeight:420,objectFit:"contain"}}/>:<p style={{margin:0,fontSize:12,color:dark?"#777":"#BBB"}}>Click to add an image</p>}
      </div>
      <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleImage}/>
      <textarea value={page.text} onChange={e=>onChange({...page,text:e.target.value})} placeholder="Type anything — treatment notes, captions, a cover blurb..."
        style={{width:"100%",minHeight:200,border:"none",outline:"none",resize:"vertical",background:"transparent",fontFamily:"inherit",fontSize:14,lineHeight:1.8,color:dark?"#E0E0E0":"#222"}}/>
    </div>
  );
}

  // hadn't explicitly overridden it, which is exactly what kept happening.

  // own Title Page.

// ─── SMART EDITOR ─────────────────────────────────────────────────────────────
// ── VOICE-OVER RECORDING ─────────────────────────────────────────────────────
// Records a take for a single line using the browser's built-in mic capture
// (MediaRecorder) — no external service or library needed. Only shown for
// the Voice Over / Audiobook formats. Stored as a data URL on the line
// itself, same pattern already used for character photo uploads.
function LineVoiceControl({audio,onRecorded}){
  const [recording,setRecording]=useState(false);
  const mediaRef=useRef(null);
  const chunksRef=useRef([]);
  const start=async()=>{
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      const rec=new MediaRecorder(stream);
      chunksRef.current=[];
      rec.ondataavailable=e=>{if(e.data.size>0)chunksRef.current.push(e.data);};
      rec.onstop=()=>{
        const blob=new Blob(chunksRef.current,{type:rec.mimeType||"audio/webm"});
        // Store the recorded Blob directly — no base64 round-trip needed,
        // MediaRecorder already hands us a real Blob. Only a small
        // reference key ends up on the line itself. If re-recording over
        // an existing take, clean up the old blob so it doesn't sit
        // around unused in IndexedDB forever.
        const oldKey=isMediaKey(audio)?audio:null;
        const newKey=genMediaKey();
        MediaStore.set(newKey,blob).then(()=>{
          onRecorded(newKey);
          if(oldKey) MediaStore.delete(oldKey).catch(()=>{});
        });
        stream.getTracks().forEach(t=>t.stop());
      };
      rec.start();mediaRef.current=rec;setRecording(true);
    }catch(err){
      alert("Couldn't access your microphone — check this site's mic permission in your browser settings.");
    }
  };
  const stop=()=>{mediaRef.current?.stop();setRecording(false);};
  const play=async()=>{
    if(!audio) return;
    // Recordings are only ever loaded off disk at the moment you actually
    // hit play — never kept resident just because a project has them.
    if(isMediaKey(audio)){
      const blob=await MediaStore.get(audio);
      if(blob){const url=URL.createObjectURL(blob);const a=new Audio(url);a.play();a.onended=()=>URL.revokeObjectURL(url);}
    }else{
      new Audio(audio).play(); // legacy inline data: URL from before this change
    }
  };
  return(
    <span style={{display:"inline-flex",alignItems:"center",gap:5}} onMouseDown={e=>e.stopPropagation()}>
      {recording?(
        <button onClick={stop} title="Stop recording" style={{background:"#000",border:"none",borderRadius:"50%",width:15,height:15,cursor:"pointer",color:"#FFF",fontSize:7,padding:0,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>■</button>
      ):(
        <button onClick={start} title={audio?"Re-record take":"Record voice-over take"} style={{background:"none",border:`1px solid ${audio?"#000":"#DDD"}`,borderRadius:"50%",width:15,height:15,cursor:"pointer",color:audio?"#000":"#CCC",fontSize:7,padding:0,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>●</button>
      )}
      {audio&&!recording&&<button onClick={play} title="Play take" style={{background:"none",border:"none",cursor:"pointer",color:"#888",fontSize:9,padding:0,flexShrink:0}}>▶</button>}
    </span>
  );
}

function SmartEditor({project,cast,onUpdateContent,onAddCharacter,format,onPageChange,focusMode,scrollRef,darkCanvas,onCharFocus,profile,onEditTitlePage,onForceSave,flushRef,undoRedoRef,freePages,onUpdateFreePages}){
  const [lines,setLines]=useState(()=>
    project?.lines?.length?project.lines:[{id:Date.now(),text:"",mode:"action"}]
  );
  const [curLine,setCurLine]=useState(0);
  const [pillVisible,setPillVisible]=useState(false);
  const [pillPos,setPillPos]=useState({x:0,y:0});
  const [popup,setPopup]=useState({visible:false,x:0,y:0,query:"",matches:[]});
  const [contextMenu,setContextMenu]=useState(null);
  const [inlineNote,setInlineNote]=useState(null);
  const [selectAllActive,setSelectAllActive]=useState(false);

  const refs=useRef({});
  const textCache=useRef({});
  const pillTimerRef=useRef(null);
  const syncTimerRef=useRef(null);
  const cycle=FORMAT_CYCLES[format]||FORMAT_CYCLES.film;

  // ── autoGrow defined first so history functions can reference it ──
  const autoGrow=(el)=>{
    if(!el) return;
    el.style.height="auto";
    el.style.height=el.scrollHeight+"px";
  };

  // ── PAGE MAP ──────────────────────────────────────────────────────────────
  const PAGE_H=864;
  const lineHeights=useRef({});
  const wrapperRefs=useRef({});
  const pageCounterRef=useRef(null);

  // ── VIRTUALIZATION ──────────────────────────────────────────────────────
  // A feature-length script can run 4,000-6,000+ lines. Rendering every one
  // as a live <textarea> regardless of scroll position is the actual
  // reason a long script starts to feel sluggish — thousands of real DOM
  // nodes with attached handlers sitting in memory whether they're on
  // screen or not. This renders only a window of lines around wherever the
  // cursor currently is; spacer divs (sized from the same per-line height
  // measurements pagination already tracks) stand in for the rest so the
  // scrollbar and scroll position still behave correctly. Short documents
  // are completely unaffected — the window just covers the whole thing.
  const VIRTUALIZE_THRESHOLD=500;
  const RENDER_WINDOW=500;
  const RECENTER_BUFFER=150;
  const [renderRange,setRenderRange]=useState(()=>({start:0,end:lines.length}));

  useEffect(()=>{
    if(lines.length<=VIRTUALIZE_THRESHOLD){
      setRenderRange(prev=>(prev.start===0&&prev.end===lines.length)?prev:{start:0,end:lines.length});
      return;
    }
    setRenderRange(prev=>{
      const needsRecenter=curLine<prev.start+RECENTER_BUFFER||curLine>prev.end-RECENTER_BUFFER||prev.end>lines.length;
      if(!needsRecenter) return prev;
      const half=RENDER_WINDOW/2;
      const start=Math.max(0,Math.min(curLine-half,lines.length-RENDER_WINDOW));
      const end=Math.min(lines.length,start+RENDER_WINDOW);
      return{start:Math.max(0,start),end};
    });
  },[curLine,lines.length]);

  const estimateHeightRange=(a,b)=>{
    let sum=0;
    for(let i=a;i<b;i++) sum+=lineHeights.current[i]||28;
    return sum;
  };

  // Recenter on scroll position too — someone just reading/scrolling
  // through a long script with the mouse wheel, without clicking or
  // typing anywhere, would otherwise never move curLine and could scroll
  // past the rendered window into blank spacer space.
  useEffect(()=>{
    if(lines.length<=VIRTUALIZE_THRESHOLD) return;
    const el=containerRef.current;
    if(!el) return;
    let ticking=false;
    const onScroll=()=>{
      if(ticking) return;
      ticking=true;
      requestAnimationFrame(()=>{
        ticking=false;
        const scrollTop=el.scrollTop;
        let acc=0,estIdx=0;
        for(let i=0;i<lines.length;i++){
          acc+=lineHeights.current[i]||28;
          if(acc>=scrollTop){estIdx=i;break;}
        }
        setRenderRange(prev=>{
          const needsRecenter=estIdx<prev.start+RECENTER_BUFFER||estIdx>prev.end-RECENTER_BUFFER;
          if(!needsRecenter) return prev;
          const half=RENDER_WINDOW/2;
          const start=Math.max(0,Math.min(estIdx-half,lines.length-RENDER_WINDOW));
          const end=Math.min(lines.length,start+RENDER_WINDOW);
          return{start:Math.max(0,start),end};
        });
      });
    };
    el.addEventListener("scroll",onScroll);
    return()=>el.removeEventListener("scroll",onScroll);
  },[lines.length]);

  const computePageMap=useCallback((lns)=>{
    const breakSet=new Set(),lineToPage={};
    let acc=0,page=1;
    for(let i=0;i<lns.length;i++){
      const h=lineHeights.current[i]||28;
      if(acc+h>PAGE_H&&acc>0){breakSet.add(i);acc=h;page++;}
      else acc+=h;
      lineToPage[i]=page;
    }
    return{breakSet,lineToPage,total:page};
  },[]);

  const pageMapRef=useRef({breakSet:new Set(),lineToPage:{},total:1});

  // ── UNDO / REDO ───────────────────────────────────────────────────────────
  // History snapshots: {lines, texts}. Captured every 300ms after typing stops.
  const history=useRef([]);
  const historyFuture=useRef([]);
  const MAX_HISTORY=100;
  const lastSnapshotTimeRef=useRef(Date.now());

  const captureSnapshot=(lns,cache)=>{
    history.current.push({lines:lns.map(l=>({...l})),texts:{...cache}});
    if(history.current.length>MAX_HISTORY) history.current.shift();
    historyFuture.current=[];
  };

  const applySnapshot=(snapshot)=>{
    setLines(snapshot.lines);
    textCache.current={...snapshot.texts};
    snapshot.lines.forEach((l,i)=>{
      const el=refs.current[i];
      if(el){el.value=snapshot.texts[i]??"";autoGrow(el);}
    });
    Object.keys(refs.current).forEach(k=>{if(Number(k)>=snapshot.lines.length) delete refs.current[k];});
    pageMapRef.current=computePageMap(snapshot.lines);
    onUpdateContent(snapshot.lines.map((l,i)=>({...l,text:snapshot.texts[i]??l.text})));
  };

  const doUndo=()=>{
    if(history.current.length<=1) return;
    const currentSnap={
      lines:lines.map((l,i)=>({...l,text:textCache.current[i]??l.text})),
      texts:{...textCache.current},
    };
    historyFuture.current.push(currentSnap);
    history.current.pop();
    const prev=history.current[history.current.length-1];
    if(prev) applySnapshot(prev);
  };
  const doRedo=()=>{
    if(historyFuture.current.length===0) return;
    const next=historyFuture.current.pop();
    history.current.push(next);
    applySnapshot(next);
  };
  // Expose undo/redo to App so the footer buttons can trigger them —
  // history itself lives entirely in here, same pattern as flushRef.
  useEffect(()=>{
    if(!undoRedoRef) return;
    undoRedoRef.current={undo:doUndo,redo:doRedo};
    return()=>{if(undoRedoRef) undoRedoRef.current=null;};
  });

  // ── PAGE COUNTER ──────────────────────────────────────────────────────────
  const updateCounter=(lineIdx)=>{
    const p=pageMapRef.current.lineToPage[lineIdx]||1;
    const t=pageMapRef.current.total;
    if(pageCounterRef.current) pageCounterRef.current.textContent=`${p} / ${t}`;
    if(onPageChange) onPageChange(p,t);
  };

  // ── RESTORE ON PROJECT SWITCH ─────────────────────────────────────────────
  useEffect(()=>{
    const next=project?.lines?.length?project.lines:[{id:Date.now(),text:"",mode:"action"}];
    setLines(next);
    next.forEach((l,i)=>{textCache.current[i]=l.text;});
    setCurLine(0);
    setRenderRange({start:0,end:next.length>VIRTUALIZE_THRESHOLD?RENDER_WINDOW:next.length});
    lineHeights.current={};
    pageMapRef.current=computePageMap(next);
    history.current=[{lines:next.map(l=>({...l})),texts:Object.fromEntries(next.map((l,i)=>[i,l.text]))}];
    historyFuture.current=[];
    lastSnapshotTimeRef.current=Date.now();
  },[project?.id]);

  // ── SCROLL-TO-LINE ────────────────────────────────────────────────────────
  const containerRef=useRef(null);
  const pendingScrollRef=useRef(null);
  useEffect(()=>{
    if(scrollRef){
      scrollRef.current=(idx)=>{
        // Bug fix: this used to look up wrapperRefs/refs for idx directly,
        // which only exist if that line happens to already be mounted. In
        // a virtualized long script, jumping to a line far outside the
        // current render window (e.g. a Scene/Cast/Page-Overview jump to
        // page 90 while viewing page 2) would silently do nothing, since
        // that line's DOM node doesn't exist yet. Now it moves curLine
        // first (which expands the render window to include idx via the
        // effect below), and the actual scroll/focus happens once that
        // line is really mounted.
        pendingScrollRef.current=idx;
        setCurLine(idx);
      };
    }
  },[scrollRef]);

  useEffect(()=>{
    const idx=pendingScrollRef.current;
    if(idx==null) return;
    if(idx<renderRange.start||idx>=renderRange.end) return; // not mounted yet — wait for the window to expand
    pendingScrollRef.current=null;
    requestAnimationFrame(()=>{
      const el=wrapperRefs.current[idx];
      if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
      refs.current[idx]?.focus();
    });
  },[renderRange,curLine]);

  // ── POST-MOUNT HEIGHT MEASUREMENT ─────────────────────────────────────────
  useEffect(()=>{
    const raf=requestAnimationFrame(()=>{
      let changed=false;
      for(const idx in wrapperRefs.current){
        const el=wrapperRefs.current[idx];
        if(el&&el.offsetHeight>0){lineHeights.current[idx]=el.offsetHeight;changed=true;}
      }
      if(changed) pageMapRef.current=computePageMap(lines);
    });
    return()=>cancelAnimationFrame(raf);
  },[lines.length]);

  // ── SELECT ALL: copy full text, exit on any other interaction ────────────
  useEffect(()=>{
    if(!selectAllActive) return;
    const onCopy=(e)=>{
      const text=lines.map((l,i)=>textCache.current[i]??l.text??"").join("\n");
      e.clipboardData.setData("text/plain",text);
      e.preventDefault();
    };
    const exit=(e)=>{
      if((e.ctrlKey||e.metaKey)&&e.key==="c") return; // let Copy fire first
      setSelectAllActive(false);
    };
    document.addEventListener("copy",onCopy);
    document.addEventListener("keydown",exit);
    document.addEventListener("mousedown",exit);
    return()=>{
      document.removeEventListener("copy",onCopy);
      document.removeEventListener("keydown",exit);
      document.removeEventListener("mousedown",exit);
    };
  },[selectAllActive,lines]);

  useEffect(()=>{
    if(!focusMode) return;
    const el=wrapperRefs.current[curLine];
    if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
  },[curLine,focusMode]);

  // ── DEBOUNCED SYNC ────────────────────────────────────────────────────────
  const scheduleSync=()=>{
    clearTimeout(syncTimerRef.current);
    syncTimerRef.current=setTimeout(()=>{
      setLines(prev=>{
        const updated=prev.map((l,i)=>({...l,text:textCache.current[i]??l.text}));
        captureSnapshot(updated,{...textCache.current});
        lastSnapshotTimeRef.current=Date.now();
        onUpdateContent(updated);
        pageMapRef.current=computePageMap(updated);
        return updated;
      });
    },300);
  };

  // ── MANUAL / EMERGENCY FLUSH ───────────────────────────────────────────────
  // Normal typing only reaches localStorage ~300ms after you stop typing
  // (the debounce above). That gap is where an unexpected browser close can
  // lose the last few keystrokes. flushRef exposes a synchronous escape
  // hatch — used by Ctrl/Cmd+S, the manual Save button, and a
  // `beforeunload` listener up in App — that reads straight out of the
  // uncontrolled textareas' live cache and pushes it out immediately,
  // bypassing the debounce entirely.
  useEffect(()=>{
    if(!flushRef) return;
    flushRef.current=()=>{
      clearTimeout(syncTimerRef.current);
      const updated=lines.map((l,i)=>({...l,text:textCache.current[i]??l.text}));
      captureSnapshot(updated,{...textCache.current});
      lastSnapshotTimeRef.current=Date.now();
      onUpdateContent(updated);
      if(onForceSave) onForceSave(updated);
      pageMapRef.current=computePageMap(updated);
      setLines(updated);
    };
    return()=>{if(flushRef) flushRef.current=null;};
  },[flushRef,lines,onForceSave]);

  const showPill=(el)=>{
    if(!el) return;
    const r=el.getBoundingClientRect();
    setPillPos({x:r.left,y:r.top});
    setPillVisible(true);
    clearTimeout(pillTimerRef.current);
    pillTimerRef.current=setTimeout(()=>setPillVisible(false),1800);
  };

  const focusLine=(idx,atEnd=true)=>{
    setTimeout(()=>{
      const el=refs.current[idx];
      if(!el) return;
      el.focus();
      if(atEnd){const len=el.value.length;el.setSelectionRange(len,len);}
    },0);
  };

  const deleteLineAt=(idx)=>{
    setLines(prev=>{
      const next=prev.filter((_,i)=>i!==idx);
      const newCache={};
      next.forEach((_,i)=>{newCache[i]=textCache.current[i<idx?i:i+1]??"";});
      textCache.current=newCache;
      pageMapRef.current=computePageMap(next);
      return next;
    });
    const prevIdx=Math.max(0,idx-1);
    setCurLine(prevIdx);
    focusLine(prevIdx);
  };

  const handleChange=(e,idx)=>{
    const text=e.target.value;
    textCache.current[idx]=text;
    // Bug fix: a snapshot used to only get captured once, 300ms after you
    // stopped typing — so one long continuous typing burst with no pauses
    // was a single undo step no matter how much you'd typed, and Ctrl+Z
    // would immediately run out. This adds a checkpoint every ~1.5s of
    // active typing too, so a long burst breaks into several real undo
    // steps instead of one big one.
    const now=Date.now();
    if(now-lastSnapshotTimeRef.current>1500){
      const updated=lines.map((l,i)=>({...l,text:textCache.current[i]??l.text}));
      captureSnapshot(updated,{...textCache.current});
      lastSnapshotTimeRef.current=now;
    }
    scheduleSync();
    const mode=lines[idx]?.mode;
    if(mode==="character"&&text.trim().length>0){
      const el=refs.current[idx];
      if(!el) return;
      const r=el.getBoundingClientRect();
      const q=text.trim();
      const matches=cast.filter(c=>c.name.toUpperCase().startsWith(q.toUpperCase()));
      setPopup({visible:true,x:r.left,y:r.bottom+6,query:q,matches});
    } else {
      setPopup(p=>({...p,visible:false}));
    }
  };

  const handleKeyDown=(e,idx)=>{
    const lineMode=lines[idx]?.mode;

    if(e.altKey&&MODE_SHORTCUTS[e.key]){
      e.preventDefault();
      setLines(prev=>prev.map((l,i)=>i===idx?{...l,mode:MODE_SHORTCUTS[e.key]}:l));
      showPill(refs.current[idx]);
      return;
    }
    if((e.ctrlKey||e.metaKey)&&e.key==="a"){
      e.preventDefault();
      // Bug fix: this only ever selected the current line's own textarea —
      // each line is a separate uncontrolled <textarea>, so there's no
      // native way to visually select across all of them at once. We
      // highlight every line and intercept Copy to build the full text,
      // which is what "Select All" is actually expected to do.
      setSelectAllActive(true);
      return;
    }
    // ── ⌘Backspace: delete entire line regardless of content ──────────────
    if((e.ctrlKey||e.metaKey)&&e.key==="Backspace"){
      e.preventDefault();
      if(lines.length<=1){
        // Only line — just clear it
        const el=refs.current[idx];
        if(el){el.value="";}
        textCache.current[idx]="";
        scheduleSync();
        return;
      }
      deleteLineAt(idx);
      return;
    }
    if((e.ctrlKey||e.metaKey)&&e.key==="n"){
      e.preventDefault();
      const el=refs.current[idx];
      if(el){
        const r=el.getBoundingClientRect();
        const meta={page:pageMapRef.current.lineToPage[idx]||1,
          character:lines[idx]?.mode==="character"?(textCache.current[idx]||""):"",
          mode:lines[idx]?.mode};
        setInlineNote({x:r.left+40,y:r.bottom+8,lineIdx:idx,meta});
      }
      return;
    }

    // ── ⌘Z: undo ──────────────────────────────────────────────────────────
    if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key==="z"){
      e.preventDefault();
      textCache.current[idx]=refs.current[idx]?.value??textCache.current[idx]??"";
      doUndo();
      return;
    }

    // ── ⌘Y / ⌘⇧Z: redo ───────────────────────────────────────────────────
    if((e.ctrlKey||e.metaKey)&&(e.key==="y"||(e.shiftKey&&e.key==="z"))){
      e.preventDefault();
      doRedo();
      return;
    }

    if((e.ctrlKey||e.metaKey)&&e.key!=="k") return;
    if(e.shiftKey&&e.key!=="Tab") return;

    // ── ARROW KEYS: move the cursor, not the page ──────────────────────────
    // Each line is its own <textarea>, so a plain ArrowUp/Down at the very
    // top/bottom of one has nowhere left to go inside it. Left unhandled,
    // the browser's only remaining option is to scroll the nearest
    // scrollable ancestor (the editor viewport) into view instead of moving
    // the caret — that's the "arrow keys scroll the page" bug. We only take
    // over at the start/end boundary of a line's text; anywhere in the
    // middle (including wrapped rows within one block) native textarea
    // behavior already moves the caret correctly, so we leave it alone.
    if(!popup.visible&&(e.key==="ArrowUp"||e.key==="ArrowDown"||e.key==="ArrowLeft"||e.key==="ArrowRight")){
      const el=refs.current[idx];
      if(el){
        const atStart=el.selectionStart===0&&el.selectionEnd===0;
        const atEnd=el.selectionStart===el.value.length&&el.selectionEnd===el.value.length;
        if((e.key==="ArrowUp"||e.key==="ArrowLeft")&&atStart&&idx>0){
          e.preventDefault();
          setCurLine(idx-1);
          focusLine(idx-1,true);
          return;
        }
        if((e.key==="ArrowDown"||e.key==="ArrowRight")&&atEnd&&idx<lines.length-1){
          e.preventDefault();
          setCurLine(idx+1);
          setTimeout(()=>{
            const nextEl=refs.current[idx+1];
            if(nextEl){nextEl.focus();nextEl.setSelectionRange(0,0);}
          },0);
          return;
        }
      }
    }

    if(e.key==="Tab"&&!popup.visible){
      e.preventDefault();
      const ci=cycle.indexOf(lineMode);
      const nextMode=cycle[(ci+1)%cycle.length];
      setLines(prev=>prev.map((l,i)=>i===idx?{...l,mode:nextMode}:l));
      showPill(refs.current[idx]);
      return;
    }
    if(e.key==="Tab"&&popup.visible){
      e.preventDefault();
      if(popup.matches.length>0) acceptChar(popup.matches[0],idx);
      else if(popup.query) createChar(popup.query,idx);
      return;
    }
    if(e.key==="Enter"&&popup.visible){
      e.preventDefault();
      if(popup.query) createChar(popup.query,idx);
      return;
    }
    if(e.key==="Escape"){
      if(popup.visible){setPopup(p=>({...p,visible:false}));return;}
      if(lineMode==="character"){
        setLines(prev=>prev.map((l,i)=>i===idx?{...l,mode:"action"}:l));
        showPill(refs.current[idx]);
      }
      return;
    }
    if(e.key==="Enter"){
      e.preventDefault();
      setPopup(p=>({...p,visible:false}));
      const el=refs.current[idx];
      const curVal=el?.value??(textCache.current[idx]??"");
      if(curVal===""&&lines.length>1){deleteLineAt(idx);return;}
      const selStart=el?el.selectionStart:curVal.length;
      const selEnd=el?el.selectionEnd:curVal.length;
      const before=curVal.slice(0,selStart);
      const after=curVal.slice(selEnd);
      const atEnd=after.length===0;
      if(el) el.value=before;
      textCache.current[idx]=before;
      // Smart mode for new line when pressing Enter at END of a line.
      // character→dialogue is standard screenplay flow.
      // dialogue→dialogue lets writers keep adding dialogue lines naturally;
      // they can Tab to character when they want a new speaker.
      // location→action starts the scene body.
      const nextMode=lineMode==="character"?"dialogue":lineMode==="location"?"action":"action";
      const newText=atEnd?"":after;
      const newMode=atEnd?nextMode:lineMode;
      const newLine={id:Date.now(),text:newText,mode:newMode};
      for(let i=lines.length;i>idx+1;i--){textCache.current[i]=textCache.current[i-1]??"";}
      textCache.current[idx+1]=newText;
      setLines(prev=>{
        const next=[...prev];
        next[idx]={...next[idx],text:before};
        next.splice(idx+1,0,newLine);
        pageMapRef.current=computePageMap(next);
        return next;
      });
      setCurLine(idx+1);
      focusLine(idx+1,false);
      scheduleSync();
      return;
    }
    if(e.key==="Backspace"){
      const domVal=refs.current[idx]?.value;
      const curVal=domVal!==undefined?domVal:(textCache.current[idx]??"");
      if(curVal===""&&lines.length>1){
        e.preventDefault();
        setPopup(p=>({...p,visible:false}));
        deleteLineAt(idx);
        return;
      }
      // Backspace at position 0 on a non-empty line → merge this line's text
      // up into the end of the previous line, then remove this line.
      // This lets the writer join two incorrectly-split dialogue lines.
      const el=refs.current[idx];
      const pos=el?el.selectionStart:0;
      if(pos===0&&curVal.length>0&&idx>0){
        e.preventDefault();
        setPopup(p=>({...p,visible:false}));
        const prevEl=refs.current[idx-1];
        const prevVal=prevEl?.value??textCache.current[idx-1]??"";
        const merged=prevVal+curVal;
        const joinPos=prevVal.length;
        // Write merged text into previous line DOM and cache
        if(prevEl){prevEl.value=merged;autoGrow(prevEl);}
        textCache.current[idx-1]=merged;
        // Remove current line, reindex cache
        setLines(prev=>{
          const next=prev.filter((_,i)=>i!==idx);
          const newCache={};
          next.forEach((_,i)=>{newCache[i]=textCache.current[i<idx?i:i+1]??"";});
          newCache[idx-1]=merged;
          textCache.current=newCache;
          pageMapRef.current=computePageMap(next);
          return next;
        });
        setCurLine(idx-1);
        // Place cursor at the join point so repeated Backspace continues merging
        setTimeout(()=>{
          const el=refs.current[idx-1];
          if(el){el.focus();el.setSelectionRange(joinPos,joinPos);}
        },0);
        scheduleSync();
        return;
      }
    }
  };

  const acceptChar=(char,idx)=>{
    const el=refs.current[idx];
    if(el){el.value=char.name.toUpperCase();}
    textCache.current[idx]=char.name.toUpperCase();
    setPopup(p=>({...p,visible:false}));
    scheduleSync();
    focusLine(idx);
  };

  const createChar=(name,idx)=>{
    const formatted=name.toUpperCase();
    onAddCharacter({id:Date.now(),name:formatted,role:"Supporting",voice:"",notes:""});
    const el=refs.current[idx];
    if(el){el.value=formatted;}
    textCache.current[idx]=formatted;
    setPopup(p=>({...p,visible:false}));
    scheduleSync();
    focusLine(idx);
  };

  const handleContextMenu=(e,idx)=>{
    const sel=window.getSelection()?.toString()?.trim();
    const taEl=refs.current[idx];
    const taSel=taEl?taEl.value.slice(taEl.selectionStart,taEl.selectionEnd).trim():"";
    const chosen=taSel||sel;
    if(!chosen||chosen.length<2) return;
    e.preventDefault();
    setContextMenu({x:e.clientX,y:e.clientY,text:chosen});
  };

  const addToCastFromContext=()=>{
    if(!contextMenu) return;
    const name=contextMenu.text.toUpperCase();
    if(!cast.some(c=>c.name.toUpperCase()===name)){
      onAddCharacter({id:Date.now(),name,role:"Supporting",voice:"",notes:""});
    }
    setContextMenu(null);
  };

  const saveInlineNote=(text)=>{
    if(!inlineNote) return;
    const{lineIdx,meta}=inlineNote;
    const note={id:Date.now(),text,lineIdx,meta,created:Date.now()};
    setLines(prev=>prev.map((l,i)=>i===lineIdx?{...l,notes:[...(l.notes||[]),note]}:l));
    setInlineNote(null);
  };

  const isVoiceFormat=format==="voiceover"||format==="audiobook";
  const saveLineAudio=(idx,dataUrl)=>{
    setLines(prev=>prev.map((l,i)=>i===idx?{...l,audio:dataUrl}:l));
  };

  const placeholder=(mode)=>"...";

  const taStyle=(mode)=>{
    const ls=lineStyle(mode,format,darkCanvas);
    return{width:"100%",border:"none",outline:"none",resize:"none",background:"transparent",
      fontFamily:"'Courier New',Courier,monospace",fontSize:14,lineHeight:1.9,overflowY:"hidden",
      overflowX:"hidden",minHeight:28,padding:0,margin:0,caretColor:darkCanvas?"#F0F0F0":"#000",
      boxSizing:"border-box",display:"block",...ls};
  };

  const autoGrowOnMount=(el,text)=>{
    if(!el||!text||text.length<60) return;
    autoGrow(el);
  };

  const pageMap=pageMapRef.current;

  return(
    <div ref={containerRef} style={{flex:1,position:"relative",overflowY:"auto",
      background:darkCanvas?"#1A1A1A":"#D8D8D8",padding:"40px 0 80px",transition:"background 0.25s ease"}}>
      <ModePill mode={lines[curLine]?.mode||"action"} visible={pillVisible} x={pillPos.x} y={pillPos.y}/>

      <TitlePage project={project} profile={profile} format={format} dark={darkCanvas} onEdit={onEditTitlePage||(() => {})}/>

      {/* Free Pages: image/text pages outside the screenplay format. These
          attach to the front (right after the title page) or back (after
          the last script page) rather than an arbitrary specific page
          number — the script currently renders as one continuous flowing
          block rather than discrete per-page containers, so a precise
          mid-script insertion point would need a bigger structural change
          than this. */}
      {(freePages||[]).filter(fp=>fp.position!=="back").map(fp=>(
        <FreePageBlock key={fp.id} page={fp} dark={darkCanvas}
          onChange={updated=>onUpdateFreePages((freePages||[]).map(f=>f.id===updated.id?updated:f))}
          onDelete={()=>onUpdateFreePages((freePages||[]).filter(f=>f.id!==fp.id))}/>
      ))}

      <div style={{height:40}}/>

      <div style={{width:816,margin:"0 auto",background:darkCanvas?"#242424":"#FFFFFF",
        boxShadow:darkCanvas?"0 0 60px rgba(0,0,0,0.55)":"0 2px 16px rgba(0,0,0,0.18)",transition:"background 0.25s ease,box-shadow 0.25s ease"}}>
        <div style={{height:96}}/>
        <div style={{padding:"0 96px"}}>
          {renderRange.start>0&&<div style={{height:estimateHeightRange(0,renderRange.start)}}/>}
          {lines.slice(renderRange.start,renderRange.end).map((line,_i)=>{
            const idx=renderRange.start+_i;
            const isBreakBefore=pageMap.breakSet.has(idx);
            const pageNum=pageMap.lineToPage[idx]||1;
            return(
              <div key={line.id}>
                {isBreakBefore&&<PageBreakDivider pageNum={pageNum} title={project?.title} format={format} dark={darkCanvas}/>}
                <div style={{position:"relative"}}>
                  {line.notes?.length>0&&(
                    <span style={{position:"absolute",left:-20,top:4,fontSize:9,color:"#AAA",
                      fontWeight:700,cursor:"default",userSelect:"none"}}
                      title={line.notes.map(n=>n.text).join(" / ")}>¹</span>
                  )}
                  {isVoiceFormat&&line.text?.trim()&&(
                    <div style={{position:"absolute",right:-56,top:6,zIndex:50}}>
                      <LineVoiceControl audio={line.audio} onRecorded={dataUrl=>saveLineAudio(idx,dataUrl)}/>
                    </div>
                  )}
                  {line.mode==="character"&&(()=>{
                    const charName=(textCache.current[idx]||line.text||"").trim().toUpperCase();
                    const charData=cast.find(c=>c.name.toUpperCase()===charName);
                    if(!charData?.image) return null;
                    return(
                      <div style={{position:"absolute",right:-20,top:4,zIndex:50}}
                        onMouseEnter={e=>{
                          const preview=document.getElementById("char-preview-global");
                          const rect=e.currentTarget.getBoundingClientRect();
                          if(!preview) return;
                          preview.style.top=(rect.top-60)+"px";preview.style.left=(rect.left-120)+"px";
                          if(isMediaKey(charData.image)){
                            MediaStore.get(charData.image).then(blob=>{
                              if(!blob) return;
                              if(preview.dataset.blobUrl) URL.revokeObjectURL(preview.dataset.blobUrl);
                              const u=URL.createObjectURL(blob);
                              preview.dataset.blobUrl=u;preview.src=u;preview.style.display="block";
                            });
                          }else{
                            preview.src=charData.image;preview.style.display="block";
                          }
                        }}
                        onMouseLeave={()=>{
                          const preview=document.getElementById("char-preview-global");
                          if(preview) preview.style.display="none";
                        }}>
                        <div style={{width:7,height:7,borderRadius:"50%",background:"#000",opacity:0.15,cursor:"pointer"}}/>
                      </div>
                    );
                  })()}
                  <div ref={el=>{wrapperRefs.current[idx]=el;}} style={{position:"relative",...wrapperStyle(line.mode,format),...(selectAllActive?{background:darkCanvas?"rgba(255,255,255,0.12)":"rgba(0,0,0,0.07)"}:{})}}>
                    <textarea
                      ref={el=>{refs.current[idx]=el;if(el) autoGrowOnMount(el,line.text);}}
                      defaultValue={line.text}
                      placeholder={placeholder(line.mode)}
                      rows={1}
                      spellCheck={true}
                      autoCorrect="on"
                      autoCapitalize="sentences"
                      autoComplete="off"
                      onBlur={()=>{
                        // When leaving a character-mode line, if the name isn't in the cast yet,
                        // show the popup at this line so the writer can confirm adding them.
                        // Small delay so the popup renders before focus fully leaves.
                        if(lines[idx]?.mode==="character"){
                          const name=(refs.current[idx]?.value||textCache.current[idx]||"").trim();
                          if(name.length>0&&!cast.some(c=>c.name.toUpperCase()===name.toUpperCase())){
                            const el=refs.current[idx];
                            if(el){
                              const r=el.getBoundingClientRect();
                              const matches=cast.filter(c=>c.name.toUpperCase().startsWith(name.toUpperCase()));
                              setTimeout(()=>setPopup({visible:true,x:r.left,y:r.bottom+6,query:name,matches}),80);
                            }
                          }
                        }
                      }}
                      onFocus={()=>{
                        setCurLine(idx);showPill(refs.current[idx]);updateCounter(idx);
                        if(onCharFocus&&lines[idx]?.mode==="character")
                          onCharFocus((textCache.current[idx]||lines[idx]?.text||"").trim());
                        else if(onCharFocus) onCharFocus("");
                      }}
                      onChange={e=>{
                        autoGrow(e.target);
                        const w=wrapperRefs.current[idx];
                        if(w) lineHeights.current[idx]=w.offsetHeight;
                        handleChange(e,idx);
                      }}
                      onKeyDown={e=>handleKeyDown(e,idx)}
                      onContextMenu={e=>handleContextMenu(e,idx)}
                      style={taStyle(line.mode)}
                    />
                  </div>
                </div>
              </div>
            );
          })}
          {renderRange.end<lines.length&&<div style={{height:estimateHeightRange(renderRange.end,lines.length)}}/>}
        </div>
        <div style={{height:96}}/>
      </div>

      {(freePages||[]).filter(fp=>fp.position==="back").map(fp=>(
        <FreePageBlock key={fp.id} page={fp} dark={darkCanvas}
          onChange={updated=>onUpdateFreePages((freePages||[]).map(f=>f.id===updated.id?updated:f))}
          onDelete={()=>onUpdateFreePages((freePages||[]).filter(f=>f.id!==fp.id))}/>
      ))}

      {popup.visible&&(
        <CharPopup matches={popup.matches} query={popup.query}
          onSelect={c=>acceptChar(c,curLine)} onCreate={name=>createChar(name,curLine)}
          style={{left:popup.x,top:popup.y}}/>
      )}
      {contextMenu&&(
        <ContextMenu x={contextMenu.x} y={contextMenu.y} selectedText={contextMenu.text}
          onAddToCase={addToCastFromContext} onClose={()=>setContextMenu(null)}/>
      )}
      {inlineNote&&(
        <InlineNotePopup x={inlineNote.x} y={inlineNote.y} meta={inlineNote.meta}
          onSave={saveInlineNote} onClose={()=>setInlineNote(null)}/>
      )}
      <img id="char-preview-global" src="" alt="" style={{display:"none",position:"fixed",zIndex:1200,
        width:110,height:110,objectFit:"cover",borderRadius:6,border:"1px solid #D0D0D0",
        boxShadow:"0 4px 16px rgba(0,0,0,0.18)",pointerEvents:"none"}}/>
      <style>{`
        textarea::placeholder{color:#CCCCCC;font-style:italic;}
        textarea{scrollbar-width:none;}
        textarea::-webkit-scrollbar{display:none;}
        @keyframes sf-progress{0%{width:5%;margin-left:0;}50%{width:60%;margin-left:20%;}100%{width:5%;margin-left:95%;}}
      `}</style>
    </div>
  );
}

// ─── AI PANEL ─────────────────────────────────────────────────────────────────
function AIPanel({project,cast,onClose,onGoToProfile}){
  const [mode,setMode]=useState("write");
  const [prompt,setPrompt]=useState("");
  const [response,setResponse]=useState("");
  const [loading,setLoading]=useState(false);
  const [corrType,setCorrType]=useState("grammar");
  const fmt=FORMATS.find(f=>f.id===project?.format)?.label||"Script";
  const genre=project?.genre||"Unspecified";
  const charList=cast.map(c=>c.name).join(", ")||"none";
  const content=project?.lines?.map(l=>l.text).join("\n").slice(-1500)||"";
  const moodContext=(project?.moodCards||[]).length>0
    ?"\n\nREFERENCE CARDS:\n"+(project.moodCards||[]).map(c=>`[${c.tag}] ${c.title}: ${c.body}`).join("\n"):"";
  const isArtifact=window.location.hostname.includes("claude.ai")||window.location.protocol==="blob:";
  const isLocalDev=window.location.hostname==="localhost"||window.location.hostname==="127.0.0.1";
  const localKey=LS.get("sf_api_key",null);
  // Only require user's own key if we're not in Claude artifact sandbox,
  // not on localhost, not on Vercel (which has /api/chat proxy), and no stored key.
  const isVercel=window.location.hostname.includes("vercel.app")||window.location.hostname.includes("hilltops");
  const needsOwnKey=!isArtifact&&!isLocalDev&&!isVercel&&!localKey;
  const run=async(sys,usr)=>{
    if(needsOwnKey){setResponse("Add your Anthropic API key in Profile → API Key to use AI features.");return;}
    setLoading(true);setResponse("");
    let url,headers;
    if(isArtifact){url="https://api.anthropic.com/v1/messages";headers={"Content-Type":"application/json"};}
    else if(localKey){url="https://api.anthropic.com/v1/messages";headers={"Content-Type":"application/json","x-api-key":localKey,"anthropic-version":"2023-06-01"};}
    else{url="/api/chat";headers={"Content-Type":"application/json"};}
    try{
      const res=await fetch(url,{method:"POST",headers,body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:1000,system:sys,messages:[{role:"user",content:usr}]})});
      const d=await parseApiResponse(res);
      if(d.error) setResponse(`API error: ${d.error?.message||JSON.stringify(d.error)}`);
      else if(d.content) setResponse(d.content.filter(b=>b.type==="text").map(b=>b.text).join("")||"No response.");
      else setResponse("Unexpected response: "+JSON.stringify(d).slice(0,200));
    }catch(err){setResponse("Connection error: "+err.message);}
    setLoading(false);
  };
  const doWrite=()=>{if(!prompt.trim()) return;run(`You are a master writer. Format: ${fmt}. Genre: ${genre}. Characters: ${charList}.${moodContext} Write in exact ${fmt} format.`,`Script so far:\n${content}\n\nRequest: ${prompt}`);};
  const doCorrect=()=>{
    const map={grammar:"List every grammar, spelling, and punctuation issue.",style:"Identify weak verbs, passive voice. Give rewrites.",dialogue:"Analyze dialogue. Flag anything on-the-nose. Give punchy rewrites.",pacing:"Evaluate pacing. Where does it drag?",continuity:"Find continuity errors.",format:`Check formatting against ${fmt} industry standards.`};
    run(`You are a professional script editor. Format: ${fmt}. Genre: ${genre}. Give specific, actionable notes.`,`${map[corrType]}\n\nSCRIPT:\n${content}`);
  };
  return(
    <div style={{position:"fixed",right:0,top:0,bottom:0,width:340,background:"#FFF",borderLeft:"1px solid #E8E8E8",display:"flex",flexDirection:"column",zIndex:500,boxShadow:"-4px 0 20px rgba(0,0,0,0.06)"}}>
      <div style={{padding:"16px 20px",borderBottom:"1px solid #E8E8E8",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div><p style={{margin:0,fontSize:13,fontWeight:800,color:"#000"}}>AI Assistant</p><p style={{margin:"2px 0 0",fontSize:11,color:"#AAA"}}>{fmt} · {genre}</p></div>
        <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",fontSize:20,color:"#AAA",lineHeight:1,padding:4}}>×</button>
      </div>
      {needsOwnKey&&(
        <div style={{margin:"14px 20px 0",padding:"12px 14px",background:"#FAFAFA",border:"1px solid #E8E8E8",borderRadius:6}}>
          <p style={{margin:"0 0 6px",fontSize:12,fontWeight:700,color:"#000"}}>Add your API key to use AI features</p>
          <p style={{margin:"0 0 10px",fontSize:11.5,color:"#777",lineHeight:1.6}}>Paste a key from console.anthropic.com in Profile.</p>
          <button onClick={onGoToProfile} style={{padding:"7px 12px",borderRadius:4,background:"#000",color:"#FFF",border:"none",cursor:"pointer",fontFamily:"inherit",fontWeight:700,fontSize:11.5}}>Add API key</button>
        </div>
      )}
      <div style={{display:"flex",borderBottom:"1px solid #E8E8E8"}}>
        {[["write","Write"],["correct","Corrections"],["voice","Character Voice"]].map(([id,lbl])=>(
          <button key={id} onClick={()=>setMode(id)} style={{flex:1,padding:"10px 4px",background:"none",border:"none",borderBottom:`2px solid ${mode===id?"#000":"transparent"}`,color:mode===id?"#000":"#AAA",cursor:"pointer",fontFamily:"inherit",fontSize:11,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase"}}>{lbl}</button>
        ))}
      </div>
      <div style={{flex:1,overflowY:"auto",padding:20,display:"flex",flexDirection:"column",gap:16}}>
        {mode==="write"&&(<>
          <div>
            <label style={css.label}>Quick prompts</label>
            <div style={{display:"flex",flexDirection:"column",gap:4}}>
              {["Continue the scene","Next dialogue exchange","An action beat","A scene transition","A character reveal","A quiet emotional moment","Tense confrontation"].map(q=>(
                <button key={q} onClick={()=>setPrompt(q)} style={{padding:"8px 12px",background:"#FAFAFA",border:"1px solid #EBEBEB",borderRadius:4,color:"#555",cursor:"pointer",fontSize:12,fontFamily:"inherit",textAlign:"left"}}>{q}</button>
              ))}
            </div>
          </div>
          <div>
            <label style={css.label}>Describe what you need</label>
            <textarea value={prompt} onChange={e=>setPrompt(e.target.value)} placeholder="e.g. Kael confronts Mira..." style={{...css.input,resize:"none",minHeight:72,lineHeight:1.6,fontSize:12}}/>
            <button onClick={doWrite} disabled={loading||!prompt.trim()} style={{marginTop:8,width:"100%",padding:"10px",borderRadius:4,background:"#000",color:"#FFF",border:"none",cursor:loading?"wait":"pointer",fontFamily:"inherit",fontWeight:700,fontSize:13,opacity:loading||!prompt.trim()?0.4:1}}>{loading?"Writing...":"Write"}</button>
          </div>
        </>)}
        {mode==="correct"&&(
          <div>
            <label style={css.label}>Correction type</label>
            <div style={{display:"flex",flexDirection:"column",gap:4,marginBottom:16}}>
              {[["grammar","Grammar & Spelling"],["style","Style & Flow"],["dialogue","Dialogue Punch"],["pacing","Pacing"],["continuity","Continuity"],["format","Format Check"]].map(([id,lbl])=>(
                <button key={id} onClick={()=>setCorrType(id)} style={{padding:"9px 12px",background:corrType===id?"#000":"#FAFAFA",border:`1px solid ${corrType===id?"#000":"#EBEBEB"}`,borderRadius:4,color:corrType===id?"#FFF":"#555",cursor:"pointer",fontSize:12,fontFamily:"inherit",textAlign:"left",fontWeight:corrType===id?700:400}}>{lbl}</button>
              ))}
            </div>
            <button onClick={doCorrect} disabled={loading} style={{width:"100%",padding:"10px",borderRadius:4,background:"#000",color:"#FFF",border:"none",cursor:loading?"wait":"pointer",fontFamily:"inherit",fontWeight:700,fontSize:13,opacity:loading?0.4:1}}>{loading?"Analyzing...":"Analyze Script"}</button>
          </div>
        )}
        {mode==="voice"&&(
          <div>
            <label style={css.label}>Character voice profiles</label>
            <p style={{margin:"0 0 12px",fontSize:11.5,color:"#AAA",lineHeight:1.6}}>This writes a character's <em>voice</em> — their vocabulary, rhythm, and personality on the page — plus 3 sample dialogue lines in that style. It doesn't record or generate audio; for actual voice-over recording, use the record button (●) next to each line when your project format is Voice Over or Audiobook.</p>
            {cast.length===0?<p style={{fontSize:12,color:"#AAA",fontStyle:"italic"}}>Add characters to your cast first.</p>
              :cast.map(c=>(<button key={c.id} onClick={()=>run("You are a voice director. Give a specific voice profile and 3 sample dialogue lines.",`Character: ${c.name}, Role: ${c.role}, Voice: ${c.voice||"not set"}, Genre: ${genre}`)} style={{display:"flex",alignItems:"center",gap:10,width:"100%",padding:"10px 12px",background:"#FAFAFA",border:"1px solid #EBEBEB",borderRadius:4,marginBottom:4,cursor:"pointer",fontFamily:"inherit"}}>
                <div style={{width:28,height:28,borderRadius:"50%",background:"#000",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:800,color:"#FFF"}}>{c.name[0]}</div>
                <div style={{textAlign:"left"}}><p style={{margin:0,fontSize:12,fontWeight:700,color:"#000"}}>{c.name}</p><p style={{margin:0,fontSize:11,color:"#AAA"}}>{c.role}</p></div>
              </button>))
            }
          </div>
        )}
        {(response||loading)&&(
          <div style={{borderTop:"1px solid #EBEBEB",paddingTop:16}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
              <label style={css.label}>Response</label>
              {response&&<button onClick={()=>{setResponse("");setPrompt("");}} style={{background:"none",border:"none",color:"#AAA",cursor:"pointer",fontSize:12}}>Clear</button>}
            </div>
            <div style={{background:"#FAFAFA",border:"1px solid #EBEBEB",borderRadius:6,padding:"14px 16px",maxHeight:300,overflowY:"auto"}}>
              <p style={{margin:0,fontSize:12,color:"#333",whiteSpace:"pre-wrap",lineHeight:1.8,fontFamily:"'Courier New',monospace"}}>{loading?"...":response}</p>
            </div>
          </div>
        )}
      </div>
      <div style={{padding:"12px 20px",borderTop:"1px solid #EBEBEB"}}>
        <p style={{margin:0,fontSize:10,color:"#CCC"}}>Close with <kbd style={{background:"#F4F4F4",border:"1px solid #DDD",borderRadius:3,padding:"1px 5px",fontSize:10}}>⌘K</kbd></p>
      </div>
    </div>
  );
}

// ─── CAST PANEL ───────────────────────────────────────────────────────────────
function CastPanel({cast,lines,onUpdate,onAdd,onDelete,onClose,onJumpTo}){
  const [sel,setSel]=useState(0);
  const [saved,setSaved]=useState(false);
  const [search,setSearch]=useState("");
  const [checked,setChecked]=useState(()=>new Set());
  const [mode,setMode]=useState("profile"); // "profile" | "dialogue"
  const imgInputRef=useRef(null);
  const cur=cast[sel];
  const upd=(field,val)=>onUpdate(cast[sel].id,field,val);
  const handleDone=()=>{setSaved(true);setTimeout(()=>{setSaved(false);onClose();},600);};
  const handleImageChange=(e)=>{
    const file=e.target.files?.[0];if(!file) return;
    const oldKey=isMediaKey(cast[sel]?.image)?cast[sel].image:null;
    const key=genMediaKey();
    MediaStore.set(key,file).then(()=>{
      upd("image",key);
      if(oldKey) MediaStore.delete(oldKey).catch(()=>{});
    });
    e.target.value="";
  };
  const filtered=cast.filter(c=>(c.name||"").toLowerCase().includes(search.toLowerCase()));
  const toggleChecked=(id)=>setChecked(prev=>{const next=new Set(prev);if(next.has(id))next.delete(id);else next.add(id);return next;});

  // Cast → Search: dialogue lines, page numbers, and scenes for the
  // selected character(s). Uses the same page-per-55-lines approximation
  // SceneNavigator already uses elsewhere, for consistency.
  const dialogueReport=useMemo(()=>{
    if(mode!=="dialogue"||!lines) return [];
    const targetIds=checked.size>0?checked:(cur?new Set([cur.id]):new Set());
    const targetNames=cast.filter(c=>targetIds.has(c.id)).map(c=>(c.name||"").trim().toUpperCase());
    if(targetNames.length===0) return [];
    const results=[];
    let sceneText="(before first scene heading)";
    lines.forEach((line,idx)=>{
      if(line.mode==="location"&&line.text?.trim()) sceneText=line.text.trim();
      if(line.mode==="character"){
        const base=(line.text||"").replace(/\(.*?\)/g,"").trim().toUpperCase();
        if(targetNames.includes(base)){
          let j=idx+1;const dlines=[];
          while(j<lines.length&&(lines[j].mode==="dialogue"||lines[j].mode==="direction")){
            if(lines[j].mode==="dialogue"&&lines[j].text?.trim())dlines.push(lines[j].text.trim());
            j++;
          }
          results.push({idx,character:line.text.trim(),scene:sceneText,page:Math.floor(idx/55)+1,text:dlines.join(" ")});
        }
      }
    });
    return results;
  },[mode,checked,cur,cast,lines]);

  return(
    <div style={{width:420,borderRight:"1px solid #EBEBEB",display:"flex",flexShrink:0,overflow:"hidden",background:"#FFF"}}>
      <div style={{width:148,borderRight:"1px solid #EBEBEB",display:"flex",flexDirection:"column",flexShrink:0}}>
        <div style={{padding:"14px 14px 10px",borderBottom:"1px solid #EBEBEB",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <p style={{margin:0,fontSize:10,fontWeight:800,color:"#000",letterSpacing:"0.1em",textTransform:"uppercase"}}>Cast</p>
          <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",color:"#CCC",fontSize:16,lineHeight:1,padding:0}}>×</button>
        </div>
        <div style={{padding:"8px 10px",borderBottom:"1px solid #EBEBEB"}}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search characters..." style={{width:"100%",padding:"5px 8px",border:"1px solid #E0E0E0",borderRadius:4,fontSize:11,outline:"none",fontFamily:"inherit"}}/>
        </div>
        <div style={{display:"flex",borderBottom:"1px solid #EBEBEB"}}>
          {["profile","dialogue"].map(m=>(
            <button key={m} onClick={()=>setMode(m)} style={{flex:1,padding:"7px 0",background:mode===m?"#FAFAFA":"none",border:"none",borderBottom:`2px solid ${mode===m?"#000":"transparent"}`,cursor:"pointer",fontFamily:"inherit",fontSize:10,fontWeight:700,color:mode===m?"#000":"#AAA",textTransform:"uppercase",letterSpacing:"0.06em"}}>{m}</button>
          ))}
        </div>
        <div style={{flex:1,overflowY:"auto"}}>
          {filtered.length===0&&<p style={{padding:"14px",fontSize:12,color:"#CCC",fontStyle:"italic"}}>{cast.length===0?"No cast yet":"No matches"}</p>}
          {filtered.map((c)=>{
            const i=cast.indexOf(c);
            return(
            <div key={c.id} style={{display:"flex",alignItems:"center",background:i===sel&&mode==="profile"?"#FAFAFA":"none",borderLeft:`2px solid ${i===sel&&mode==="profile"?"#000":"transparent"}`}}>
              {mode==="dialogue"&&<input type="checkbox" checked={checked.has(c.id)} onChange={()=>toggleChecked(c.id)} style={{marginLeft:12,cursor:"pointer"}}/>}
              <button onClick={()=>setSel(i)} style={{flex:1,padding:"10px 14px",background:"none",border:"none",cursor:"pointer",textAlign:"left",fontFamily:"inherit",display:"flex",alignItems:"center",gap:8,minWidth:0}}>
                <div style={{width:28,height:28,borderRadius:"50%",flexShrink:0,background:c.image?"none":"#EBEBEB",border:"1px solid #E0E0E0",overflow:"hidden",display:"flex",alignItems:"center",justifyContent:"center"}}>
                  {c.image?<MediaImage src={c.image} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<span style={{fontSize:10,fontWeight:700,color:"#AAA"}}>{c.name?.[0]?.toUpperCase()||"?"}</span>}
                </div>
                <div style={{overflow:"hidden",flex:1}}>
                  <p style={{margin:0,fontSize:12,fontWeight:i===sel?700:500,color:i===sel?"#000":"#666",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.name}</p>
                  <p style={{margin:"2px 0 0",fontSize:10,color:"#AAA"}}>{c.role}</p>
                </div>
              </button>
            </div>
          );})}
        </div>
        <div style={{padding:"10px 12px 42px",borderTop:"1px solid #EBEBEB",display:"flex",gap:6}}>
          <button onClick={()=>onAdd((newIdx)=>setSel(newIdx))} style={{flex:1,padding:"7px",background:"#000",color:"#FFF",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"inherit",fontSize:11,fontWeight:700}}>+ Add</button>
          <button onClick={()=>{if(cast.length===0)return;onDelete(cast[sel].id);setSel(Math.max(0,sel-1));}} style={{padding:"7px 10px",background:"none",border:"1px solid #E0E0E0",borderRadius:4,cursor:"pointer",fontFamily:"inherit",fontSize:11,color:"#AAA"}}>✕</button>
        </div>
      </div>
      {mode==="dialogue"?(
        <div style={{flex:1,overflowY:"auto",padding:"16px 18px 52px"}}>
          <p style={{...css.label,marginBottom:12}}>{checked.size>1?`${checked.size} characters selected`:cur?.name||"Select a character"} — {dialogueReport.length} line{dialogueReport.length===1?"":"s"}</p>
          {dialogueReport.length===0&&<p style={{color:"#CCC",fontSize:12}}>No dialogue found for this selection yet.</p>}
          {dialogueReport.map((r,i)=>(
            <div key={i} onClick={()=>onJumpTo&&onJumpTo(r.idx)} style={{padding:"10px 0",borderBottom:"1px solid #F0F0F0",cursor:onJumpTo?"pointer":"default"}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                <span style={{fontSize:11,fontWeight:800,color:"#000",letterSpacing:"0.04em"}}>{r.character}</span>
                <span style={{fontSize:10,color:"#BBB"}}>p.{r.page}</span>
              </div>
              <p style={{margin:"0 0 4px",fontSize:12,color:"#333",lineHeight:1.5}}>{r.text||"(no dialogue text)"}</p>
              <span style={{fontSize:9,color:"#CCC",textTransform:"uppercase",letterSpacing:"0.04em"}}>{r.scene}</span>
            </div>
          ))}
        </div>
      ):cur?(
        <div style={{flex:1,overflowY:"auto",padding:"20px 18px 52px",display:"flex",flexDirection:"column"}}>
          <div style={{display:"flex",alignItems:"flex-end",gap:14,marginBottom:18}}>
            <div style={{width:72,height:72,borderRadius:8,flexShrink:0,background:cur.image?"none":"#F4F4F4",border:"1px solid #E8E8E8",overflow:"hidden",display:"flex",alignItems:"center",justifyContent:"center"}}>
              {cur.image?<MediaImage src={cur.image} alt={cur.name} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<span style={{fontSize:22,color:"#CCC"}}>◉</span>}
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              <input ref={imgInputRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleImageChange}/>
              <button onClick={()=>imgInputRef.current?.click()} style={{padding:"6px 12px",background:"none",border:"1px solid #D0D0D0",borderRadius:4,fontSize:11,fontWeight:600,color:"#555",cursor:"pointer",fontFamily:"inherit"}}>{cur.image?"Change photo":"Upload photo"}</button>
              {cur.image&&<button onClick={()=>{if(isMediaKey(cur.image))MediaStore.delete(cur.image).catch(()=>{});upd("image",null);}} style={{padding:"4px 12px",background:"none",border:"none",fontSize:11,color:"#AAA",cursor:"pointer",fontFamily:"inherit",textAlign:"left"}}>Remove</button>}
            </div>
          </div>
          <input value={cur.name||""} onChange={e=>upd("name",e.target.value)}
            ref={el=>{if(el&&cur.name==="NEW CHARACTER"){el.focus();el.select();}}}
            placeholder="CHARACTER NAME"
            style={{background:"none",border:"none",borderBottom:"2px solid #000",color:"#000",fontSize:18,fontWeight:800,outline:"none",fontFamily:"inherit",width:"100%",paddingBottom:5,marginBottom:16,letterSpacing:"0.04em"}}/>
          <div style={{marginBottom:12}}>
            <label style={css.label}>Role</label>
            <select value={cur.role||"Supporting"} onChange={e=>upd("role",e.target.value)} style={{...css.input,fontSize:12}}>
              {["Protagonist","Antagonist","Supporting","Mentor","Love Interest","Rival","Comic Relief","Background","Other"].map(r=><option key={r}>{r}</option>)}
            </select>
          </div>
          {[["age","Age"],["gender","Gender"],["height","Build"],["hair","Hair"],["eyes","Eyes"]].map(([f,l])=>(
            <div key={f} style={{marginBottom:10}}><label style={css.label}>{l}</label><input value={cur[f]||""} onChange={e=>upd(f,e.target.value)} style={{...css.input,fontSize:12}}/></div>
          ))}
          <div style={{borderTop:"1px solid #EBEBEB",margin:"14px 0 12px"}}/><p style={{...css.label,marginBottom:12}}>Voice</p>
          {[["voice","Quality"],["accent","Accent"],["pitch","Pitch"]].map(([f,l])=>(
            <div key={f} style={{marginBottom:10}}><label style={css.label}>{l}</label><input value={cur[f]||""} onChange={e=>upd(f,e.target.value)} style={{...css.input,fontSize:12}}/></div>
          ))}
          <div style={{borderTop:"1px solid #EBEBEB",margin:"14px 0 12px"}}/><p style={{...css.label,marginBottom:12}}>Psychology</p>
          {[["motivation","Motivation"],["fear","Fear"],["secret","Secret"],["arc","Arc"]].map(([f,l])=>(
            <div key={f} style={{marginBottom:10}}><label style={css.label}>{l}</label><textarea value={cur[f]||""} onChange={e=>upd(f,e.target.value)} style={{...css.input,resize:"vertical",minHeight:52,lineHeight:1.5,fontSize:12}}/></div>
          ))}
          <div style={{paddingTop:16,paddingBottom:8}}>
            <button onClick={handleDone} style={{width:"100%",padding:"10px",background:saved?"#444":"#000",color:"#FFF",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"inherit",fontWeight:700,fontSize:13,transition:"background 0.2s"}}>{saved?"✓ Saved":"Done — back to writing"}</button>
          </div>
        </div>
      ):(
        <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:12}}>
          <p style={{color:"#CCC",fontSize:12,margin:0}}>{cast.length===0?"No characters yet":"Select a character"}</p>
          {cast.length===0&&<button onClick={()=>onAdd((newIdx)=>setSel(newIdx))} style={{padding:"8px 18px",background:"#000",color:"#FFF",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"inherit",fontSize:12,fontWeight:700}}>+ Add character</button>}
        </div>
      )}
    </div>
  );
}

function AuthScreen({onAuth,initialMode="signin"}){
  const [mode,setMode]=useState(initialMode);
  const [name,setName]=useState("");
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [err,setErr]=useState("");
  const submit=()=>{
    setErr("");
    if(!email.trim()||!pass.trim()){setErr("Email and password required.");return;}
    const key=`sf_user_${email.trim().toLowerCase()}`;
    if(mode==="signup"){
      if(!name.trim()){setErr("Name required.");return;}
      if(LS.get(key,null)){setErr("Account already exists. Sign in instead.");return;}
      const user={name:name.trim(),email:email.trim().toLowerCase(),pass};
      LS.set(key,user);onAuth(user);
    } else {
      const user=LS.get(key,null);
      if(!user){setErr("No account found. Sign up instead.");return;}
      if(user.pass!==pass){setErr("Incorrect password.");return;}
      onAuth(user);
    }
  };
  return(
    <div style={{minHeight:"100vh",background:"#FFF",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
      <p style={{margin:"0 0 40px",fontSize:11,fontWeight:900,letterSpacing:"0.25em",textTransform:"uppercase",color:"#000"}}>STORYFORGE</p>
      <div style={{width:360,border:"1px solid #E8E8E8",borderRadius:8,padding:"40px 36px"}}>
        <h2 style={{margin:"0 0 28px",fontSize:22,fontWeight:900,color:"#000"}}>{mode==="signin"?"Sign in":"Create account"}</h2>
        {mode==="signup"&&<div style={{marginBottom:14}}><label style={css.label}>Name</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="B. Hill" style={css.input} onKeyDown={e=>e.key==="Enter"&&submit()}/></div>}
        <div style={{marginBottom:14}}><label style={css.label}>Email</label><input value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@email.com" style={css.input} onKeyDown={e=>e.key==="Enter"&&submit()}/></div>
        <div style={{marginBottom:20}}><label style={css.label}>Password</label><input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="••••••••" style={css.input} onKeyDown={e=>e.key==="Enter"&&submit()}/></div>
        {err&&<p style={{margin:"0 0 14px",fontSize:12,color:"#888"}}>{err}</p>}
        <button onClick={submit} style={{width:"100%",padding:"11px",background:"#000",color:"#FFF",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"inherit",fontWeight:700,fontSize:14}}>{mode==="signin"?"Sign in":"Create account"}</button>
        <p style={{margin:"16px 0 0",fontSize:12,color:"#AAA",textAlign:"center"}}>
          {mode==="signin"?"No account? ":"Have an account? "}
          <button onClick={()=>{setMode(mode==="signin"?"signup":"signin");setErr("");}} style={{background:"none",border:"none",cursor:"pointer",color:"#000",fontWeight:700,fontSize:12,fontFamily:"inherit",padding:0}}>{mode==="signin"?"Sign up":"Sign in"}</button>
        </p>
      </div>
    </div>
  );
}

function Dashboard({user,onOpen,onNew,onSignOut}){
  const projectsKey=`sf_projects_${user.email}`;
  const [projects,setProjects]=useState(()=>LS.get(projectsKey,[]));
  const [renaming,setRenaming]=useState(null);
  const [renameVal,setRenameVal]=useState("");
  const [confirmDelete,setConfirmDelete]=useState(null);
  const [search,setSearch]=useState("");
  const save=(ps)=>{setProjects(ps);LS.set(projectsKey,ps);};
  const deleteProject=(id)=>save(projects.filter(p=>p.id!==id));
  const duplicateProject=(p)=>{const copy={...p,id:Date.now(),title:p.title+" (copy)",created:Date.now()};save([copy,...projects]);};
  const renameProject=(id,title)=>save(projects.map(p=>p.id===id?{...p,title}:p));
  const fmt=(id)=>FORMATS.find(f=>f.id===id)?.label||id;
  const ago=(ts)=>{const d=Math.floor((Date.now()-ts)/86400000);return d===0?"Today":d===1?"Yesterday":`${d}d ago`;};
  return(
    <div style={{minHeight:"100vh",background:"#FFF",display:"flex",flexDirection:"column"}}>
      <div style={{padding:"20px 48px",borderBottom:"1px solid #EBEBEB",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <p style={{margin:0,fontSize:11,fontWeight:900,letterSpacing:"0.25em",textTransform:"uppercase",color:"#000"}}>STORYFORGE</p>
        <div style={{display:"flex",gap:16,alignItems:"center"}}>
          <span style={{fontSize:12,color:"#AAA"}}>{user.name}</span>
          <button onClick={onSignOut} style={{background:"none",border:"1px solid #E8E8E8",borderRadius:4,padding:"6px 14px",fontSize:12,cursor:"pointer",fontFamily:"inherit",color:"#666"}}>Sign out</button>
        </div>
      </div>
      <div style={{flex:1,padding:"48px",maxWidth:1000,margin:"0 auto",width:"100%",boxSizing:"border-box"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
          <h2 style={{margin:0,fontSize:26,fontWeight:900,color:"#000"}}>Your Projects</h2>
          <button onClick={()=>onNew(save,projects)} style={{padding:"9px 20px",background:"#000",color:"#FFF",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"inherit",fontWeight:700,fontSize:13}}>+ New Project</button>
        </div>
        {projects.length>1&&(
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search your projects..."
            style={{width:"100%",padding:"9px 14px",border:"1px solid #E0E0E0",borderRadius:6,fontSize:13,outline:"none",fontFamily:"inherit",marginBottom:20,boxSizing:"border-box"}}/>
        )}
        {projects.length===0?(
          <div style={{textAlign:"center",padding:"80px 0",color:"#CCC"}}>
            <p style={{fontSize:14,margin:"0 0 20px"}}>No projects yet.</p>
            <button onClick={()=>onNew(save,projects)} style={{padding:"10px 24px",background:"#000",color:"#FFF",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>Create your first project</button>
          </div>
        ):(
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:16}}>
            {projects.filter(p=>(p.title||"").toLowerCase().includes(search.toLowerCase())).map(p=>(
              <div key={p.id} style={{border:"1px solid #EBEBEB",borderRadius:8,padding:"20px",cursor:"pointer",transition:"border-color 0.12s"}}
                onMouseEnter={e=>e.currentTarget.style.borderColor="#000"}
                onMouseLeave={e=>e.currentTarget.style.borderColor="#EBEBEB"}
                onClick={()=>{if(confirmDelete===p.id){setConfirmDelete(null);return;}onOpen(p,save,projects);}}>
                {renaming===p.id?(
                  <input value={renameVal} onChange={e=>setRenameVal(e.target.value)} autoFocus
                    onKeyDown={e=>{if(e.key==="Enter"){renameProject(p.id,renameVal);setRenaming(null);}if(e.key==="Escape")setRenaming(null);}}
                    onBlur={()=>{renameProject(p.id,renameVal);setRenaming(null);}}
                    onClick={e=>e.stopPropagation()}
                    style={{...css.input,fontSize:15,fontWeight:700,padding:"4px 0",marginBottom:8}}/>
                ):(
                  <p style={{margin:"0 0 6px",fontSize:15,fontWeight:700,color:"#000",lineHeight:1.3}}>{p.title}</p>
                )}
                <p style={{margin:"0 0 14px",fontSize:11,color:"#AAA"}}>{fmt(p.format)} · {p.genre}</p>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontSize:10,color:"#CCC"}}>{ago(p.created)}</span>
                  <div style={{display:"flex",gap:4,alignItems:"center"}} onClick={e=>e.stopPropagation()}>
                    <button onClick={()=>{setRenaming(p.id);setRenameVal(p.title);}} style={{background:"none",border:"none",cursor:"pointer",fontSize:11,color:"#AAA",padding:"2px 6px",fontFamily:"inherit"}}>Rename</button>
                    <button onClick={()=>duplicateProject(p)} style={{background:"none",border:"none",cursor:"pointer",fontSize:11,color:"#AAA",padding:"2px 6px",fontFamily:"inherit"}}>Dup</button>
                    {confirmDelete===p.id?(
                      <span style={{display:"flex",gap:4,alignItems:"center"}}>
                        <button onClick={()=>{deleteProject(p.id);setConfirmDelete(null);}} style={{background:"#000",border:"none",cursor:"pointer",fontSize:11,color:"#FFF",padding:"2px 8px",fontFamily:"inherit",fontWeight:700,borderRadius:3}}>Delete</button>

                    ):(
                      <button onClick={()=>setConfirmDelete(p.id)} style={{background:"none",border:"none",cursor:"pointer",fontSize:11,color:"#AAA",padding:"2px 6px",fontFamily:"inherit"}}>Del</button>
                    )}
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function Setup({existing,onSave}){
  const [step,setStep]=useState(0);
  const [p,setP]=useState(existing||{name:"",format:"film",genre:"Dark Fantasy",genres:[],styles:[]});
  const upd=(k,v)=>setP(prev=>({...prev,[k]:v}));
  const tog=(k,v)=>setP(prev=>({...prev,[k]:prev[k].includes(v)?prev[k].filter(x=>x!==v):[...prev[k],v]}));
  const STYLES=["Cinematic","Literary","Fast-paced","Dialogue-driven","Atmospheric","Minimalist","Dark & Gritty","Lyrical","Epic","Intimate","Experimental"];
  const steps=[
    {title:"Your name",content:(<div><label style={css.label}>Pen name or real name</label><input style={{...css.input,fontSize:16,padding:"12px 14px"}} value={p.name} onChange={e=>upd("name",e.target.value)} placeholder="e.g. B. Hill" autoFocus onKeyDown={e=>{if(e.key==="Enter"&&p.name.trim().length>0)setStep(s=>s+1);}}/></div>),ok:p.name.trim().length>0},
    {title:"Format & Genre",content:(

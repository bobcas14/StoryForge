        <div>
          <label style={css.label}>Primary Format</label>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>{FORMATS.map(f=>(<button key={f.id} onClick={()=>upd("format",f.id)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"11px 14px",borderRadius:4,cursor:"pointer",border:`1px solid ${p.format===f.id?"#000":"#E8E8E8"}`,background:p.format===f.id?"#000":"#FAFAFA",color:p.format===f.id?"#FFF":"#555",fontFamily:"inherit",fontSize:13,fontWeight:p.format===f.id?700:400,textAlign:"left"}}>{f.label}{p.format===f.id&&<span>✓</span>}</button>))}</div>

        <div>

      </div>
    ),ok:true},
    {title:"Writing style",content:(<div style={{display:"flex",flexWrap:"wrap",gap:8}}>{STYLES.map(s=>(<button key={s} onClick={()=>tog("styles",s)} style={{padding:"7px 14px",borderRadius:4,cursor:"pointer",border:`1px solid ${p.styles.includes(s)?"#000":"#E8E8E8"}`,background:p.styles.includes(s)?"#000":"#FAFAFA",color:p.styles.includes(s)?"#FFF":"#666",fontFamily:"inherit",fontSize:12,fontWeight:p.styles.includes(s)?700:400}}>{s}</button>))}</div>),ok:true},
  ];
  const cur=steps[step];
  return(
    <div style={{minHeight:"100vh",background:"#FFF",display:"flex",flexDirection:"column"}}>

// ─── RULE-BASED SCRIPT CLASSIFIER (no AI — instant, local) ───────────────────
// Classifies a single trimmed line into a mode, or returns null to let the
// caller decide (continuation of dialogue vs. a fresh action beat).
function classifyScriptLine(t,format){
  const isProse=format==="novel";
  const isCue=format==="audiobook"||format==="voiceover";
  const isPanel=format==="anime"||format==="manga";
  const isStage=format==="stage";

  // Parenthetical direction — whole line wrapped in parens, e.g. "(dry)"
  if(/^\(.+\)$/.test(t)) return "direction";

  // Private notes
  if(/^\/\//.test(t)) return "note";
  if(/^\[?\s*NOTE\s*:/i.test(t)) return "note";

  if(isProse){
    // Quoted speech reads as dialogue; everything else is prose/action.
    if(/^["“].+["”]?$/.test(t)) return "dialogue";
    return "action";
  }

  if(isCue){
    // Bracketed cue line, e.g. "[NARRATOR]" or "[VO — NARRATOR, warm...]"
    if(/^\[.+\]$/.test(t)) return "character";
    // All-caps, non-bracketed line — a chapter/track heading, not narration
    if(!/[a-z]/.test(t)&&/[A-Z]/.test(t)&&t.length<=80) return "action";
    return "dialogue";
  }

  if(isPanel){
    if(/^(SCENE|PAGE|PANEL)\b/i.test(t)) return "location";
    if(/^\[\s*SETTING\b/i.test(t)) return "action";
  }

  // Scene headings / sluglines
  if(/^(INT|EXT|EST|I\/E)[\.\s]/i.test(t)) return "location";
  if(isStage&&/^(ACT\s+\w+|SCENE\s+[\w:]+)/i.test(t)) return "location";
  if(/^(EPISODE\s*\d|COLD OPEN|TEASER)\b/i.test(t)) return "location";

  // Transitions read as action beats, not character cues
  if(/^(FADE IN|FADE OUT|CUT TO|SMASH CUT TO|MATCH CUT TO|DISSOLVE TO)\b/i.test(t)) return "action";

  // Character cue: short, no lowercase letters (ignoring a trailing
  // parenthetical like "(V.O.)" or "(CONT'D)"), not a colon-heading.
  const stripped=t.replace(/\s*\([^)]*\)\s*$/,"").trim();
  if(stripped.length>0&&stripped.length<=45&&!/[a-z]/.test(stripped)&&/[A-Z]/.test(stripped)&&!t.endsWith(":")){
    return "character";
  }
  return null;
}

// Extracts a cast-worthy name from a classified "character" block's text.
// Handles both bare screenplay cues ("KAEL (V.O.)") and bracketed audio
// cues ("[DIALOGUE — Kael, internal]").
function extractCueName(text,format){
  let t=text.trim();
  if((format==="audiobook"||format==="voiceover")&&/^\[.+\]$/.test(t)){
    t=t.slice(1,-1).trim();
    const parts=t.split(/—|--/);
    if(parts.length>1) t=parts.slice(1).join("-").trim();
    t=t.split(",")[0].trim();
  } else {
    t=t.replace(/\s*\([^)]*\)\s*$/,"").trim();
  }
  return t.toUpperCase();
}

const CUE_NAME_DENYLIST=new Set(["NARRATOR","VO","V.O.","ANNOUNCER","SFX","MUSIC","DIALOGUE","NARRATION","VOICE OVER"]);

// Groups classified lines into blocks (continuation lines of the same mode
// merge, joined by \n) — same "block" concept the AI classifier used.
function classifyScriptText(rawText,format){
  const rawLines=rawText.split("\n");
  const blocks=[];
  let current=null;
  let lastRealMode="action";
  const flush=()=>{if(current&&current.lines.length>0) blocks.push({text:current.lines.join("\n"),mode:current.mode});current=null;};
  for(const raw of rawLines){
    const trimmed=raw.replace(/[ \t]+/g," ").trim();
    // DOCX extraction (mammoth) inserts a blank line after EVERY paragraph,
    // not just at real section breaks. Resetting to "action" on every blank
    // line was wiping the "character" signal before the very next paragraph
    // (the character's dialogue) got classified — that's what caused
    // dialogue to fall through and get tagged as action. A character cue is
    // reliably detected on its own line, so preserve it across the blank
    // gap; every other mode still resets to the safe "action" default.
    if(trimmed.length===0){flush();if(lastRealMode!=="character")lastRealMode="action";continue;}
    let mode=classifyScriptLine(trimmed,format);
    if(mode===null) mode=(lastRealMode==="character"||lastRealMode==="dialogue")?"dialogue":"action";
    lastRealMode=mode;
    if(current&&current.mode===mode) current.lines.push(trimmed);
    else{flush();current={mode,lines:[trimmed]};}
  }
  flush();
  return blocks;
}

// ── EXPORT ──────────────────────────────────────────────────────────────────
// Notes (mode "note") are private per the app's own convention elsewhere
// ("// private note — not in final script") so every export format skips them.
function escapeHtml(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

// Imported/typed dialogue sometimes has a leading parenthetical jammed
// straight against the line with no space, e.g. "(Laughing)Thanks
// everyone..." — industry format puts the parenthetical on its own
// indented line above the dialogue. This splits that out for every export
// format instead of printing it as one run-on line.
function splitLeadingParen(text){
  const m=text.match(/^(\([^)]*\))\s*(.*)$/s);
  if(m&&m[2]) return{paren:m[1],rest:m[2]};
  return null;
}

function downloadText(filename,content){
  const blob=new Blob([content],{type:"text/plain;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
}

function buildPlainText(project){
  const title=(project.title||"Untitled").toUpperCase();
  const author=project.writtenBy||"";
  let out=`${title}\n${author?`Written by ${author}\n`:""}\n\n`;
  (project.lines||[]).forEach(l=>{
    const text=(l.text||"").trim();
    if(!text||l.mode==="note") return;
    if(l.mode==="location") out+=`\n${text.toUpperCase()}\n\n`;
    else if(l.mode==="character") out+=`\n${" ".repeat(20)}${text.toUpperCase()}\n`;
    else if(l.mode==="dialogue"){
      const split=splitLeadingParen(text);
      if(split) out+=`${" ".repeat(14)}${split.paren}\n${" ".repeat(10)}${split.rest}\n`;
      else out+=`${" ".repeat(10)}${text}\n`;
    }
    else if(l.mode==="direction") out+=`${" ".repeat(14)}(${text.replace(/^\(|\)$/g,"")})\n`;
    else out+=`${text}\n\n`;
  });
  return out;
}

function buildFountain(project,opts){
  const {sceneNumbers}=opts||{};
  const title=project.title||"Untitled";
  const author=project.writtenBy||"";
  let out=`Title: ${title}\n${author?`Credit: Written by\nAuthor: ${author}\n`:""}\n\n`;
  let sceneNum=0;
  (project.lines||[]).forEach(l=>{
    const text=(l.text||"").trim();
    if(!text||l.mode==="note") return;
    if(l.mode==="location"){sceneNum++;out+=`\n${text.toUpperCase()}${sceneNumbers?` #${sceneNum}#`:""}\n`;}
    else if(l.mode==="character") out+=`\n${text.toUpperCase()}\n`;
    else if(l.mode==="dialogue"){
      const split=splitLeadingParen(text);
      if(split) out+=`${split.paren}\n${split.rest}\n`;
      else out+=`${text}\n`;
    }
    else if(l.mode==="direction") out+=`${text.startsWith("(")?text:`(${text})`}\n`;
    else out+=`\n${text}\n`;
  });
  return out;
}

// Real screenplay margins — 1.5in on the left (for hole-punch binding),
// 1in on the other three sides — baked directly into the exported content
// itself (not left to the browser's own default print margins, which vary
// by browser/OS and were the cause of the "too close to the edges" look).
function buildPrintHtml(project,opts){
  const {sceneNumbers}=opts||{};
  const title=escapeHtml(project.title||"Untitled");
  const author=escapeHtml(project.writtenBy||"");
  let sceneNum=0;
  let html=`<div style="font-family:'Courier New',Courier,monospace;font-size:12pt;text-align:center;margin-top:2in;">
    <p style="margin:0 0 24pt;">${title.toUpperCase()}</p>
    ${author?`<p style="margin:0;">Written by</p><p style="margin:0;">${author}</p>`:""}
  </div><div style="page-break-after:always;"></div>
  <div style="font-family:'Courier New',Courier,monospace;font-size:12pt;line-height:1.4;">`;
  (project.lines||[]).forEach(l=>{
    const text=escapeHtml((l.text||"").trim());
    if(!text||l.mode==="note") return;
    if(l.mode==="location"){
      sceneNum++;
      const num=sceneNumbers?`<span>${sceneNum}.</span> `:"";
      const numRight=sceneNumbers?`<span style="float:right;">${sceneNum}.</span>`:"";
      html+=`<p style="margin:12pt 0 0;font-weight:bold;">${num}${text.toUpperCase()}${numRight}</p>`;
    }
    else if(l.mode==="character") html+=`<p style="margin:12pt 0 0 2.2in;">${text.toUpperCase()}</p>`;
    else if(l.mode==="dialogue"){
      const split=splitLeadingParen(text);
      if(split){
        html+=`<p style="margin:0 1.5in 0 1.6in;font-style:italic;">${split.paren}</p>`;
        html+=`<p style="margin:0 1.5in 0 1in;">${split.rest}</p>`;
      }else{
        html+=`<p style="margin:0 1.5in 0 1in;">${text}</p>`;
      }
    }
    else if(l.mode==="direction") html+=`<p style="margin:0 0 0 1.6in;">(${text.replace(/^\(|\)$/g,"")})</p>`;
    else html+=`<p style="margin:12pt 0 0;">${text}</p>`;
  });
  html+="</div>";
  html=`<div class="script-page-margins" style="padding:1in 1in 1in 1.5in;box-sizing:border-box;">${html}</div>`;
  return html;
}

// Final Draft (.fdx) — a documented, plain XML schema, so this is a real,
// readable file any FDX-compatible app (Final Draft, and most competitors'
// importers) can open, not a lookalike.
function escapeXml(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function buildFDX(project,opts){
  const {sceneNumbers}=opts||{};
  const typeMap={location:"Scene Heading",character:"Character",dialogue:"Dialogue",direction:"Parenthetical",action:"Action"};
  let sceneNum=0;
  const paras=(project.lines||[]).map(l=>{
    const text=(l.text||"").trim();
    if(!text||l.mode==="note") return "";
    const type=typeMap[l.mode]||"Action";
    let numAttr="";
    if(type==="Scene Heading"){sceneNum++;if(sceneNumbers)numAttr=` Number="${sceneNum}"`;}
    return `<Paragraph Type="${type}"${numAttr}><Text>${escapeXml(text)}</Text></Paragraph>`;
  }).filter(Boolean).join("\n");
  const title=escapeXml(project.title||"Untitled");
  const author=escapeXml(project.writtenBy||"");
  return `<?xml version="1.0" encoding="UTF-8" standalone="no" ?>\n<FinalDraft DocumentType="Script" Template="No" Version="1">\n<Content>\n${paras}\n</Content>\n<TitlePage>\n<Content>\n<Paragraph><Text>${title}</Text></Paragraph>\n${author?`<Paragraph><Text>Written by</Text></Paragraph>\n<Paragraph><Text>${author}</Text></Paragraph>`:""}\n</Content>\n</TitlePage>\n</FinalDraft>`;
}

// AD-style scene breakdown in page eighths — the real industry unit ADs and
// production managers use to schedule shoot days, rather than flat page
// counts. Uses the same 55-lines-per-page approximation already used
// elsewhere in the app (SceneNavigator, pagination) for consistency.
const LINES_PER_PAGE=55;
function computeSceneBreakdown(lines){
  const scenes=[];let current=null;
  (lines||[]).forEach((line,idx)=>{
    if(line.mode==="location"&&line.text?.trim()){
      if(current) scenes.push(current);
      current={heading:line.text.trim(),startIdx:idx,lineCount:0};
    }
    if(current) current.lineCount++;
  });
  if(current) scenes.push(current);
  return scenes.map((s,i)=>{
    const eighths=Math.max(1,Math.round((s.lineCount/LINES_PER_PAGE)*8));
    return{number:i+1,heading:s.heading,page:Math.floor(s.startIdx/LINES_PER_PAGE)+1,eighths};
  });
}
function buildEighthsReport(project){
  const scenes=computeSceneBreakdown(project.lines);
  const totalEighths=scenes.reduce((sum,s)=>sum+s.eighths,0);
  let out=`SCENE BREAKDOWN — PAGE EIGHTHS\n${project.title||"Untitled"}\nTotal scenes: ${scenes.length}\n${"=".repeat(44)}\n\n`;
  scenes.forEach(s=>{
    const pages=Math.floor(s.eighths/8),rem=s.eighths%8;
    const len=pages>0?(rem>0?`${pages} ${rem}/8 pages`:`${pages} page${pages>1?"s":""}`):`${s.eighths}/8`;
    out+=`Scene ${s.number} (p.${s.page}) — ${s.heading}\n  Length: ${len}\n\n`;
  });
  out+=`\nEstimated script length: ${(totalEighths/8).toFixed(1)} pages (${totalEighths} eighths total) across ${scenes.length} scenes.`;
  return out;
}

function buildCharacterBreakdown(project,characterNames){
  const lines=project.lines||[];
  const names=characterNames.map(n=>n.toUpperCase());
  let sceneText="(before first scene heading)";
  let body="";let count=0;
  lines.forEach((line,idx)=>{
    if(line.mode==="location"&&line.text?.trim()) sceneText=line.text.trim();
    if(line.mode==="character"){
      const base=(line.text||"").replace(/\(.*?\)/g,"").trim().toUpperCase();
      if(names.includes(base)){
        let j=idx+1;const dlines=[];
        while(j<lines.length&&(lines[j].mode==="dialogue"||lines[j].mode==="direction")){
          if(lines[j].mode==="dialogue"&&lines[j].text?.trim())dlines.push(lines[j].text.trim());
          j++;
        }
        count++;
        body+=`[p.${Math.floor(idx/LINES_PER_PAGE)+1}] ${sceneText}\n${line.text.trim()}\n${dlines.join(" ")||"(no dialogue text)"}\n\n`;
      }
    }
  });
  return `CHARACTER BREAKDOWN\n${project.title||"Untitled"}\nCharacter(s): ${characterNames.join(", ")}\nTotal dialogue lines: ${count}\n${"=".repeat(44)}\n\n${body||"No dialogue found for this selection."}`;
}

function buildLocationsReport(project){
  const locs=[...new Set((project.lines||[]).filter(l=>l.mode==="location"&&l.text?.trim()).map(l=>l.text.trim().toUpperCase()))];
  return `LOCATIONS REPORT\n${project.title||"Untitled"}\nTotal unique locations: ${locs.length}\n${"=".repeat(44)}\n\n${locs.map((l,i)=>`${i+1}. ${l}`).join("\n")||"No scene headings yet."}`;
}

// Rule-of-thumb estimate used industry-wide for film/TV: one script page ≈
// one minute of screen time.
function estimateRuntime(project){
  const lineCount=(project.lines||[]).filter(l=>l.text?.trim()&&l.mode!=="note").length;
  const pages=lineCount/LINES_PER_PAGE;
  return {pages:Math.round(pages*10)/10,minutes:Math.max(1,Math.round(pages))};
}

                        <input type="checkbox" checked={checkedChars.has(c.name)} onChange={()=>toggleChar(c.name)}/>{c.name}
                      </label>
                    ))}
                    <button disabled={checkedChars.size===0} onClick={()=>downloadText(`${safeTitle}-character-breakdown.txt`,buildCharacterBreakdown(project,[...checkedChars]))}
                      style={{marginTop:6,padding:"6px 10px",background:checkedChars.size?"#000":"#DDD",color:"#FFF",border:"none",borderRadius:4,cursor:checkedChars.size?"pointer":"not-allowed",fontFamily:"inherit",fontSize:11,fontWeight:700}}>Download breakdown ({checkedChars.size})</button>
                  </>)}

              )}

              <button onClick={()=>downloadText(`${safeTitle}-locations.txt`,buildLocationsReport(project))} style={btnStyle}>Locations Report</button>
              <div style={{padding:"9px 12px",background:"#FAFAFA",border:"1px solid #EEE",borderRadius:6,fontSize:11.5,color:"#666"}}>Estimated runtime: <strong>~{runtime.minutes} min</strong> ({runtime.pages} pages, using the standard 1 page ≈ 1 minute rule)</div>

        </div>
      </div>
      {preview&&(
        <div onClick={e=>e.stopPropagation()} style={{position:"fixed",inset:"5vh 10vw",background:"#E8E8E8",borderRadius:8,boxShadow:"0 12px 48px rgba(0,0,0,0.3)",zIndex:950,display:"flex",flexDirection:"column",overflow:"hidden"}}>
          <div style={{padding:"10px 16px",borderBottom:"1px solid #D0D0D0",display:"flex",justifyContent:"space-between",alignItems:"center",background:"#FFF",flexShrink:0}}>
            <span style={{fontSize:11,fontWeight:800,color:"#000",letterSpacing:"0.08em",textTransform:"uppercase"}}>Print Preview{sceneNumbers?" — Shooting Script":" — Spec Script"}</span>
            <div style={{display:"flex",gap:10,alignItems:"center"}}>
              <button onClick={doPrint} style={{padding:"6px 14px",background:"#000",color:"#FFF",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"inherit",fontSize:11.5,fontWeight:700}}>Print / Save as PDF</button>
              <button onClick={()=>setPreview(false)} style={{background:"none",border:"none",cursor:"pointer",color:"#999",fontSize:16}}>×</button>
            </div>
          </div>
          <div style={{flex:1,overflow:"auto",padding:"24px 0",display:"flex",justifyContent:"center"}}>
            <div style={{width:"8.5in",background:"#FFF",boxShadow:"0 2px 16px rgba(0,0,0,0.15)",boxSizing:"border-box"}} dangerouslySetInnerHTML={{__html:buildPrintHtml(project,{sceneNumbers})}}/>
          </div>
        </div>
      )}
    </div>
  );
}

function ImportModal({profile,onImport,onClose}){
  const [uploadMode,setUploadMode]=useState("smart");
  const [raw,setRaw]=useState("");
  const [filePayload,setFilePayload]=useState(null);
  const [fileName,setFileName]=useState("");
  const [fmt,setFmt]=useState(profile?.format||"film");
  const [genre,setGenre]=useState(profile?.genre||"Dark Fantasy");
  const [title,setTitle]=useState("Imported Script");
  const [loading,setLoading]=useState(false);
  const [status,setStatus]=useState("");
  const [error,setError]=useState("");
  const [pendingLines,setPendingLines]=useState(null);
  const [uncertainLines,setUncertainLines]=useState([]);
  const [pendingChars,setPendingChars]=useState(null);
  const [charToggles,setCharToggles]=useState({});
  const fileRef=useRef(null);
  const readAsBase64=(file)=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=e=>resolve(e.target.result.split(",")[1]);reader.onerror=reject;reader.readAsDataURL(file);});
  const loadScript=(src)=>new Promise((resolve,reject)=>{if(document.querySelector(`script[src="${src}"]`)){resolve();return;}const s=document.createElement("script");s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s);});
  const handleFile=async(e)=>{
    const file=e.target.files?.[0];if(!file) return;
    e.target.value="";setError("");setStatus("Reading file...");setFileName(file.name);
    setTitle(file.name.replace(/\.[^.]+$/,"").replace(/[-_]/g," ")||"Imported Script");
    const ext=file.name.split(".").pop().toLowerCase();
    const imageTypes=["jpg","jpeg","png","gif","webp","bmp","tiff","heic"];
    const textTypes=["txt","fountain","fdx","md","rtf"];
    if(imageTypes.includes(ext)){const b64=await readAsBase64(file);setFilePayload({type:"image",base64:b64,mediaType:file.type||"image/jpeg"});setRaw("");setStatus("Image loaded.");}
    else if(ext==="pdf"){
      setStatus("Reading PDF...");const b64=await readAsBase64(file);setFilePayload({type:"pdf",base64:b64,mediaType:"application/pdf"});setRaw("");
      try{
        await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.6.347/pdf.min.js");
        window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.6.347/pdf.worker.min.js";
        const arrayBuffer=await file.arrayBuffer();const doc=await window.pdfjsLib.getDocument({data:arrayBuffer}).promise;
        let fullText="";
        for(let i=1;i<=doc.numPages;i++){const page=await doc.getPage(i);const content=await page.getTextContent();let lastY=null;content.items.forEach(item=>{const y=item.transform[5];if(lastY!==null&&Math.abs(y-lastY)>2)fullText+="\n";else if(fullText&&!fullText.endsWith("\n"))fullText+=" ";fullText+=item.str;lastY=y;});fullText+="\n";}
        const extracted=fullText.trim().split("\n").map(l=>l.replace(/[ \t]+/g," ").trim()).join("\n");
        if(extracted.length>40){setRaw(extracted);setStatus(`PDF loaded — ${extracted.split("\n").filter(l=>l.trim()).length} lines found.`);}
        else setStatus("PDF loaded — looks scanned. Smart Upload only.");
      }catch(err){setStatus("PDF loaded — Smart Upload will still work.");}
    }
    else if(ext==="docx"){
      setStatus("Extracting text from DOCX...");
      try{await loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");const arrayBuffer=await file.arrayBuffer();const result=await window.mammoth.extractRawText({arrayBuffer});setRaw(result.value);setFilePayload(null);setStatus(`DOCX extracted.`);}
      catch(err){setError("Could not read DOCX.");setStatus("");}
    }
    else if(textTypes.includes(ext)){const reader=new FileReader();reader.onload=ev=>{setRaw(ev.target.result);setFilePayload(null);setStatus(`Text loaded.`);};reader.readAsText(file);}
    else{const reader=new FileReader();reader.onload=ev=>{const text=ev.target.result;if(typeof text==="string"&&text.trim()){setRaw(text);setFilePayload(null);setStatus(`File loaded.`);}else{setError("Could not read this file.");setStatus("");}};reader.onerror=()=>setError("File could not be read.");reader.readAsText(file);}
  };
  const canImport=raw.trim().length>0||filePayload!==null;
  const doTextImport=()=>{
    if(!raw.trim()){if(filePayload?.type==="image"){setError("Image files need Smart Upload.");}else if(filePayload?.type==="pdf"){setError("This PDF needs Smart Upload.");}return;}
    // Normalize whitespace — PDF extraction often produces "word   spaced   text"
    const normalize=(s)=>s.replace(/[ \t]+/g," ").trim();
    const lines=raw.split("\n").map(l=>normalize(l)).filter(Boolean).map((text,i)=>({id:Date.now()+i,text,mode:"action"}));
    onImport({title,format:fmt,genre,lines,cast:[]});
  };
  const doImport=async()=>{
    if(!canImport) return;
    setError("");
    // Plain/extracted text (paste, .txt, DOCX, or a PDF with a real text layer)
    // is classified locally — no API call, runs instantly.
    if(!filePayload){
      const parsed=classifyScriptText(raw,fmt);
      if(parsed.length===0){setError("No lines found.");return;}
      const charNames=[...new Set(parsed.filter(l=>l.mode==="character"&&l.text?.trim())
        .map(l=>extractCueName(l.text,fmt)).filter(n=>n&&!CUE_NAME_DENYLIST.has(n)))];
      const lines=parsed.map((l,i)=>({id:Date.now()+i,text:l.text||"",mode:l.mode||"action"}));
      const cast=charNames.map((name,i)=>({id:Date.now()+5000+i,name,role:"Supporting",voice:"",notes:""}));
      onImport({title,format:fmt,genre,lines,cast});
      return;
    }
    // Images and scanned PDFs have no extractable text — the AI vision call
    // still handles reading + classifying those.
    setLoading(true);setStatus("AI is reading your file...");
    const fmt_label=FORMATS.find(f=>f.id===fmt)?.label||"Script";
    const _isArtifact=window.location.hostname.includes("claude.ai")||window.location.protocol==="blob:";
    const _localKey=LS.get("sf_api_key",null);
    const _apiUrl=_localKey?"https://api.anthropic.com/v1/messages":_isArtifact?"https://api.anthropic.com/v1/messages":"/api/chat";
    const _headers={"Content-Type":"application/json",...(_localKey?{"x-api-key":_localKey,"anthropic-version":"2023-06-01"}:{})};
    try{
      let messages;
      if(filePayload.type==="image") messages=[{role:"user",content:[{type:"image",source:{type:"base64",media_type:filePayload.mediaType,data:filePayload.base64}},{type:"text",text:`Extract ALL text and classify each line. Format: ${fmt_label}. Genre: ${genre}. Return ONLY valid JSON array of {text, mode} objects.`}]}];
      else messages=[{role:"user",content:[{type:"document",source:{type:"base64",media_type:"application/pdf",data:filePayload.base64}},{type:"text",text:`Extract ALL text and classify each line. Format: ${fmt_label}. Genre: ${genre}. Return ONLY valid JSON array of {text, mode} objects.`}]}];
      const res=await fetch(_apiUrl,{method:"POST",headers:_headers,body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:4096,system:"You are a script formatting engine. Classify script content into BLOCKS — not individual lines. CRITICAL: never split a single speech or paragraph into multiple objects just because it contains line breaks. Join all continuation lines into one object using \\n. A dialogue block is everything one character says until the next speaker or action beat — one object. An action block is a full paragraph — one object. Only create a new object when the TYPE changes (e.g. action to character, character to dialogue). Classify each block as: action, character, dialogue, location, direction, note. For blocks you are less than 90% confident about, add uncertain:true. Return ONLY valid JSON array of {text,mode,uncertain?}. No markdown.",messages})});
      const d=await parseApiResponse(res);
      const raw_text=d.content?.filter(b=>b.type==="text").map(b=>b.text).join("")||"[]";
      let parsed;
      try{parsed=JSON.parse(raw_text.replace(/```json|```/g,"").trim());}
      catch(parseErr){const lastComplete=raw_text.lastIndexOf("},");if(lastComplete===-1)throw parseErr;parsed=JSON.parse(raw_text.slice(0,lastComplete+1)+"]");}
      if(parsed.length===0){setError("No lines found.");setLoading(false);setStatus("");return;}
      const uncertain=parsed.filter(l=>l.uncertain);
      const charNames=[...new Set(parsed.filter(l=>l.mode==="character"&&l.text?.trim()).map(l=>l.text.trim().toUpperCase()))];
      // Only show review screen if there are uncertain lines that need manual mode fixes.
      // Character names are auto-added to cast — no confirmation needed for a clean import.
      if(uncertain.length>0){
        setPendingLines(parsed);setUncertainLines(uncertain);setPendingChars(charNames);
        setCharToggles(Object.fromEntries(charNames.map(n=>[n,true])));setLoading(false);
        setStatus(`${parsed.length} blocks classified — ${uncertain.length} need review.`);return;
      }
      // Clean import — go straight through
      const lines=parsed.map((l,i)=>({id:Date.now()+i,text:l.text||"",mode:l.mode||"action"}));
      const cast=charNames.map((name,i)=>({id:Date.now()+5000+i,name,role:"Supporting",voice:"",notes:""}));
      onImport({title,format:fmt,genre,lines,cast});
    }catch(err){setError("Import failed: "+(err.message||"unknown error"));setStatus("");}
    setLoading(false);
  };
  const finalizeImport=()=>{
    const lines=pendingLines.map((l,i)=>({id:Date.now()+i,text:l.text||"",mode:l.mode||"action"}));
    const cast=(pendingChars||[]).filter(name=>charToggles[name]).map((name,i)=>({id:Date.now()+5000+i,name,role:"Supporting",voice:"",notes:""}));
    onImport({title,format:fmt,genre,lines,cast});
  };
  const ACCEPTED=".txt,.fountain,.fdx,.pdf,.doc,.docx,.md,.rtf,.jpg,.jpeg,.png,.gif,.webp,.bmp,.tiff,.heic";
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center"}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{width:700,maxHeight:"92vh",background:"#FFF",borderRadius:10,display:"flex",flexDirection:"column",overflow:"hidden",boxShadow:"0 8px 40px rgba(0,0,0,0.2)"}}>
        <div style={{padding:"20px 24px",borderBottom:"1px solid #EBEBEB",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div><p style={{margin:0,fontSize:15,fontWeight:800,color:"#000"}}>Import Script</p><p style={{margin:"3px 0 0",fontSize:12,color:"#AAA"}}>Smart (instant local formatting — AI only reads images/scans) or Text (no formatting)</p></div>
          <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",fontSize:22,color:"#AAA",lineHeight:1,padding:4}}>×</button>
        </div>
        <div style={{flex:1,overflowY:"auto",padding:24,display:"flex",flexDirection:"column",gap:16}}>
          <div style={{display:"flex",gap:8}}>
            {[["smart","✦ Smart Upload","Classifies every line instantly (AI only for images/scans)"],["text","Text Upload","No formatting — instant, mark lines yourself"]].map(([id,lbl,sub])=>(
              <button key={id} onClick={()=>setUploadMode(id)} style={{flex:1,padding:"10px 14px",borderRadius:6,cursor:"pointer",fontFamily:"inherit",textAlign:"left",border:`1px solid ${uploadMode===id?"#000":"#E0E0E0"}`,background:uploadMode===id?"#000":"#FAFAFA",color:uploadMode===id?"#FFF":"#555"}}>
                <span style={{fontSize:13,fontWeight:700}}>{lbl}</span>
                <span style={{display:"block",fontSize:11,marginTop:2,color:uploadMode===id?"#BBB":"#AAA"}}>{sub}</span>
              </button>
            ))}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
            <div><label style={css.label}>Project title</label><input value={title} onChange={e=>setTitle(e.target.value)} style={css.input}/></div>
            <div><label style={css.label}>Format</label><select value={fmt} onChange={e=>setFmt(e.target.value)} style={{...css.input,fontSize:12}}>{FORMATS.map(f=><option key={f.id} value={f.id}>{f.label}</option>)}</select></div>
            <div><label style={css.label}>Genre</label><select value={genre} onChange={e=>setGenre(e.target.value)} style={{...css.input,fontSize:12}}>{GENRES.map(g=><option key={g}>{g}</option>)}</select></div>
          </div>
          {pendingLines&&(uncertainLines.length>0||(pendingChars&&pendingChars.length>0))&&(
            <div style={{background:"#FAFAFA",border:"1px solid #E0E0E0",borderRadius:6,padding:16}}>
              {pendingChars&&pendingChars.length>0&&(
                <div style={{marginBottom:uncertainLines.length>0?20:4}}>
                  <p style={{margin:"0 0 12px",fontSize:13,fontWeight:700,color:"#000"}}>{pendingChars.length} character{pendingChars.length!==1?"s":""} found — add to cast?</p>
                  <div style={{display:"flex",flexDirection:"column",gap:6}}>
                    {pendingChars.map(name=>(
                      <div key={name} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 12px",background:"#FFF",border:"1px solid #EBEBEB",borderRadius:4}}>
                        <span style={{fontSize:12,fontWeight:700,color:"#000"}}>{name}</span>
                        <div style={{display:"flex",gap:4}}>
                          {[["Yes",true],["No",false]].map(([lbl,val])=>(
                            <button key={lbl} onClick={()=>setCharToggles(t=>({...t,[name]:val}))} style={{padding:"4px 10px",borderRadius:3,cursor:"pointer",fontFamily:"inherit",fontSize:10,fontWeight:700,textTransform:"uppercase",background:(charToggles[name]===val)?"#000":"#F4F4F4",color:(charToggles[name]===val)?"#FFF":"#999",border:`1px solid ${(charToggles[name]===val)?"#000":"#E0E0E0"}`}}>{lbl}</button>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              {uncertainLines.length>0&&(
                <div>
                  <p style={{margin:"0 0 14px",fontSize:13,fontWeight:700,color:"#000"}}>Review {uncertainLines.length} uncertain line{uncertainLines.length!==1?"s":""}</p>
                  {uncertainLines.map((line,i)=>(
                    <div key={i} style={{marginBottom:12,padding:"10px 12px",background:"#FFF",border:"1px solid #EBEBEB",borderRadius:4}}>
                      <p style={{margin:"0 0 8px",fontSize:12,fontFamily:"'Courier New',monospace",color:"#333"}}>{line.text}</p>
                      <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                        {["action","character","dialogue","location","direction","note"].map(mode=>(
                          <button key={mode} onClick={()=>{const updated=pendingLines.map(l=>l===line?{...l,mode,uncertain:false}:l);setPendingLines(updated);setUncertainLines(updated.filter(l=>l.uncertain));}} style={{padding:"4px 10px",borderRadius:3,cursor:"pointer",fontFamily:"inherit",fontSize:10,fontWeight:700,textTransform:"uppercase",background:line.mode===mode?"#000":"#F4F4F4",color:line.mode===mode?"#FFF":"#666",border:`1px solid ${line.mode===mode?"#000":"#E0E0E0"}`}}>{mode}</button>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              )}
              <button onClick={finalizeImport} style={{width:"100%",padding:"9px",background:"#000",color:"#FFF",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"inherit",fontWeight:700,fontSize:13,marginTop:8}}>Looks good — Import</button>
            </div>
          )}
          <div onDragOver={e=>{e.preventDefault();e.currentTarget.style.borderColor="#000";}} onDragLeave={e=>{e.currentTarget.style.borderColor="#D0D0D0";}}
            onDrop={e=>{e.preventDefault();e.currentTarget.style.borderColor="#D0D0D0";const file=e.dataTransfer.files?.[0];if(file){const dt=new DataTransfer();dt.items.add(file);fileRef.current.files=dt.files;handleFile({target:fileRef.current});}}}
            onClick={()=>fileRef.current?.click()}
            style={{border:"1px dashed #D0D0D0",borderRadius:6,padding:"20px 24px",textAlign:"center",cursor:"pointer",background:fileName?"#FAFAFA":"#FFF"}}>
            {fileName?(<div><p style={{margin:"0 0 4px",fontSize:13,fontWeight:700,color:"#000"}}>📄 {fileName}</p><p style={{margin:0,fontSize:11,color:"#AAA"}}>{status}</p></div>)
              :(<div><p style={{margin:"0 0 6px",fontSize:13,color:"#555"}}>Drop file here or click to browse</p><p style={{margin:0,fontSize:11,color:"#BBB"}}>PDF · DOCX · TXT · Fountain · JPG · PNG · and more</p></div>)}
            <input ref={fileRef} type="file" accept={ACCEPTED} style={{display:"none"}} onChange={handleFile}/>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <div style={{flex:1,height:1,background:"#EBEBEB"}}/><span style={{fontSize:10,color:"#CCC",fontWeight:600,textTransform:"uppercase",letterSpacing:"0.1em"}}>or paste text</span><div style={{flex:1,height:1,background:"#EBEBEB"}}/>
          </div>
          <textarea value={raw} onChange={e=>{setRaw(e.target.value);setFileName("");setFilePayload(null);setStatus("");}}
            placeholder={"Paste your script here...\n\nFADE IN:\n\nEXT. CITY — NIGHT"}
            style={{...css.input,resize:"none",height:180,fontFamily:"'Courier New',monospace",fontSize:12,lineHeight:1.7,color:"#333"}}/>
          {error&&<p style={{fontSize:12,color:"#888",margin:0}}>{error}</p>}
        </div>
        <div style={{padding:"16px 24px",borderTop:"1px solid #EBEBEB",display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
          <p style={{margin:0,fontSize:11,color:loading?"#555":"#CCC"}}>{loading?status:canImport?(uploadMode==="smart"&&filePayload?"Ready to import":"Ready — imports instantly."):"Upload a file or paste text above"}</p>
          <div style={{display:"flex",gap:10}}>
            <button onClick={onClose} style={{padding:"9px 20px",background:"none",border:"1px solid #D0D0D0",borderRadius:4,cursor:"pointer",fontFamily:"inherit",fontSize:13,color:"#666"}}>Cancel</button>
            <button onClick={uploadMode==="smart"?doImport:doTextImport} disabled={loading||!canImport} style={{padding:"9px 24px",background:"#000",color:"#FFF",border:"none",borderRadius:4,cursor:loading||!canImport?"not-allowed":"pointer",fontFamily:"inherit",fontWeight:700,fontSize:13,opacity:loading||!canImport?0.4:1}}>{loading?"Importing...":uploadMode==="smart"?"Import & Format":"Import as Text"}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function NotesPanel({notes,onChange,onClose}){
  const [collapsed,setCollapsed]=useState(false);
  // Bug fix: this used to have a "fullscreen" mode (position:fixed,inset:0)
  // that covered the entire viewport — Notes should only ever be a sidebar.
  // Collapsing now just narrows it to a thin strip instead of hiding the
  // editor behind it.
  if(collapsed) return(
    <div style={{width:32,minWidth:32,borderLeft:"1px solid #EBEBEB",display:"flex",flexDirection:"column",alignItems:"center",background:"#FFF",flexShrink:0,paddingTop:14}}>
      <button onClick={()=>setCollapsed(false)} title="Expand notes" style={{background:"none",border:"none",cursor:"pointer",color:"#AAA",fontSize:10,fontWeight:800,letterSpacing:"0.1em",writingMode:"vertical-lr",textOrientation:"mixed",padding:0}}>NOTES</button>
    </div>
  );
  return(
    <div style={{width:280,minWidth:280,borderLeft:"1px solid #EBEBEB",display:"flex",flexDirection:"column",background:"#FFF",flexShrink:0,overflow:"hidden"}}>
      <div style={{padding:"12px 16px",borderBottom:"1px solid #EBEBEB",display:"flex",justifyContent:"space-between",alignItems:"center",flexShrink:0}}>
        <span style={{fontSize:10,fontWeight:800,color:"#AAA",letterSpacing:"0.12em",textTransform:"uppercase"}}>Notes</span>
        <div style={{display:"flex",gap:12,alignItems:"center"}}>
          <button onClick={()=>setCollapsed(true)} title="Collapse" style={{background:"none",border:"none",cursor:"pointer",color:"#BBB",fontSize:13,padding:0}}>⛝</button>
          {onClose&&<button onClick={onClose} title="Close" style={{background:"none",border:"none",cursor:"pointer",color:"#CCC",fontSize:16,lineHeight:1,padding:0}}>×</button>}

const ACT_LABELS=["Act 1","Act 2A","Midpoint","Act 2B","Act 3","Custom"];
function BeatBoard({project,onUpdate}){
  const beats=project?.beats||[];
  const [dragging,setDragging]=useState(null);
  const [editing,setEditing]=useState(null);
  const [dragOver,setDragOver]=useState(null);
  const save=(newBeats)=>onUpdate({beats:newBeats});
  const addBeat=()=>{const b={id:Date.now(),title:"New Beat",body:"",act:"Act 1"};save([...beats,b]);setEditing(b.id);};
  const updateBeat=(id,changes)=>save(beats.map(b=>b.id===id?{...b,...changes}:b));
  const deleteBeat=(id)=>save(beats.filter(b=>b.id!==id));
  const handleDragStart=(e,idx)=>{setDragging(idx);e.dataTransfer.effectAllowed="move";};
  const handleDrop=(e,idx)=>{e.preventDefault();if(dragging===null||dragging===idx)return;const next=[...beats];const[moved]=next.splice(dragging,1);next.splice(idx,0,moved);save(next);setDragging(null);setDragOver(null);};
  return(
    <div style={{flex:1,overflowY:"auto",padding:"20px 20px 60px",background:"#FAFAFA"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:22}}>

              {group.map(beat=>{
                const globalIdx=beats.indexOf(beat);
                return(
                  <div key={beat.id} draggable onDragStart={e=>handleDragStart(e,globalIdx)} onDragOver={e=>{e.preventDefault();setDragOver(globalIdx);}} onDrop={e=>handleDrop(e,globalIdx)} onDragEnd={()=>{setDragging(null);setDragOver(null);}}
                    style={{width:165,background:"#FFF",border:`1px solid ${dragOver===globalIdx?"#000":"#E0E0E0"}`,borderRadius:6,padding:"11px 12px",cursor:"grab",opacity:dragging===globalIdx?0.4:1}}>
                    {editing===beat.id?(
                      <>
                        <input value={beat.title} onChange={e=>updateBeat(beat.id,{title:e.target.value})} style={{width:"100%",border:"none",borderBottom:"1px solid #E0E0E0",outline:"none",fontSize:12,fontWeight:700,marginBottom:6,background:"transparent",fontFamily:"inherit"}} onBlur={()=>setEditing(null)} autoFocus/>
                        <textarea value={beat.body} onChange={e=>updateBeat(beat.id,{body:e.target.value})} style={{width:"100%",border:"1px solid #EBEBEB",borderRadius:3,outline:"none",fontSize:11,resize:"none",minHeight:60,padding:6,fontFamily:"inherit",lineHeight:1.5,boxSizing:"border-box"}}/>
                        <select value={beat.act} onChange={e=>updateBeat(beat.id,{act:e.target.value})} style={{...css.input,fontSize:10,padding:"3px 6px",marginTop:6}}>{ACT_LABELS.map(a=><option key={a}>{a}</option>)}</select>
                      </>
                    ):(
                      <>
                        <p style={{margin:"0 0 5px",fontSize:12,fontWeight:700,color:"#000",lineHeight:1.3}}>{beat.title||"Untitled"}</p>
                        {beat.body&&<p style={{margin:"0 0 6px",fontSize:11,color:"#666",lineHeight:1.5}}>{beat.body.slice(0,80)}{beat.body.length>80?"…":""}</p>}
                      </>

                      <button onClick={()=>setEditing(beat.id)} style={{background:"none",border:"none",cursor:"pointer",fontSize:10,color:"#BBB",padding:0,fontFamily:"inherit"}}>Edit</button>
                      <button onClick={()=>deleteBeat(beat.id)} style={{background:"none",border:"none",cursor:"pointer",fontSize:10,color:"#CCC",padding:0,fontFamily:"inherit"}}>×</button>
                    </div>
                  </div>
                );
              })}
            </div>
            <div style={{borderTop:"1px solid #EBEBEB",marginTop:20}}/>
          </div>
        );
      })}

const SCENE_STATUS={todo:{icon:"○",label:"To Do"},inprogress:{icon:"◑",label:"In Progress"},done:{icon:"●",label:"Done"},revision:{icon:"✗",label:"Needs Revision"}};
function SceneNavigator({lines,onJumpTo,collapsed,onToggle,statuses,onUpdateStatuses}){
  const scenes=[];let page=1;
  lines.forEach((line,idx)=>{if(line.mode==="location"&&line.text?.trim()) scenes.push({idx,text:line.text.trim(),page});if(idx>0&&idx%55===0) page++;});
  const cycleStatus=(idx,e)=>{
    e.stopPropagation();
    const keys=Object.keys(SCENE_STATUS);const cur=statuses?.[idx]||"todo";const next=keys[(keys.indexOf(cur)+1)%keys.length];
    onUpdateStatuses({...(statuses||{}),[idx]:next});
  };
  if(collapsed) return null;
  return(
    <div style={{width:220,minWidth:220,borderLeft:"1px solid #EBEBEB",background:"#FAFAFA",display:"flex",flexDirection:"column",flexShrink:0,overflow:"hidden"}}>
      <div style={{padding:"12px 12px 10px",borderBottom:"1px solid #EBEBEB",display:"flex",justifyContent:"space-between",alignItems:"center",flexShrink:0}}>
        <span style={{fontSize:9,fontWeight:800,color:"#AAA",letterSpacing:"0.14em",textTransform:"uppercase"}}>Scenes</span>
        <button onClick={onToggle} style={{background:"none",border:"none",cursor:"pointer",color:"#BBB",fontSize:13,padding:2}}>×</button>
      </div>
      <div style={{flex:1,overflowY:"auto"}}>
        {scenes.length===0&&<p style={{padding:"16px 12px",fontSize:11,color:"#CCC",fontStyle:"italic"}}>No scene headings yet.</p>}
        {scenes.map((s,i)=>{
          const statusKey=statuses?.[s.idx]||"todo";
          const status=SCENE_STATUS[statusKey];
          return(
          <div key={s.idx} onClick={()=>onJumpTo(s.idx)} style={{padding:"8px 12px",borderBottom:"1px solid #F0F0F0",cursor:"pointer",display:"flex",alignItems:"flex-start",gap:8}}
            onMouseEnter={e=>e.currentTarget.style.background="#F5F5F5"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
            <span style={{fontSize:9,color:"#CCC",marginTop:2,flexShrink:0,minWidth:16}}>{i+1}</span>
            <div style={{flex:1,overflow:"hidden"}}><p style={{margin:0,fontSize:11,color:"#333",lineHeight:1.4,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.text}</p><span style={{fontSize:9,color:"#BBB"}}>p.{s.page}</span></div>
            <button onClick={e=>cycleStatus(s.idx,e)} title={`${status.label} — click to change`} style={{background:"none",border:"none",cursor:"pointer",fontSize:11,color:"#AAA",flexShrink:0,padding:0}}>{status.icon}</button>
          </div>
          );
        })}
      </div>
      <div style={{padding:"8px 12px",borderTop:"1px solid #EBEBEB",flexShrink:0}}>
        {Object.entries(SCENE_STATUS).map(([k,v])=>(
          <div key={k} style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
            <span style={{fontSize:10,color:"#AAA",width:12,textAlign:"center"}}>{v.icon}</span>
            <span style={{fontSize:9,color:"#BBB"}}>{v.label}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function PageOverview({lines,onJumpTo,onClose}){
  const pages=[];
  let currentPage=1,snippet="",startIdx=0;
  (lines||[]).forEach((line,idx)=>{
    const page=Math.floor(idx/LINES_PER_PAGE)+1;
    if(page!==currentPage){
      pages.push({num:currentPage,idx:startIdx,snippet:snippet||"(blank)"});
      currentPage=page;snippet="";startIdx=idx;

    if(!snippet&&line.text?.trim()) snippet=line.text.trim().slice(0,44);

            <p style={{margin:"0 0 8px",fontSize:9,fontWeight:800,color:"#CCC",textTransform:"uppercase"}}>All Scenes</p>
            {inactive.map(s=>(<div key={s.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:"1px solid #F0F0F0"}}>
              <div style={{width:36,height:28,borderRadius:3,overflow:"hidden",flexShrink:0}}><MediaImage src={s.image} alt={s.label} style={{width:"100%",height:"100%",objectFit:"cover"}}/></div>
              <div style={{flex:1,overflow:"hidden"}}><p style={{margin:0,fontSize:11,fontWeight:600,color:"#555",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.label}</p><span style={{fontSize:9,color:"#CCC"}}>p.{s.fromPage}–{s.toPage}</span></div>
              <button onClick={()=>deleteScene(s.id)} style={{background:"none",border:"none",cursor:"pointer",color:"#CCC",fontSize:13,padding:0,flexShrink:0}}>×</button>
            </div>))}
          </div>
        )}
        {scenes.length===0&&!adding&&(<div style={{textAlign:"center",padding:"32px 0",color:"#CCC"}}><p style={{fontSize:12,margin:"0 0 8px"}}>No scenes yet.</p><p style={{fontSize:11,margin:0,lineHeight:1.6}}>Click + to attach an image to a page range.</p></div>)}
      </div>
    </div>
  );
}

// ─── APP SHELL ────────────────────────────────────────────────────────────────
const NAV_ITEMS=[
  {id:"write",icon:"✍",label:"Write"},{id:"cast",icon:"◉",label:"Cast"},
  {id:"beats",icon:"⊞",label:"Beat Board"},{id:"mood",icon:"◈",label:"Mood Board"},
  {id:"profile",icon:"◎",label:"Profile"},
];

function App({profile,onEditProfile,onUpdateProfile,onHome,initialProject,initialProjects,onSaveProject,onBackToDash,user,onSignOut}){
  const [nav,setNav]=useState("write");
  // Bug fix: this used to seed with just [initialProject], so App never
  // knew about the user's other scripts — the project switcher had nothing
  // to show, and any project created from inside the writing view (the
  // sidebar "+" or "+ New project") wasn't in the persisted list yet, so it
  // silently failed to save (see onSaveProject upsert fix in Root below).
  const [projects,setProjects]=useState(()=>{
    if(initialProjects&&initialProjects.length) return initialProjects;
    if(initialProject) return [initialProject];
    return LS.get("sf_projects",[]);
  });
  const [activeId,setActiveId]=useState(()=>initialProject?.id||null);
  const [aiOpen,setAiOpen]=useState(false);
  const [castOpen,setCastOpen]=useState(false);
  const [notesOpen,setNotesOpen]=useState(false);
  const [overviewOpen,setOverviewOpen]=useState(false);
  const [beatsOpen,setBeatsOpen]=useState(false);
  const [beatsExpanded,setBeatsExpanded]=useState(false);
  const [moodOpen,setMoodOpen]=useState(false);
  const [moodExpanded,setMoodExpanded]=useState(false);
  const [boardZoom,setBoardZoom]=useState(1);
  const [hoveredNav,setHoveredNav]=useState(null);
  const [pageInfo,setPageInfo]=useState({cur:1,total:1});
  const [importOpen,setImportOpen]=useState(false);
  const [exportOpen,setExportOpen]=useState(false);
  const [focusMode,setFocusMode]=useState(false);
  const [shortcutsOpen,setShortcutsOpen]=useState(false);
  const [sceneNavCollapsed,setSceneNavCollapsed]=useState(true);
  const [showFormatGuide,setShowFormatGuide]=useState(false);
  const [wordCount,setWordCount]=useState(0);
  const [lastSaved,setLastSaved]=useState(null);
  const [saveToast,setSaveToast]=useState(false);
  const saveToastTimerRef=useRef(null);
  const flashSaved=()=>{
    setLastSaved(new Date());
    setSaveToast(true);
    clearTimeout(saveToastTimerRef.current);
    saveToastTimerRef.current=setTimeout(()=>setSaveToast(false),2000);
  };
  const [projectMenuOpen,setProjectMenuOpen]=useState(false);
  const [projectSearch,setProjectSearch]=useState("");
  const [darkCanvas,setDarkCanvas]=useState(false);
  const [galleryOpen,setGalleryOpen]=useState(false);
  const [charPanelOpen,setCharPanelOpen]=useState(false);
  const [currentCharName,setCurrentCharName]=useState("");
  const [titlePageEditorOpen,setTitlePageEditorOpen]=useState(false);
  const [userMenuOpen,setUserMenuOpen]=useState(false);

  const active=projects.find(p=>p.id===activeId)||projects[0]||null;

  const mountedRef=useRef(false);
  useEffect(()=>{
    if(!mountedRef.current){mountedRef.current=true;return;}
    if(onSaveProject&&active)onSaveProject(active);
    else LS.set("sf_projects",projects);
  },[projects]);

  useEffect(()=>{
    const handler=(e)=>{
      if(!(e.metaKey||e.ctrlKey)) return;
      if(e.key==="k"&&AI_FEATURES_ENABLED){e.preventDefault();setAiOpen(o=>!o);}
      if(e.key==="b"){e.preventDefault();setNav(n=>n==="beats"?"write":"beats");}
      if(e.key==="f"){e.preventDefault();setFocusMode(o=>!o);}
      if(e.key==="m"){e.preventDefault();setSceneNavCollapsed(o=>!o);}
      if(e.key==="/"){e.preventDefault();setShortcutsOpen(o=>!o);}
      if(e.key==="s"){e.preventDefault();flushRef.current?.();}
    };
    const closeMenu=(e)=>{if(userMenuOpen) setUserMenuOpen(false);};
    window.addEventListener("keydown",handler);
    window.addEventListener("click",closeMenu);
    return()=>{window.removeEventListener("keydown",handler);window.removeEventListener("click",closeMenu);};
  },[userMenuOpen]);

  useEffect(()=>{
    const wc=(active?.lines||[]).reduce((acc,l)=>acc+(l.text||"").split(/\s+/).filter(Boolean).length,0);
    setWordCount(wc);
  },[active?.id,active?.lines]);

  const newProject=()=>{
    const p={id:Date.now(),title:"Untitled",format:profile.format,genre:profile.genre,lines:[],cast:[],notes:"",moodCards:[],beats:[],sceneGallery:[],created:Date.now()};
    setProjects(prev=>[p,...prev]);setActiveId(p.id);setNav("write");
  };

  const updateProject=(id,changes)=>setProjects(prev=>prev.map(p=>p.id===id?{...p,...changes}:p));
  const updateLines=(lines)=>{if(active){updateProject(active.id,{lines});flashSaved();}};
  const updateNotes=(notes)=>{if(active)updateProject(active.id,{notes});};
  const addCharacter=(char)=>{if(!active)return;const exists=active.cast?.some(c=>c.name.toUpperCase()===char.name.toUpperCase());if(!exists)updateProject(active.id,{cast:[...(active.cast||[]),char]});};
  const updateCharacter=(charId,field,val)=>{if(!active)return;updateProject(active.id,{cast:active.cast.map(c=>c.id===charId?{...c,[field]:val}:c)});};
  const updateMoodCards=(cards)=>{if(active)updateProject(active.id,{moodCards:cards});};
  const updateBeats=(changes)=>{if(active)updateProject(active.id,changes);};
  const updateSceneStatuses=(statuses)=>{if(active)updateProject(active.id,{sceneStatuses:statuses});};
  const updateSceneGallery=(changes)=>{if(active)updateProject(active.id,changes);};
  const updateFreePages=(freePages)=>{if(active)updateProject(active.id,{freePages});};
  const addFreePage=()=>{updateFreePages([...(active?.freePages||[]),{id:Date.now(),position:"front",image:null,text:""}]);};

  const importScript=(imported)=>{
    const p={id:Date.now(),title:imported.title,format:imported.format,genre:imported.genre,lines:imported.lines,cast:imported.cast||[],notes:"",moodCards:[],beats:[],sceneGallery:[],created:Date.now()};
    setProjects(prev=>[p,...prev]);setActiveId(p.id);setNav("write");setImportOpen(false);
  };

  const cast=active?.cast||[];
  const sceneNavRef=useRef(null);
  const jumpToLine=(idx)=>{if(sceneNavRef.current)sceneNavRef.current(idx);};
  const fmtLastSaved=()=>{if(!lastSaved)return"Not saved";const sec=Math.floor((Date.now()-lastSaved)/1000);if(sec<60)return"Just now";return`${Math.floor(sec/60)}m ago`;};

  // ── MANUAL / EMERGENCY SAVE ────────────────────────────────────────────────
  const flushRef=useRef(null);
  const undoRedoRef=useRef(null);
  // Bypasses React state entirely — writes straight to localStorage via the
  // same onSaveProject Root already uses, so it still works even if this
  // runs during a 'beforeunload' teardown where scheduled state updates
  // aren't guaranteed to run before the tab actually closes.
  const forceSaveNow=(updatedLines)=>{
    if(!active) return;
    const updated={...active,lines:updatedLines};
    if(onSaveProject) onSaveProject(updated);
    flashSaved();
  };
  const manualSave=()=>{flushRef.current?.();};
  useEffect(()=>{
    const onBeforeUnload=()=>{flushRef.current?.();};
    window.addEventListener("beforeunload",onBeforeUnload);
    return()=>window.removeEventListener("beforeunload",onBeforeUnload);
  },[]);

  return(
    <div style={{height:"100vh",display:"flex",background:"#FFF",color:"#0A0A0A",fontFamily:"-apple-system,'Segoe UI',sans-serif",overflow:"hidden"}}>
      {focusMode&&(
        <div style={{position:"fixed",inset:0,zIndex:2000,background:"#FFF",display:"flex",flexDirection:"column"}}>
          <div style={{padding:"10px 20px",display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:"1px solid #EBEBEB"}}>
            <span style={{fontSize:12,fontWeight:700,color:"#000"}}>{active?.title||"Untitled"}</span>
            <div style={{display:"flex",gap:16,alignItems:"center"}}>
              <span style={{fontSize:11,color:"#AAA"}}>p.{pageInfo.cur}/{pageInfo.total} · {wordCount.toLocaleString()} words</span>
              <button onClick={()=>setFocusMode(false)} style={{background:"none",border:"1px solid #DDD",borderRadius:4,padding:"4px 12px",cursor:"pointer",fontSize:11,fontFamily:"inherit",color:"#666"}}>Exit Focus ⌘F</button>
            </div>
          </div>
          <div style={{flex:1,overflow:"hidden"}}>
            {active&&<SmartEditor project={active} cast={cast} onUpdateContent={updateLines} onAddCharacter={addCharacter} format={active.format} onPageChange={(cur,total)=>setPageInfo({cur,total})} focusMode={true} scrollRef={sceneNavRef} profile={profile} onEditTitlePage={()=>setTitlePageEditorOpen(true)} onForceSave={forceSaveNow} flushRef={flushRef} undoRedoRef={undoRedoRef} freePages={active.freePages} onUpdateFreePages={updateFreePages}/>}
          </div>
        </div>
      )}

      <div style={{width:52,background:"#FFF",borderRight:"1px solid #EBEBEB",display:"flex",flexDirection:"column",alignItems:"center",paddingTop:16,flexShrink:0,zIndex:600}}>
        <div style={{position:"relative",marginBottom:20,paddingBottom:16,borderBottom:"1px solid #EBEBEB",width:"100%",display:"flex",justifyContent:"center"}}
          onMouseEnter={()=>setHoveredNav("home")} onMouseLeave={()=>setHoveredNav(null)}>
          <button onClick={onBackToDash||onHome} style={{background:"none",border:"none",cursor:"pointer",padding:4}}>
            <p style={{margin:0,fontSize:10,fontWeight:900,color:"#000",letterSpacing:"0.1em",writingMode:"vertical-lr",textOrientation:"mixed",transform:"rotate(180deg)"}}>SF</p>
          </button>
          {hoveredNav==="home"&&<div style={{position:"absolute",left:44,top:"50%",transform:"translateY(-50%)",background:"#000",color:"#FFF",padding:"4px 10px",borderRadius:4,fontSize:11,fontWeight:700,whiteSpace:"nowrap",pointerEvents:"none",zIndex:700}}>Home</div>}
        </div>

        {/* Dedicated Projects tab — the "SF" logo above is easy to miss as
            a way back to your other scripts, so this gives switching
            projects its own clearly-labeled entry point. */}
        <div style={{position:"relative",width:"100%",display:"flex",justifyContent:"center",marginBottom:8}}
          onMouseEnter={()=>setHoveredNav("projects")} onMouseLeave={()=>setHoveredNav(null)}>
          <button onClick={onBackToDash||onHome} style={{width:36,height:36,borderRadius:8,border:"none",background:"transparent",color:"#999",cursor:"pointer",fontSize:15,display:"flex",alignItems:"center",justifyContent:"center"}}>▤</button>
          {hoveredNav==="projects"&&<div style={{position:"absolute",left:44,top:"50%",transform:"translateY(-50%)",background:"#000",color:"#FFF",padding:"4px 10px",borderRadius:4,fontSize:11,fontWeight:700,whiteSpace:"nowrap",pointerEvents:"none",zIndex:700}}>Projects</div>}
        </div>
        {NAV_ITEMS.map(item=>{
          const isToggle=item.id==="cast"||item.id==="beats"||item.id==="mood";
          const isActive=item.id==="cast"?castOpen:item.id==="beats"?beatsOpen:item.id==="mood"?moodOpen:nav===item.id&&!isToggle;
          return(
            <div key={item.id} style={{position:"relative",width:"100%",display:"flex",justifyContent:"center",marginBottom:4}}
              onMouseEnter={()=>setHoveredNav(item.id)} onMouseLeave={()=>setHoveredNav(null)}>
              <button onClick={()=>{
                if(item.id==="cast"){setCastOpen(o=>!o);}
                else if(item.id==="beats"){setNav("write");setBeatsOpen(o=>!o);setMoodOpen(false);}
                else if(item.id==="mood"){setNav("write");setMoodOpen(o=>!o);setBeatsOpen(false);}
                else if(nav===item.id){setNav("write");setCastOpen(false);}
                else{setNav(item.id);setCastOpen(false);setBeatsOpen(false);setMoodOpen(false);}
              }} style={{width:36,height:36,borderRadius:8,border:"none",background:isActive?"#000":"transparent",color:isActive?"#FFF":"#999",cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.12s"}}>{item.icon}</button>
              {hoveredNav===item.id&&<div style={{position:"absolute",left:44,top:"50%",transform:"translateY(-50%)",background:"#000",color:"#FFF",padding:"4px 10px",borderRadius:4,fontSize:11,fontWeight:700,whiteSpace:"nowrap",pointerEvents:"none",zIndex:700}}>{item.label}</div>}
            </div>
          );
        })}
        <div style={{marginTop:"auto",display:"flex",flexDirection:"column",alignItems:"center",gap:8,marginBottom:16,width:"100%"}}>
          {/* User avatar */}
          {user&&(()=>{
            const initials=(user.name||profile?.name||"?").trim().split(/\s+/).map(w=>w[0]?.toUpperCase()||"").slice(0,2).join("");
            return(
              <div style={{position:"relative",width:"100%",display:"flex",justifyContent:"center"}}>
                <button onClick={(e)=>{e.stopPropagation();setUserMenuOpen(o=>!o);}}
                  style={{width:32,height:32,borderRadius:"50%",background:"#000",border:"none",cursor:"pointer",
                    display:"flex",alignItems:"center",justifyContent:"center",
                    fontSize:10,fontWeight:800,color:"#FFF",letterSpacing:"0.04em",flexShrink:0}}>
                  {initials}
                </button>
                {userMenuOpen&&(
                  <div style={{position:"absolute",bottom:"100%",left:44,marginBottom:4,
                    background:"#FFF",border:"1px solid #E0E0E0",borderRadius:6,
                    boxShadow:"0 4px 16px rgba(0,0,0,0.12)",zIndex:700,minWidth:180,overflow:"hidden"}}>
                    <div style={{padding:"12px 14px",borderBottom:"1px solid #F0F0F0"}}>
                      <p style={{margin:0,fontSize:12,fontWeight:700,color:"#000"}}>{user.name||profile?.name||""}</p>
                      <p style={{margin:"2px 0 0",fontSize:11,color:"#AAA"}}>{user.email||""}</p>
                    </div>
                    <button onClick={()=>{setUserMenuOpen(false);setNav("profile");}}
                      style={{display:"block",width:"100%",padding:"10px 14px",background:"none",border:"none",
                        borderBottom:"1px solid #F5F5F5",cursor:"pointer",textAlign:"left",
                        fontFamily:"inherit",fontSize:12,color:"#555"}}>Edit Profile</button>
                    <button onClick={()=>{setUserMenuOpen(false);onSignOut&&onSignOut();}}
                      style={{display:"block",width:"100%",padding:"10px 14px",background:"none",border:"none",
                        cursor:"pointer",textAlign:"left",fontFamily:"inherit",fontSize:12,color:"#555"}}>Sign out</button>
                  </div>
                )}
              </div>
            );
          })()}
          {user&&(
            <div style={{position:"relative",width:"100%",display:"flex",justifyContent:"center"}}
              onMouseEnter={()=>setHoveredNav("signout")} onMouseLeave={()=>setHoveredNav(null)}>
              <button onClick={()=>onSignOut&&onSignOut()} style={{width:28,height:28,borderRadius:6,border:"1px solid #E8E8E8",background:"none",color:"#AAA",cursor:"pointer",fontSize:12,display:"flex",alignItems:"center",justifyContent:"center"}}>⏻</button>
              {hoveredNav==="signout"&&<div style={{position:"absolute",left:44,top:"50%",transform:"translateY(-50%)",background:"#000",color:"#FFF",padding:"4px 10px",borderRadius:4,fontSize:11,fontWeight:700,whiteSpace:"nowrap",pointerEvents:"none",zIndex:700}}>Sign out</div>}
            </div>
          )}
          <button onClick={newProject} style={{width:36,height:36,borderRadius:8,border:"1px dashed #CCC",background:"none",color:"#CCC",cursor:"pointer",fontSize:18,display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
        </div>
      </div>

      {castOpen&&(
        <CastPanel cast={cast} lines={active?.lines} onUpdate={updateCharacter}
          onAdd={(onAdded)=>{const c={id:Date.now(),name:"NEW CHARACTER",role:"Supporting",voice:"",notes:""};addCharacter(c);if(onAdded)onAdded(cast.length);}}
          onDelete={(charId)=>{if(!active)return;updateProject(active.id,{cast:active.cast.filter(c=>c.id!==charId)});}}
          onClose={()=>setCastOpen(false)} onJumpTo={jumpToLine}/>
      )}

      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <div style={{height:48,borderBottom:"1px solid #EBEBEB",display:"flex",alignItems:"center",padding:"0 20px",gap:16,flexShrink:0}}>
          {nav==="write"&&active&&(
            <>
              <div style={{flex:1,minWidth:0,position:"relative",display:"flex",alignItems:"center",gap:6}}>
                <input value={active.title} onChange={e=>updateProject(active.id,{title:e.target.value})}
                  style={{background:"none",border:"none",color:"#000",fontSize:14,fontWeight:700,outline:"none",fontFamily:"inherit",flex:1,minWidth:0}}/>
                {projects.length>1&&<button onClick={()=>{setProjectMenuOpen(o=>!o);setProjectSearch("");}} style={{background:"none",border:"none",cursor:"pointer",color:"#CCC",fontSize:10,padding:"2px 4px",flexShrink:0}}>▾</button>}
                {projectMenuOpen&&(
                  <div style={{position:"absolute",top:"100%",left:0,background:"#FFF",border:"1px solid #E0E0E0",borderRadius:6,boxShadow:"0 4px 16px rgba(0,0,0,0.1)",zIndex:600,minWidth:240,maxHeight:340,display:"flex",flexDirection:"column"}}>
                    <input autoFocus value={projectSearch} onChange={e=>setProjectSearch(e.target.value)} placeholder="Search projects..." style={{padding:"8px 12px",border:"none",borderBottom:"1px solid #EBEBEB",fontSize:12,outline:"none",fontFamily:"inherit",flexShrink:0}}/>
                    <div style={{overflowY:"auto",maxHeight:280}}>
                      {projects.filter(p=>(p.title||"Untitled").toLowerCase().includes(projectSearch.toLowerCase())).sort((a,b)=>(b.updated||b.created||0)-(a.updated||a.created||0)).map(p=>(<button key={p.id} onClick={()=>{setActiveId(p.id);setProjectMenuOpen(false);setProjectSearch("");}} style={{display:"block",width:"100%",padding:"9px 14px",background:p.id===active.id?"#FAFAFA":"none",border:"none",borderBottom:"1px solid #F5F5F5",cursor:"pointer",textAlign:"left",fontFamily:"inherit",fontSize:12,fontWeight:p.id===active.id?700:400,color:p.id===active.id?"#000":"#555"}}>{p.title||"Untitled"}<span style={{float:"right",fontSize:10,color:"#CCC",fontWeight:400}}>{FORMATS.find(f=>f.id===p.format)?.label}</span></button>))}
                      {projects.filter(p=>(p.title||"Untitled").toLowerCase().includes(projectSearch.toLowerCase())).length===0&&<p style={{padding:"14px",margin:0,fontSize:11,color:"#CCC",textAlign:"center"}}>No matches</p>}
                    </div>
                    <button onClick={()=>{newProject();setProjectMenuOpen(false);setProjectSearch("");}} style={{display:"block",width:"100%",padding:"9px 14px",background:"none",border:"none",borderTop:"1px solid #EBEBEB",cursor:"pointer",textAlign:"left",fontFamily:"inherit",fontSize:12,color:"#888",flexShrink:0}}>+ New project</button>
                  </div>
                )}
              </div>
              <div style={{width:1,height:20,background:"#EBEBEB",flexShrink:0}}/>
              {AI_FEATURES_ENABLED&&(<button onClick={()=>setAiOpen(o=>!o)} style={{padding:"6px 14px",borderRadius:4,flexShrink:0,border:`1px solid ${aiOpen?"#000":"#D0D0D0"}`,background:aiOpen?"#000":"#FAFAFA",color:aiOpen?"#FFF":"#444",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",gap:6}}>✦ AI<span style={{fontSize:10,color:aiOpen?"#888":"#BBB",fontWeight:500}}>⌘K</span></button>)}
              <button onClick={()=>setImportOpen(true)} style={{padding:"6px 12px",borderRadius:4,border:"1px solid #D0D0D0",flexShrink:0,background:"#FAFAFA",color:"#555",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>↑ Import</button>
              <button onClick={()=>setExportOpen(true)} style={{padding:"6px 12px",borderRadius:4,border:"1px solid #D0D0D0",flexShrink:0,background:"#FAFAFA",color:"#555",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>↓ Export</button>
              <button onClick={addFreePage} title="Insert a free-form page for an image, notes, or a cover — attaches to the front or back of the script" style={{padding:"6px 12px",borderRadius:4,border:"1px solid #D0D0D0",flexShrink:0,background:"#FAFAFA",color:"#555",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>+ Page</button>
              <button onClick={()=>setSceneNavCollapsed(o=>!o)} style={{padding:"6px 10px",borderRadius:4,flexShrink:0,border:`1px solid ${!sceneNavCollapsed?"#000":"#D0D0D0"}`,background:!sceneNavCollapsed?"#000":"#FAFAFA",color:!sceneNavCollapsed?"#FFF":"#555",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>≡ Scenes</button>
              <button onClick={()=>setOverviewOpen(o=>!o)} title="A simple per-page list to jump around — not a visual thumbnail grid" style={{padding:"6px 10px",borderRadius:4,flexShrink:0,border:`1px solid ${overviewOpen?"#000":"#D0D0D0"}`,background:overviewOpen?"#000":"#FAFAFA",color:overviewOpen?"#FFF":"#555",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>▤ Overview</button>
              <button onClick={()=>setGalleryOpen(o=>!o)} title="Upload images and link them to a page range — your storyboard/shot list" style={{padding:"6px 10px",borderRadius:4,flexShrink:0,border:`1px solid ${galleryOpen?"#000":"#D0D0D0"}`,background:galleryOpen?"#000":"#FAFAFA",color:galleryOpen?"#FFF":"#555",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>⬚ Storyboard</button>
              <button onClick={()=>setCharPanelOpen(o=>!o)} title="Quick-reference card for whichever character you're currently writing" style={{padding:"6px 10px",borderRadius:4,flexShrink:0,border:`1px solid ${charPanelOpen?"#000":"#D0D0D0"}`,background:charPanelOpen?"#000":"#FAFAFA",color:charPanelOpen?"#FFF":"#555",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>◉ Character Info</button>
              <button onClick={()=>setNotesOpen(o=>!o)} style={{padding:"6px 10px",borderRadius:4,flexShrink:0,border:`1px solid ${notesOpen?"#000":"#D0D0D0"}`,background:notesOpen?"#000":"#FAFAFA",color:notesOpen?"#FFF":"#555",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>≡ Notes</button>
            </>
          )}
          {nav!=="write"&&<p style={{margin:0,fontSize:14,fontWeight:800,color:"#000",letterSpacing:"0.04em",textTransform:"uppercase"}}>{NAV_ITEMS.find(n=>n.id===nav)?.label}</p>}
        </div>

        <div style={{flex:1,overflow:"hidden",display:"flex",minWidth:0}}>
          {/* Beat Board / Mood Board: now docked on the LEFT of the script.
              Defaults to a fixed width so the script stays visible
              alongside it; ⛶ expands to full page (hiding the script,
              without unmounting it — SmartEditor is only display:none'd
              below, so nothing typed is lost). +/- controls a shared zoom
              level (CSS zoom, so layout reflows rather than clipping). */}
          {nav==="write"&&(beatsOpen||moodOpen)&&(
            active?(
              <div style={((beatsOpen&&beatsExpanded)||(moodOpen&&moodExpanded))
                ?{flex:1,display:"flex",flexDirection:"column",minWidth:0}
                :beatsOpen
                  ?{width:400,minWidth:360,borderRight:"1px solid #EBEBEB",display:"flex",flexDirection:"column",flexShrink:0,background:"#FFF"}
                  :{width:320,minWidth:300,borderRight:"1px solid #EBEBEB",display:"flex",flexDirection:"column",flexShrink:0,background:"#FFF"}}>
                <div style={{padding:"8px 14px",borderBottom:"1px solid #EBEBEB",display:"flex",justifyContent:"space-between",alignItems:"center",flexShrink:0,gap:8}}>
                  <span style={{fontSize:10,fontWeight:800,color:"#AAA",letterSpacing:"0.1em",textTransform:"uppercase"}}>{beatsOpen?"Beat Board":"Mood Board"}</span>
                  <div style={{display:"flex",gap:10,alignItems:"center",flexShrink:0}}>
                    <button onClick={()=>setBoardZoom(z=>Math.max(0.6,+(z-0.1).toFixed(2)))} title="Zoom out" style={{background:"none",border:"1px solid #E0E0E0",borderRadius:3,width:18,height:18,cursor:"pointer",color:"#999",fontSize:11,lineHeight:1,padding:0}}>−</button>
                    <span style={{fontSize:9,color:"#BBB",minWidth:28,textAlign:"center"}}>{Math.round(boardZoom*100)}%</span>
                    <button onClick={()=>setBoardZoom(z=>Math.min(1.8,+(z+0.1).toFixed(2)))} title="Zoom in" style={{background:"none",border:"1px solid #E0E0E0",borderRadius:3,width:18,height:18,cursor:"pointer",color:"#999",fontSize:11,lineHeight:1,padding:0}}>+</button>
                    <div style={{width:1,height:14,background:"#EBEBEB"}}/>
                    <button onClick={()=>{if(beatsOpen)setBeatsExpanded(o=>!o);else setMoodExpanded(o=>!o);}}
                      title={(beatsOpen?beatsExpanded:moodExpanded)?"Show alongside script":"Expand to full page"}
                      style={{background:"none",border:"none",cursor:"pointer",color:"#BBB",fontSize:13}}>{(beatsOpen?beatsExpanded:moodExpanded)?"⤢":"⛶"}</button>
                    <button onClick={()=>{setBeatsOpen(false);setMoodOpen(false);setBeatsExpanded(false);setMoodExpanded(false);}} style={{background:"none",border:"none",cursor:"pointer",color:"#CCC",fontSize:16}}>×</button>
                  </div>
                </div>
                <div style={{flex:1,overflow:"auto",zoom:boardZoom}}>
                  {beatsOpen?<BeatBoard project={active} onUpdate={updateBeats}/>:<MoodBoard project={active} onUpdateCards={updateMoodCards}/>}
                </div>
              </div>
            ):(
              <div style={{width:beatsOpen?400:320,minWidth:beatsOpen?360:300,borderRight:"1px solid #EBEBEB",display:"flex",alignItems:"center",justifyContent:"center"}}><p style={{color:"#CCC",fontSize:13}}>Open a project first.</p></div>
            )
          )}

          {nav==="write"&&(
            active?(
              <div style={{display:((beatsOpen&&beatsExpanded)||(moodOpen&&moodExpanded))?"none":"flex",flex:1,minWidth:0}}>
                <SmartEditor project={active} cast={cast} onUpdateContent={updateLines} onAddCharacter={addCharacter} format={active.format} onPageChange={(cur,total)=>setPageInfo({cur,total})} focusMode={focusMode} scrollRef={sceneNavRef} darkCanvas={darkCanvas} onCharFocus={setCurrentCharName} key={active?.id} profile={profile} onEditTitlePage={()=>setTitlePageEditorOpen(true)} onForceSave={forceSaveNow} flushRef={flushRef} undoRedoRef={undoRedoRef} freePages={active.freePages} onUpdateFreePages={updateFreePages}/>
              </div>
            ):(
              <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16}}>
                <p style={{fontSize:16,color:"#AAA"}}>No project open</p>
                <button onClick={newProject} style={{padding:"10px 24px",background:"#000",color:"#FFF",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>New Project</button>
              </div>
            )
          )}

          {(charPanelOpen||galleryOpen||notesOpen||overviewOpen||!sceneNavCollapsed)&&nav==="write"&&(
            <div style={{position:"fixed",top:48,right:0,bottom:32,display:"flex",zIndex:300,boxShadow:"-4px 0 20px rgba(0,0,0,0.08)"}}>
              {!sceneNavCollapsed&&<SceneNavigator lines={active?.lines||[]} onJumpTo={jumpToLine} collapsed={sceneNavCollapsed} onToggle={()=>setSceneNavCollapsed(o=>!o)} statuses={active?.sceneStatuses} onUpdateStatuses={updateSceneStatuses}/>}
              {overviewOpen&&<PageOverview lines={active?.lines||[]} onJumpTo={jumpToLine} onClose={()=>setOverviewOpen(false)}/>}
              {charPanelOpen&&<CharacterContextPanel cast={cast} currentCharName={currentCharName} onClose={()=>setCharPanelOpen(false)}/>}
              {galleryOpen&&active&&<SceneGallery project={active} onUpdate={updateSceneGallery} currentPage={pageInfo.cur}/>}
              {notesOpen&&active&&<NotesPanel notes={active?.notes||""} onChange={updateNotes} onClose={()=>setNotesOpen(false)}/>}
            </div>
          )}

          {nav==="profile"&&(
            <div style={{flex:1,overflowY:"auto",padding:"48px 64px"}}>
              <div style={{maxWidth:480}}>
                <h2 style={{fontSize:28,fontWeight:900,color:"#000",margin:"0 0 32px",letterSpacing:"-0.02em"}}>Profile</h2>
                <div style={{display:"flex",flexDirection:"column",gap:16}}>
                  {active&&(
                    <div>
                      <label style={css.label}>Format — "{active.title||"Untitled"}"</label>
                      <select value={active.format} onChange={e=>updateProject(active.id,{format:e.target.value})} style={{...css.input,fontSize:13}}>
                        {FORMATS.map(f=><option key={f.id} value={f.id}>{f.label}</option>)}
                      </select>
                    </div>
                  )}
                  <div>
                    <label style={css.label}>Name</label>
                    <input value={profile.name||""} onChange={e=>{onUpdateProfile&&onUpdateProfile({name:e.target.value});}}
                      style={css.input} placeholder="Your name"/>
                  </div>
                  <div>
                    <label style={css.label}>Default Format</label>
                    <select value={profile.format||"film"} onChange={e=>{onUpdateProfile&&onUpdateProfile({format:e.target.value});}} style={{...css.input,fontSize:13}}>
                      {FORMATS.map(f=><option key={f.id} value={f.id}>{f.label}</option>)}
                    </select>
                  </div>
                  <div>
                    <label style={css.label}>Default Genre</label>
                    <select value={profile.genre||"Drama"} onChange={e=>{onUpdateProfile&&onUpdateProfile({genre:e.target.value});}} style={{...css.input,fontSize:13}}>
                      {GENRES.map(g=><option key={g}>{g}</option>)}
                    </select>
                  </div>
                  <div>
                    <label style={css.label}>Writing Styles</label>
                    <div style={{display:"flex",flexWrap:"wrap",gap:6,marginTop:4}}>
                      {["Cinematic","Literary","Fast-paced","Dialogue-driven","Atmospheric","Minimalist","Dark & Gritty","Lyrical","Epic","Intimate","Experimental"].map(s=>{
                        const active=(profile.styles||[]).includes(s);
                        return <button key={s} onClick={()=>{const styles=active?(profile.styles||[]).filter(x=>x!==s):[...(profile.styles||[]),s];onUpdateProfile&&onUpdateProfile({styles});}}
                          style={{padding:"6px 12px",borderRadius:4,cursor:"pointer",border:`1px solid ${active?"#000":"#E8E8E8"}`,background:active?"#000":"#FAFAFA",color:active?"#FFF":"#666",fontFamily:"inherit",fontSize:12,fontWeight:active?700:400}}>{s}</button>;
                      })}
                    </div>
                  </div>
                </div>
                <div style={{marginTop:40,paddingTop:32,borderTop:"1px solid #EBEBEB"}}>
                  <p style={{margin:"0 0 6px",fontSize:13,fontWeight:700,color:"#000"}}>Anthropic API Key</p>
                  <p style={{margin:"0 0 14px",fontSize:12,color:"#AAA",lineHeight:1.6}}>Paste your key from console.anthropic.com to enable AI features.</p>
                  <ApiKeyField/>
                </div>
              </div>
            </div>
          )}
        </div>

        {importOpen&&<ImportModal profile={profile} onImport={importScript} onClose={()=>setImportOpen(false)}/>}
        {exportOpen&&active&&<ExportModal project={active} cast={cast} onClose={()=>setExportOpen(false)}/>}
        {AI_FEATURES_ENABLED&&aiOpen&&active&&<AIPanel project={active} cast={cast} onClose={()=>setAiOpen(false)} onGoToProfile={()=>{setNav("profile");setAiOpen(false);}}/>}
        {titlePageEditorOpen&&active&&(
          <TitlePageEditor project={active} profile={profile}
            onSave={(form)=>{
              updateProject(active.id,{title:form.title,draft:form.draft,writtenBy:form.writtenBy});
              const profileChanges={company:form.company,address:form.address,phone:form.phone,email:form.email};
              if(onUpdateProfile) onUpdateProfile(profileChanges);
              else LS.set("sf_profile",{...profile,...profileChanges});
              setTitlePageEditorOpen(false);
            }}
            onClose={()=>setTitlePageEditorOpen(false)}/>
        )}

        <div style={{position:"fixed",bottom:0,left:52,right:0,padding:"0 20px",background:"#FAFAFA",borderTop:"1px solid #EBEBEB",display:"flex",alignItems:"center",height:32,zIndex:400,gap:0}}>
          {nav==="write"&&active?(
            <>
              <span style={{fontSize:10,color:"#AAA"}}>p.{pageInfo.cur} of {pageInfo.total}</span>
              <span style={{margin:"0 10px",color:"#DDD"}}>|</span>
              <span style={{fontSize:10,color:"#AAA"}}>{wordCount.toLocaleString()} words</span>
              <span style={{margin:"0 10px",color:"#DDD"}}>|</span>
              <span style={{fontSize:10,color:"#AAA"}}>{lastSaved?`Saved ${fmtLastSaved()}`:"Auto-saves as you type"}</span>
              <span style={{margin:"0 10px",color:"#DDD"}}>|</span>
              <button onClick={manualSave} title="Ctrl/Cmd+S" style={{background:"none",border:"1px solid #E0E0E0",borderRadius:3,padding:"2px 8px",fontSize:10,cursor:"pointer",color:"#888",fontFamily:"inherit"}}>Save</button>
              <span style={{margin:"0 10px",color:"#DDD"}}>|</span>
              <button onClick={()=>undoRedoRef.current?.undo()} title="Undo (Ctrl/Cmd+Z)" style={{background:"none",border:"1px solid #E0E0E0",borderRadius:3,padding:"2px 8px",fontSize:10,cursor:"pointer",color:"#888",fontFamily:"inherit"}}>↶ Undo</button>
              <button onClick={()=>undoRedoRef.current?.redo()} title="Redo (Ctrl/Cmd+Shift+Z)" style={{background:"none",border:"1px solid #E0E0E0",borderRadius:3,padding:"2px 8px",fontSize:10,cursor:"pointer",color:"#888",fontFamily:"inherit",marginLeft:6}}>↷ Redo</button>
            </>
          ):(
            <span style={{fontSize:10,color:"#CCC",fontStyle:"italic"}}>Tab · Enter · Esc · ⌘K</span>
          )}
          <div style={{marginLeft:"auto",display:"flex",gap:10,alignItems:"center"}}>
            <button onClick={()=>setShowFormatGuide(o=>!o)} style={{background:"none",border:"1px solid #E0E0E0",borderRadius:3,padding:"2px 8px",fontSize:10,cursor:"pointer",color:"#888",fontFamily:"inherit"}}>?</button>
            <button onClick={()=>setShortcutsOpen(o=>!o)} style={{background:"none",border:"1px solid #E0E0E0",borderRadius:3,padding:"2px 8px",fontSize:10,cursor:"pointer",color:"#888",fontFamily:"inherit"}}>⌘/</button>
            <button onClick={()=>setFocusMode(o=>!o)} style={{background:"none",border:"1px solid #E0E0E0",borderRadius:3,padding:"2px 8px",fontSize:10,cursor:"pointer",color:"#888",fontFamily:"inherit"}}>⌘F</button>
            <button onClick={()=>setDarkCanvas(o=>!o)} style={{background:darkCanvas?"#333":"none",border:"1px solid #E0E0E0",borderRadius:3,padding:"2px 8px",fontSize:10,cursor:"pointer",color:darkCanvas?"#FFF":"#888",fontFamily:"inherit"}}>◐</button>
          </div>
        </div>

        {shortcutsOpen&&<ShortcutsOverlay onClose={()=>setShortcutsOpen(false)}/>}
        {showFormatGuide&&active&&<FormatGuide format={active.format} onClose={()=>setShowFormatGuide(false)}/>}

        <div style={{position:"fixed",bottom:44,right:20,zIndex:900,display:"flex",alignItems:"center",gap:6,
          padding:"7px 14px",background:"#000",color:"#FFF",borderRadius:20,fontSize:11,fontWeight:700,
          boxShadow:"0 4px 16px rgba(0,0,0,0.18)",pointerEvents:"none",
          opacity:saveToast?1:0,transform:saveToast?"translateY(0)":"translateY(6px)",
          transition:"opacity 0.35s ease,transform 0.35s ease"}}>
          <span>✓</span><span>Saved</span>
        </div>
      </div>
    </div>
  );
}

// ─── ROOT ─────────────────────────────────────────────────────────────────────
function Root(){
  // Session policy (per explicit instruction): signed out after 30 minutes
  // of no mouse/keyboard activity, AND signed out immediately if the page
  // is closed, refreshed, or navigated away from — logging back in is
  // required each time you return. See the beforeunload handler below for
  // the close/leave case; this timeout handles the "stayed open, went
  // quiet" case.
  const SESSION_TIMEOUT=30*60*1000; // 30 minutes
  const loadUser=()=>{
    const saved=LS.get("sf_current_user",null);if(!saved) return null;
    const lastActive=LS.get("sf_last_active",0);
    if(Date.now()-lastActive>SESSION_TIMEOUT){LS.set("sf_current_user",null);LS.set("sf_last_active",null);return null;}
    return saved;
  };
  const [screen,setScreen]=useState("landing");
  const [profile,setProfile]=useState(()=>LS.get("sf_profile",null));
  const [user,setUser]=useState(()=>loadUser());
  const [activeProject,setActiveProject]=useState(null);
  const [dashSave,setDashSave]=useState(null);
  const [dashProjects,setDashProjects]=useState([]);
  const [authMode,setAuthMode]=useState("signin");

  useEffect(()=>{
    const touch=()=>LS.set("sf_last_active",Date.now());touch();
    window.addEventListener("mousemove",touch);window.addEventListener("keydown",touch);
    const timer=setInterval(()=>{const lastActive=LS.get("sf_last_active",0);if(user&&Date.now()-lastActive>SESSION_TIMEOUT)signOut();},60000);
    return()=>{window.removeEventListener("mousemove",touch);window.removeEventListener("keydown",touch);clearInterval(timer);};
  },[user]);

  useEffect(()=>{
    const h=()=>{if(document.visibilityState==="visible"){const la=LS.get("sf_last_active",0);if(user&&Date.now()-la>SESSION_TIMEOUT)signOut();}};
    document.addEventListener("visibilitychange",h);return()=>document.removeEventListener("visibilitychange",h);
  },[user]);

  // Log out on close/leave. Written straight to localStorage rather than
  // through setUser/signOut — the page is on its way out, and a scheduled
  // React state update isn't guaranteed to run before it actually unloads,
  // but a plain synchronous localStorage write is.
  useEffect(()=>{
    const onLeave=()=>{if(user){LS.set("sf_current_user",null);LS.set("sf_last_active",null);}};
    window.addEventListener("beforeunload",onLeave);
    return()=>window.removeEventListener("beforeunload",onLeave);
  },[user]);

  const enter=()=>{if(!user){setAuthMode("signup");setScreen("auth");return;}setScreen("dashboard");};
  const enterSignIn=()=>{if(!user){setAuthMode("signin");setScreen("auth");return;}setScreen("dashboard");};
  const save=(p)=>{setProfile(p);LS.set("sf_profile",p);setScreen("dashboard");};
  const updateProfile=(changes)=>{const p={...profile,...changes};setProfile(p);LS.set("sf_profile",p);};
  const handleAuth=(u)=>{setUser(u);LS.set("sf_current_user",u);LS.set("sf_last_active",Date.now());if(!profile){setScreen("setup");return;}setScreen("dashboard");};
  const signOut=()=>{LS.set("sf_current_user",null);LS.set("sf_last_active",null);setUser(null);setActiveProject(null);setScreen("landing");};
  const openProject=(p,saveFn,allProjects)=>{setActiveProject(p);setDashSave(()=>saveFn);setDashProjects(allProjects);setScreen("app");};
  const newProject=(saveFn,allProjects)=>{
    if(!profile||!user) return;
    const p={id:Date.now(),title:"Untitled",format:profile.format,genre:profile.genre,lines:[],cast:[],notes:"",moodCards:[],beats:[],sceneGallery:[],created:Date.now()};
    const updated=[p,...allProjects];
    // Write directly to LS with user-scoped key — avoids stale closure from dashSave
    const projectsKey=`sf_projects_${user.email}`;
    LS.set(projectsKey,updated);
    saveFn(updated);
    setActiveProject(p);setDashSave(()=>saveFn);setDashProjects(updated);setScreen("app");
  };

  if(screen==="landing") return <Landing onStart={enter} onSignIn={enterSignIn} hasProfile={!!profile} user={user}/>;
  if(screen==="auth") return <AuthScreen onAuth={handleAuth} initialMode={authMode}/>;
  if(screen==="setup") return <Setup existing={profile} onSave={save}/>;
  if(screen==="dashboard"&&user) return <Dashboard user={user} onOpen={openProject} onNew={newProject} onSignOut={signOut}/>;
  return <App
    profile={profile||{name:user?.name||"",format:"film",genre:"Dark Fantasy",genres:[],styles:[]}}
    onEditProfile={()=>setScreen("setup")}
    onUpdateProfile={updateProfile}
    onHome={()=>setScreen("dashboard")}
    initialProject={activeProject}
    initialProjects={dashProjects}
    user={user}
    onSignOut={signOut}
    onSaveProject={(updated)=>{
      if(!user) return;
      const projectsKey=`sf_projects_${user.email}`;
      const allProjects=LS.get(projectsKey,[]);
      // Bug fix: this used to bail out entirely if the project's id wasn't
      // already in the saved list — which silently dropped brand-new
      // projects created from inside the writing view (they aren't in the
      // saved list *yet*, that's not the same as having been deleted).
      // Upsert instead: update in place if it exists, otherwise add it.
      const exists=allProjects.some(p=>p.id===updated.id);
      const newAll=exists?allProjects.map(p=>p.id===updated.id?updated:p):[updated,...allProjects];
      LS.set(projectsKey,newAll);setDashProjects(newAll);
    }}
    onBackToDash={()=>setScreen("dashboard")}
  />;
}

    const container=document.getElementById('root');
    const reactRoot=ReactDOM.createRoot(container);
    reactRoot.render(<Root/>);
  </script>
</body>
</html>

            <p style={{margin:0,fontSize:10,fontWeight:900,color:"#000",letterSpacing:"0.1em",writingMode:"vertical-lr",textOrientation:"mixed",transform:"rotate(180deg)"}}>SF</p>
          </button>
          {hoveredNav==="home"&&<div style={{position:"absolute",left:44,top:"50%",transform:"translateY(-50%)",background:"#000",color:"#FFF",padding:"4px 10px",borderRadius:4,fontSize:11,fontWeight:700,whiteSpace:"nowrap",pointerEvents:"none",zIndex:700}}>Home</div>}
        </div>
        {NAV_ITEMS.map(item=>{
          const isActive=item.id==="cast"?castOpen:nav===item.id&&item.id!=="cast";
          return(
            <div key={item.id} style={{position:"relative",width:"100%",display:"flex",justifyContent:"center",marginBottom:4}}
              onMouseEnter={()=>setHoveredNav(item.id)} onMouseLeave={()=>setHoveredNav(null)}>
              <button onClick={()=>{
                if(item.id==="cast"){setCastOpen(o=>!o);}
                else if(nav===item.id){setNav("write");setCastOpen(false);}
                else{setNav(item.id);setCastOpen(false);}
              }} style={{width:36,height:36,borderRadius:8,border:"none",background:isActive?"#000":"transparent",color:isActive?"#FFF":"#999",cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.12s"}}>{item.icon}</button>
              {hoveredNav===item.id&&<div style={{position:"absolute",left:44,top:"50%",transform:"translateY(-50%)",background:"#000",color:"#FFF",padding:"4px 10px",borderRadius:4,fontSize:11,fontWeight:700,whiteSpace:"nowrap",pointerEvents:"none",zIndex:700}}>{item.label}</div>}
            </div>
          );
        })}
        <div style={{marginTop:"auto",marginBottom:16,width:"100%",display:"flex",justifyContent:"center"}}>
          <button onClick={newProject} style={{width:36,height:36,borderRadius:8,border:"1px dashed #CCC",background:"none",color:"#CCC",cursor:"pointer",fontSize:18,display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
        </div>
      </div>

      {nav==="write"&&<SceneNavigator lines={active?.lines||[]} onJumpTo={jumpToLine} collapsed={sceneNavCollapsed} onToggle={()=>setSceneNavCollapsed(o=>!o)}/>}

      {castOpen&&(
        <CastPanel cast={cast} onUpdate={updateCharacter}
          onAdd={(onAdded)=>{const c={id:Date.now(),name:"NEW CHARACTER",role:"Supporting",voice:"",notes:""};addCharacter(c);if(onAdded)onAdded(cast.length);}}
          onDelete={(charId)=>{if(!active)return;updateProject(active.id,{cast:active.cast.filter(c=>c.id!==charId)});}}
          onClose={()=>setCastOpen(false)}/>
      )}

      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <div style={{height:48,borderBottom:"1px solid #EBEBEB",display:"flex",alignItems:"center",padding:"0 20px",gap:16,flexShrink:0}}>
          {nav==="write"&&active&&(
            <>
              <div style={{flex:1,minWidth:0,position:"relative",display:"flex",alignItems:"center",gap:6}}>
                <input value={active.title} onChange={e=>updateProject(active.id,{title:e.target.value})}
                  style={{background:"none",border:"none",color:"#000",fontSize:14,fontWeight:700,outline:"none",fontFamily:"inherit",flex:1,minWidth:0}}/>
                {projects.length>1&&<button onClick={()=>setProjectMenuOpen(o=>!o)} style={{background:"none",border:"none",cursor:"pointer",color:"#CCC",fontSize:10,padding:"2px 4px",flexShrink:0}}>▾</button>}
                {projectMenuOpen&&(
                  <div style={{position:"absolute",top:"100%",left:0,background:"#FFF",border:"1px solid #E0E0E0",borderRadius:6,boxShadow:"0 4px 16px rgba(0,0,0,0.1)",zIndex:600,minWidth:220,maxHeight:280,overflowY:"auto"}}>
                    {projects.map(p=>(<button key={p.id} onClick={()=>{setActiveId(p.id);setProjectMenuOpen(false);}} style={{display:"block",width:"100%",padding:"9px 14px",background:p.id===active.id?"#FAFAFA":"none",border:"none",borderBottom:"1px solid #F5F5F5",cursor:"pointer",textAlign:"left",fontFamily:"inherit",fontSize:12,fontWeight:p.id===active.id?700:400,color:p.id===active.id?"#000":"#555"}}>{p.title||"Untitled"}<span style={{float:"right",fontSize:10,color:"#CCC",fontWeight:400}}>{FORMATS.find(f=>f.id===p.format)?.label}</span></button>))}
                    <button onClick={()=>{newProject();setProjectMenuOpen(false);}} style={{display:"block",width:"100%",padding:"9px 14px",background:"none",border:"none",borderTop:"1px solid #EBEBEB",cursor:"pointer",textAlign:"left",fontFamily:"inherit",fontSize:12,color:"#888"}}>+ New project</button>
                  </div>
                )}
              </div>
              <div style={{width:1,height:20,background:"#EBEBEB",flexShrink:0}}/>
              <select value={active.format} onChange={e=>updateProject(active.id,{format:e.target.value})} style={{background:"none",border:"none",color:"#888",fontSize:12,outline:"none",fontFamily:"inherit",cursor:"pointer",flexShrink:0}}>
                {FORMATS.map(f=><option key={f.id} value={f.id}>{f.label}</option>)}
              </select>
              <div style={{width:1,height:20,background:"#EBEBEB",flexShrink:0}}/>
              {AI_FEATURES_ENABLED&&(<button onClick={()=>setAiOpen(o=>!o)} style={{padding:"6px 14px",borderRadius:4,flexShrink:0,border:`1px solid ${aiOpen?"#000":"#D0D0D0"}`,background:aiOpen?"#000":"#FAFAFA",color:aiOpen?"#FFF":"#444",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",gap:6}}>✦ AI<span style={{fontSize:10,color:aiOpen?"#888":"#BBB",fontWeight:500}}>⌘K</span></button>)}
              <button onClick={()=>setImportOpen(true)} style={{padding:"6px 12px",borderRadius:4,border:"1px solid #D0D0D0",flexShrink:0,background:"#FAFAFA",color:"#555",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>↑ Import</button>
              <button onClick={()=>setSceneNavCollapsed(o=>!o)} style={{padding:"6px 10px",borderRadius:4,flexShrink:0,border:`1px solid ${!sceneNavCollapsed?"#000":"#D0D0D0"}`,background:!sceneNavCollapsed?"#000":"#FAFAFA",color:!sceneNavCollapsed?"#FFF":"#555",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>≡ Scenes</button>
              <button onClick={()=>setGalleryOpen(o=>!o)} style={{padding:"6px 10px",borderRadius:4,flexShrink:0,border:`1px solid ${galleryOpen?"#000":"#D0D0D0"}`,background:galleryOpen?"#000":"#FAFAFA",color:galleryOpen?"#FFF":"#555",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>⬚ Gallery</button>
              <button onClick={()=>setCharPanelOpen(o=>!o)} style={{padding:"6px 10px",borderRadius:4,flexShrink:0,border:`1px solid ${charPanelOpen?"#000":"#D0D0D0"}`,background:charPanelOpen?"#000":"#FAFAFA",color:charPanelOpen?"#FFF":"#555",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>◉ Cast</button>
            </>
          )}
          {nav!=="write"&&<p style={{margin:0,fontSize:14,fontWeight:800,color:"#000",letterSpacing:"0.04em",textTransform:"uppercase"}}>{NAV_ITEMS.find(n=>n.id===nav)?.label}</p>}
        </div>

        <div style={{flex:1,overflow:"hidden",display:"flex",minWidth:0}}>
          {nav==="write"&&(
            active?(
              <SmartEditor project={active} cast={cast} onUpdateContent={updateLines} onAddCharacter={addCharacter} format={active.format} onPageChange={(cur,total)=>setPageInfo({cur,total})} focusMode={focusMode} scrollRef={sceneNavRef} darkCanvas={darkCanvas} onCharFocus={setCurrentCharName} key={active?.id} profile={profile} onEditTitlePage={()=>setTitlePageEditorOpen(true)}/>
            ):(
              <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16}}>
                <p style={{fontSize:16,color:"#AAA"}}>No project open</p>
                <button onClick={newProject} style={{padding:"10px 24px",background:"#000",color:"#FFF",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>New Project</button>
              </div>
            )
          )}

          {(charPanelOpen||galleryOpen)&&nav==="write"&&(
            <div style={{position:"fixed",top:48,right:0,bottom:32,display:"flex",zIndex:300,boxShadow:"-4px 0 20px rgba(0,0,0,0.08)"}}>
              {charPanelOpen&&<CharacterContextPanel cast={cast} currentCharName={currentCharName} onClose={()=>setCharPanelOpen(false)}/>}
              {galleryOpen&&active&&<SceneGallery project={active} onUpdate={updateSceneGallery} currentPage={pageInfo.cur}/>}
            </div>
          )}

          {nav==="notes"&&<NotesPanel notes={active?.notes||""} onChange={updateNotes}/>}
          {nav==="beats"&&(active?<BeatBoard project={active} onUpdate={updateBeats}/>:<div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center"}}><p style={{color:"#CCC",fontSize:13}}>Open a project first.</p></div>)}
          {nav==="mood"&&(active?<MoodBoard project={active} onUpdateCards={updateMoodCards}/>:<div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center"}}><p style={{color:"#CCC",fontSize:13}}>Open a project first.</p></div>)}

          {nav==="profile"&&(
            <div style={{flex:1,overflowY:"auto",padding:"48px 64px"}}>
              <div style={{maxWidth:480}}>
                <h2 style={{fontSize:28,fontWeight:900,color:"#000",margin:"0 0 32px",letterSpacing:"-0.02em"}}>{profile.name}</h2>
                <div style={{borderTop:"1px solid #EBEBEB"}}>
                  {[["Default Format",FORMATS.find(f=>f.id===profile.format)?.label],["Default Genre",profile.genre],["Genres",profile.genres?.join(", ")||"—"],["Writing Styles",profile.styles?.join(", ")||"—"]].map(([k,v])=>(
                    <div key={k} style={{display:"flex",justifyContent:"space-between",padding:"14px 0",borderBottom:"1px solid #EBEBEB"}}>
                      <span style={{fontSize:13,color:"#AAA",fontWeight:600}}>{k}</span>
                      <span style={{fontSize:13,color:"#000",maxWidth:280,textAlign:"right"}}>{v}</span>
                    </div>
                  ))}
                </div>
                <button onClick={onEditProfile} style={{marginTop:24,padding:"10px 24px",background:"#000",color:"#FFF",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>Edit Profile</button>
                <div style={{marginTop:40,paddingTop:32,borderTop:"1px solid #EBEBEB"}}>
                  <p style={{margin:"0 0 6px",fontSize:13,fontWeight:700,color:"#000"}}>Anthropic API Key</p>
                  <p style={{margin:"0 0 14px",fontSize:12,color:"#AAA",lineHeight:1.6}}>Paste your key from console.anthropic.com to enable AI features.</p>
                  <ApiKeyField/>
                </div>
              </div>
            </div>
          )}
        </div>

        {importOpen&&<ImportModal profile={profile} onImport={importScript} onClose={()=>setImportOpen(false)}/>}
        {AI_FEATURES_ENABLED&&aiOpen&&active&&<AIPanel project={active} cast={cast} onClose={()=>setAiOpen(false)} onGoToProfile={()=>{setNav("profile");setAiOpen(false);}}/>}
        {titlePageEditorOpen&&active&&(
          <TitlePageEditor project={active} profile={profile}
            onSave={(form)=>{
              updateProject(active.id,{title:form.title,draft:form.draft});
              const updatedProfile={...profile,company:form.company,address:form.address,phone:form.phone,email:form.email};
              LS.set("sf_profile",updatedProfile);
              setTitlePageEditorOpen(false);
            }}
            onClose={()=>setTitlePageEditorOpen(false)}/>
        )}

        <div style={{position:"fixed",bottom:0,left:52,right:0,padding:"0 20px",background:"#FAFAFA",borderTop:"1px solid #EBEBEB",display:"flex",alignItems:"center",height:32,zIndex:400,gap:0}}>
          {nav==="write"&&active?(
            <>
              <span style={{fontSize:10,color:"#AAA"}}>p.{pageInfo.cur} of {pageInfo.total}</span>
              <span style={{margin:"0 10px",color:"#DDD"}}>|</span>
              <span style={{fontSize:10,color:"#AAA"}}>{wordCount.toLocaleString()} words</span>
              <span style={{margin:"0 10px",color:"#DDD"}}>|</span>
              <span style={{fontSize:10,color:"#AAA"}}>{lastSaved?`Saved ${fmtLastSaved()}`:"Auto-saves as you type"}</span>
            </>
          ):(
            <span style={{fontSize:10,color:"#CCC",fontStyle:"italic"}}>Tab · Enter · Esc · ⌘K</span>
          )}
          <div style={{marginLeft:"auto",display:"flex",gap:10,alignItems:"center"}}>
            <button onClick={()=>setShowFormatGuide(o=>!o)} style={{background:"none",border:"1px solid #E0E0E0",borderRadius:3,padding:"2px 8px",fontSize:10,cursor:"pointer",color:"#888",fontFamily:"inherit"}}>?</button>
            <button onClick={()=>setShortcutsOpen(o=>!o)} style={{background:"none",border:"1px solid #E0E0E0",borderRadius:3,padding:"2px 8px",fontSize:10,cursor:"pointer",color:"#888",fontFamily:"inherit"}}>⌘/</button>
            <button onClick={()=>setFocusMode(o=>!o)} style={{background:"none",border:"1px solid #E0E0E0",borderRadius:3,padding:"2px 8px",fontSize:10,cursor:"pointer",color:"#888",fontFamily:"inherit"}}>⌘F</button>
            <button onClick={()=>setDarkCanvas(o=>!o)} style={{background:darkCanvas?"#333":"none",border:"1px solid #E0E0E0",borderRadius:3,padding:"2px 8px",fontSize:10,cursor:"pointer",color:darkCanvas?"#FFF":"#888",fontFamily:"inherit"}}>◐</button>
          </div>
        </div>

        {shortcutsOpen&&<ShortcutsOverlay onClose={()=>setShortcutsOpen(false)}/>}
        {showFormatGuide&&active&&<FormatGuide format={active.format} onClose={()=>setShowFormatGuide(false)}/>}
      </div>
    </div>
  );
}

// ─── ROOT ─────────────────────────────────────────────────────────────────────
function Root(){
  const SESSION_TIMEOUT=30*60*1000;
  const loadUser=()=>{
    const saved=LS.get("sf_current_user",null);if(!saved) return null;
    const lastActive=LS.get("sf_last_active",0);
    if(Date.now()-lastActive>SESSION_TIMEOUT){LS.set("sf_current_user",null);LS.set("sf_last_active",null);return null;}
    return saved;
  };
  const [screen,setScreen]=useState("landing");
  const [profile,setProfile]=useState(()=>LS.get("sf_profile",null));
  const [user,setUser]=useState(()=>loadUser());
  const [activeProject,setActiveProject]=useState(null);
  const [dashSave,setDashSave]=useState(null);
  const [dashProjects,setDashProjects]=useState([]);
  const [authMode,setAuthMode]=useState("signin");

  useEffect(()=>{
    const touch=()=>LS.set("sf_last_active",Date.now());touch();
    window.addEventListener("mousemove",touch);window.addEventListener("keydown",touch);
    const timer=setInterval(()=>{const lastActive=LS.get("sf_last_active",0);if(user&&Date.now()-lastActive>SESSION_TIMEOUT)signOut();},60000);
    return()=>{window.removeEventListener("mousemove",touch);window.removeEventListener("keydown",touch);clearInterval(timer);};
  },[user]);

  useEffect(()=>{
    const h=()=>{if(document.visibilityState==="visible"){const la=LS.get("sf_last_active",0);if(user&&Date.now()-la>SESSION_TIMEOUT)signOut();}};
    document.addEventListener("visibilitychange",h);return()=>document.removeEventListener("visibilitychange",h);
  },[user]);

  const enter=()=>{if(!user){setAuthMode("signup");setScreen("auth");return;}setScreen("dashboard");};
  const enterSignIn=()=>{if(!user){setAuthMode("signin");setScreen("auth");return;}setScreen("dashboard");};
  const save=(p)=>{setProfile(p);LS.set("sf_profile",p);setScreen("dashboard");};
  const handleAuth=(u)=>{setUser(u);LS.set("sf_current_user",u);LS.set("sf_last_active",Date.now());if(!profile){setScreen("setup");return;}setScreen("dashboard");};
  const signOut=()=>{LS.set("sf_current_user",null);LS.set("sf_last_active",null);setUser(null);setActiveProject(null);setScreen("landing");};
  const openProject=(p,saveFn,allProjects)=>{setActiveProject(p);setDashSave(()=>saveFn);setDashProjects(allProjects);setScreen("app");};
  const newProject=(saveFn,allProjects)=>{
    if(!profile) return;
    const p={id:Date.now(),title:"Untitled",format:profile.format,genre:profile.genre,lines:[],cast:[],notes:"",moodCards:[],beats:[],sceneGallery:[],created:Date.now()};
    const updated=[p,...allProjects];saveFn(updated);setActiveProject(p);setDashSave(()=>saveFn);setDashProjects(updated);setScreen("app");
  };

  if(screen==="landing") return <Landing onStart={enter} onSignIn={enterSignIn} hasProfile={!!profile} user={user}/>;
  if(screen==="auth") return <AuthScreen onAuth={handleAuth} initialMode={authMode}/>;
  if(screen==="setup") return <Setup existing={profile} onSave={save}/>;
  if(screen==="dashboard"&&user) return <Dashboard user={user} onOpen={openProject} onNew={newProject} onSignOut={signOut}/>;
  return <App
    profile={profile||{name:user?.name||"",format:"film",genre:"Dark Fantasy",genres:[],styles:[]}}
    onEditProfile={()=>setScreen("setup")}
    onHome={()=>setScreen("dashboard")}
    initialProject={activeProject}
    onSaveProject={(updated)=>{
      if(!user||!dashSave) return;
      const projectsKey=`sf_projects_${user.email}`;
      const allProjects=LS.get(projectsKey,[]);
      const newAll=allProjects.map(p=>p.id===updated.id?updated:p);
      if(!newAll.find(p=>p.id===updated.id))newAll.unshift(updated);
      LS.set(projectsKey,newAll);setDashProjects(newAll);
    }}
    onBackToDash={()=>setScreen("dashboard")}
  />;
}

    const container=document.getElementById('root');
    const reactRoot=ReactDOM.createRoot(container);
    reactRoot.render(<Root/>);
  </script>
</body>
</html>

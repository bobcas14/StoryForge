const css = {
  input:{background:"#FFFFFF",border:"1px solid #D0D0D0",borderRadius:4,color:"#0A0A0A",
    padding:"9px 12px",width:"100%",outline:"none",fontSize:13,fontFamily:"inherit",boxSizing:"border-box"},

const LS = {
  get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}},
};

async function parseApiResponse(res) {
  const ct = res.headers.get("content-type")||"";
  if(!res.ok||!ct.includes("application/json")){
    if(res.status===504||res.status===408) throw new Error("The request timed out.");
    const text=await res.text().catch(()=>"");
    throw new Error(`Server returned an unexpected response (status ${res.status}). ${text.slice(0,150)||"Try again."}`);
  }
  return res.json();
}

function lineStyle(mode,format){
  const isAudio=format==="audiobook",isNovel=format==="novel";
  switch(mode){
    case"character":return{fontWeight:800,textTransform:"uppercase",textAlign:isAudio||isNovel?"left":"center",letterSpacing:"0.1em",fontSize:13,marginTop:16,color:"#000"};
    case"dialogue":return{color:"#222",fontSize:isAudio||isNovel?14:13,lineHeight:isAudio||isNovel?2.0:1.85,fontStyle:"normal"};
    case"direction":return{fontStyle:"italic",color:"#666",fontSize:12,lineHeight:1.7};
    case"location":return{fontWeight:800,textTransform:"uppercase",letterSpacing:"0.08em",fontSize:12,marginTop:20,color:"#000"};
    case"note":return{fontStyle:"italic",color:"#999",fontSize:12,lineHeight:1.7};
    default:return{color:"#111",fontSize:isAudio||isNovel?14:13,lineHeight:isAudio||isNovel?2.1:1.9};
  }
}

function wrapperStyle(mode,format){
  const isScreen=format==="film"||format==="tv"||format==="stage";
  const isAnime=format==="anime"||format==="manga"||format==="animation";
  const isVO=format==="voiceover",isAudio=format==="audiobook",isNovel=format==="novel";
  switch(mode){
    case"dialogue":
      if(isAudio||isNovel) return{marginLeft:0,marginRight:0};
      if(isScreen) return{marginLeft:"18%",marginRight:"16%"};
      if(isAnime||isVO) return{marginLeft:"12%",marginRight:"8%"};
      return{marginLeft:"10%",marginRight:"8%"};
    case"direction":
      if(isAudio||isNovel) return{marginLeft:0,marginRight:0};
      if(isScreen) return{marginLeft:"22%",marginRight:"20%"};
      return{marginLeft:"14%",marginRight:"12%"};
    case"character":
      if(isAudio||isNovel) return{marginLeft:0};
      return{marginLeft:"30%",marginRight:"30%"};
    case"note": return{marginLeft:16,borderLeft:"2px solid #E8E8E8",paddingLeft:8};
    case"location": return{borderTop:"1px solid #EBEBEB",paddingTop:8,marginTop:4};
    default: return{};
  }
}

      {matches.map(c=>(
        <button key={c.id} onClick={()=>onSelect(c)} style={{display:"flex",alignItems:"center",gap:10,width:"100%",
          padding:"9px 14px",background:"none",border:"none",borderBottom:"1px solid #F0F0F0",
          cursor:"pointer",textAlign:"left",fontFamily:"inherit"}}>
          <div style={{width:28,height:28,borderRadius:"50%",background:"#000",display:"flex",
            alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:800,color:"#FFF",flexShrink:0}}>

  );
}

function ContextMenu({x,y,selectedText,onAddToCase,onClose}){
  useEffect(()=>{
    const h=()=>onClose();
    document.addEventListener("mousedown",h);
    return()=>document.removeEventListener("mousedown",h);
  },[onClose]);
  return(
    <div style={{position:"fixed",left:x,top:y,background:"#FFF",border:"1px solid #D0D0D0",
      borderRadius:6,boxShadow:"0 4px 20px rgba(0,0,0,0.15)",zIndex:2000,minWidth:200,overflow:"hidden"}}>
      <div style={{padding:"8px 14px 6px",borderBottom:"1px solid #F0F0F0"}}>

      </div>

        <div>
          <p style={{margin:0,fontSize:13,fontWeight:600,color:"#000"}}>Add to Cast</p>

}

function InlineNotePopup({x,y,meta,onSave,onClose}){
  const [text,setText]=useState("");
  const inputRef=useRef(null);
  useEffect(()=>{setTimeout(()=>inputRef.current?.focus(),0);},[]);
  return(
    <div style={{position:"fixed",left:Math.min(x,window.innerWidth-320),top:Math.max(y-20,60),
      width:300,background:"#FFF",border:"1px solid #D0D0D0",borderRadius:6,
      boxShadow:"0 4px 20px rgba(0,0,0,0.12)",zIndex:1500,overflow:"hidden"}}>
      <div style={{padding:"8px 12px",borderBottom:"1px solid #F0F0F0",display:"flex",
        justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:10,color:"#AAA",fontWeight:600}}>
          p.{meta.page}{meta.character?` · ${meta.character}`:""}{meta.mode?` · ${meta.mode}`:""}
        </span>
        <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",color:"#CCC",fontSize:14}}>×</button>
      </div>
      <textarea ref={inputRef} value={text} onChange={e=>setText(e.target.value)}
        onKeyDown={e=>{
          if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();if(text.trim())onSave(text.trim());}
          if(e.key==="Escape")onClose();
        }}
        placeholder="Note..."
        style={{width:"100%",border:"none",outline:"none",resize:"none",padding:"10px 12px",
          fontSize:12,lineHeight:1.6,fontFamily:"inherit",boxSizing:"border-box",minHeight:72,background:"#FAFAFA"}}
      />
      <div style={{padding:"6px 12px",borderTop:"1px solid #F0F0F0",display:"flex",justifyContent:"flex-end",gap:8}}>
        <button onClick={onClose} style={{background:"none",border:"none",color:"#AAA",fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>Cancel</button>
        <button onClick={()=>{if(text.trim())onSave(text.trim());}} style={{background:"#000",color:"#FFF",border:"none",
          borderRadius:3,padding:"4px 12px",fontSize:11,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>Save ↵</button>
      </div>
    </div>
  );
}

// ─── SMART EDITOR ─────────────────────────────────────────────────────────────
function SmartEditor({project,cast,onUpdateContent,onAddCharacter,format,onPageChange,focusMode,scrollRef,darkCanvas,onCharFocus,profile,onEditTitlePage}){
  const [lines,setLines]=useState(()=>
    project?.lines?.length?project.lines:[{id:Date.now(),text:"",mode:"action"}]
  );
  const [curLine,setCurLine]=useState(0);
  const [pillVisible,setPillVisible]=useState(false);
  const [pillPos,setPillPos]=useState({x:0,y:0});
  const [popup,setPopup]=useState({visible:false,x:0,y:0,query:"",matches:[]});
  const [contextMenu,setContextMenu]=useState(null);
  const [inlineNote,setInlineNote]=useState(null);

  const refs=useRef({});
  const textCache=useRef({});
  const pillTimerRef=useRef(null);
  const syncTimerRef=useRef(null);
  const cycle=FORMAT_CYCLES[format]||FORMAT_CYCLES.film;

  // ── autoGrow defined first so history functions can reference it ──
  const autoGrow=(el)=>{
    if(!el) return;
    el.style.height="auto";
    el.style.height=el.scrollHeight+"px";
  };

  // ── PAGE MAP ──────────────────────────────────────────────────────────────
  const PAGE_H=864;
  const lineHeights=useRef({});
  const wrapperRefs=useRef({});
  const pageCounterRef=useRef(null);

  const computePageMap=useCallback((lns)=>{
    const breakSet=new Set(),lineToPage={};
    let acc=0,page=1;
    for(let i=0;i<lns.length;i++){
      const h=lineHeights.current[i]||28;
      if(acc+h>PAGE_H&&acc>0){breakSet.add(i);acc=h;page++;}
      else acc+=h;
      lineToPage[i]=page;
    }
    return{breakSet,lineToPage,total:page};
  },[]);

  const pageMapRef=useRef({breakSet:new Set(),lineToPage:{},total:1});

  // ── UNDO / REDO ───────────────────────────────────────────────────────────
  // History snapshots: {lines, texts}. Captured every 300ms after typing stops.
  const history=useRef([]);
  const historyFuture=useRef([]);
  const MAX_HISTORY=100;

  const captureSnapshot=(lns,cache)=>{
    history.current.push({lines:lns.map(l=>({...l})),texts:{...cache}});
    if(history.current.length>MAX_HISTORY) history.current.shift();
    historyFuture.current=[];
  };

  const applySnapshot=(snapshot)=>{
    setLines(snapshot.lines);
    textCache.current={...snapshot.texts};
    snapshot.lines.forEach((l,i)=>{
      const el=refs.current[i];
      if(el){el.value=snapshot.texts[i]??"";autoGrow(el);}
    });
    Object.keys(refs.current).forEach(k=>{if(Number(k)>=snapshot.lines.length) delete refs.current[k];});
    pageMapRef.current=computePageMap(snapshot.lines);
    onUpdateContent(snapshot.lines.map((l,i)=>({...l,text:snapshot.texts[i]??l.text})));
  };

  // ── PAGE COUNTER ──────────────────────────────────────────────────────────
  const updateCounter=(lineIdx)=>{
    const p=pageMapRef.current.lineToPage[lineIdx]||1;
    const t=pageMapRef.current.total;
    if(pageCounterRef.current) pageCounterRef.current.textContent=`${p} / ${t}`;
    if(onPageChange) onPageChange(p,t);
  };

  // ── RESTORE ON PROJECT SWITCH ─────────────────────────────────────────────
  useEffect(()=>{
    const next=project?.lines?.length?project.lines:[{id:Date.now(),text:"",mode:"action"}];
    setLines(next);
    next.forEach((l,i)=>{textCache.current[i]=l.text;});
    setCurLine(0);
    lineHeights.current={};
    pageMapRef.current=computePageMap(next);
    history.current=[{lines:next.map(l=>({...l})),texts:Object.fromEntries(next.map((l,i)=>[i,l.text]))}];
    historyFuture.current=[];
  },[project?.id]);

  // ── SCROLL-TO-LINE ────────────────────────────────────────────────────────
  const containerRef=useRef(null);
  useEffect(()=>{
    if(scrollRef){
      scrollRef.current=(idx)=>{
        const el=wrapperRefs.current[idx];
        if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
        refs.current[idx]?.focus();
      };
    }
  },[scrollRef]);

  // ── POST-MOUNT HEIGHT MEASUREMENT ─────────────────────────────────────────
  useEffect(()=>{
    const raf=requestAnimationFrame(()=>{
      let changed=false;
      for(const idx in wrapperRefs.current){
        const el=wrapperRefs.current[idx];
        if(el&&el.offsetHeight>0){lineHeights.current[idx]=el.offsetHeight;changed=true;}
      }
      if(changed) pageMapRef.current=computePageMap(lines);
    });
    return()=>cancelAnimationFrame(raf);
  },[lines.length]);

  useEffect(()=>{
    if(!focusMode) return;
    const el=wrapperRefs.current[curLine];
    if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
  },[curLine,focusMode]);

  // ── DEBOUNCED SYNC ────────────────────────────────────────────────────────
  const scheduleSync=()=>{
    clearTimeout(syncTimerRef.current);
    syncTimerRef.current=setTimeout(()=>{
      setLines(prev=>{
        const updated=prev.map((l,i)=>({...l,text:textCache.current[i]??l.text}));
        captureSnapshot(updated,{...textCache.current});
        onUpdateContent(updated);
        pageMapRef.current=computePageMap(updated);
        return updated;
      });
    },300);
  };

  const showPill=(el)=>{
    if(!el) return;
    const r=el.getBoundingClientRect();
    setPillPos({x:r.left,y:r.top});
    setPillVisible(true);
    clearTimeout(pillTimerRef.current);
    pillTimerRef.current=setTimeout(()=>setPillVisible(false),1800);
  };

  const focusLine=(idx,atEnd=true)=>{
    setTimeout(()=>{
      const el=refs.current[idx];
      if(!el) return;
      el.focus();
      if(atEnd){const len=el.value.length;el.setSelectionRange(len,len);}
    },0);
  };

  const deleteLineAt=(idx)=>{
    setLines(prev=>{
      const next=prev.filter((_,i)=>i!==idx);
      const newCache={};
      next.forEach((_,i)=>{newCache[i]=textCache.current[i<idx?i:i+1]??"";});
      textCache.current=newCache;
      pageMapRef.current=computePageMap(next);
      return next;
    });
    const prevIdx=Math.max(0,idx-1);
    setCurLine(prevIdx);
    focusLine(prevIdx);
  };

  const handleChange=(e,idx)=>{
    const text=e.target.value;
    textCache.current[idx]=text;
    scheduleSync();
    const mode=lines[idx]?.mode;
    if(mode==="character"&&text.trim().length>0){
      const el=refs.current[idx];
      if(!el) return;
      const r=el.getBoundingClientRect();
      const q=text.trim();
      const matches=cast.filter(c=>c.name.toUpperCase().startsWith(q.toUpperCase()));
      setPopup({visible:true,x:r.left,y:r.bottom+6,query:q,matches});
    } else {
      setPopup(p=>({...p,visible:false}));
    }
  };

  const handleKeyDown=(e,idx)=>{
    const lineMode=lines[idx]?.mode;

    if(e.altKey&&MODE_SHORTCUTS[e.key]){
      e.preventDefault();
      setLines(prev=>prev.map((l,i)=>i===idx?{...l,mode:MODE_SHORTCUTS[e.key]}:l));
      showPill(refs.current[idx]);
      return;
    }
    if((e.ctrlKey||e.metaKey)&&e.key==="a"){
      e.preventDefault();
      const el=refs.current[idx];
      if(el){el.focus();el.select();}
      return;
    }
    if((e.ctrlKey||e.metaKey)&&e.key==="n"){
      e.preventDefault();
      const el=refs.current[idx];
      if(el){
        const r=el.getBoundingClientRect();
        const meta={page:pageMapRef.current.lineToPage[idx]||1,
          character:lines[idx]?.mode==="character"?(textCache.current[idx]||""):"",
          mode:lines[idx]?.mode};
        setInlineNote({x:r.left+40,y:r.bottom+8,lineIdx:idx,meta});
      }
      return;
    }

    // ── ⌘Z: undo ──────────────────────────────────────────────────────────
    if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key==="z"){
      e.preventDefault();
      textCache.current[idx]=refs.current[idx]?.value??textCache.current[idx]??"";
      if(history.current.length<=1) return;
      const currentSnap={
        lines:lines.map((l,i)=>({...l,text:textCache.current[i]??l.text})),
        texts:{...textCache.current},
      };
      historyFuture.current.push(currentSnap);
      history.current.pop();
      const prev=history.current[history.current.length-1];
      if(prev) applySnapshot(prev);
      return;
    }

    // ── ⌘Y / ⌘⇧Z: redo ───────────────────────────────────────────────────
    if((e.ctrlKey||e.metaKey)&&(e.key==="y"||(e.shiftKey&&e.key==="z"))){
      e.preventDefault();
      if(historyFuture.current.length===0) return;
      const next=historyFuture.current.pop();
      history.current.push(next);
      applySnapshot(next);
      return;
    }

    if((e.ctrlKey||e.metaKey)&&e.key!=="k") return;
    if(e.shiftKey&&e.key!=="Tab") return;

    if(e.key==="Tab"&&!popup.visible){
      e.preventDefault();
      const ci=cycle.indexOf(lineMode);
      const nextMode=cycle[(ci+1)%cycle.length];
      setLines(prev=>prev.map((l,i)=>i===idx?{...l,mode:nextMode}:l));
      showPill(refs.current[idx]);
      return;
    }
    if(e.key==="Tab"&&popup.visible){
      e.preventDefault();
      if(popup.matches.length>0) acceptChar(popup.matches[0],idx);
      else if(popup.query) createChar(popup.query,idx);
      return;
    }
    if(e.key==="Enter"&&popup.visible){
      e.preventDefault();
      if(popup.query) createChar(popup.query,idx);
      return;
    }
    if(e.key==="Escape"){
      if(popup.visible){setPopup(p=>({...p,visible:false}));return;}
      if(lineMode==="character"){
        setLines(prev=>prev.map((l,i)=>i===idx?{...l,mode:"action"}:l));
        showPill(refs.current[idx]);
      }
      return;
    }
    if(e.key==="Enter"){
      e.preventDefault();
      setPopup(p=>({...p,visible:false}));
      const el=refs.current[idx];
      const curVal=el?.value??(textCache.current[idx]??"");
      if(curVal===""&&lines.length>1){deleteLineAt(idx);return;}
      const selStart=el?el.selectionStart:curVal.length;
      const selEnd=el?el.selectionEnd:curVal.length;
      const before=curVal.slice(0,selStart);
      const after=curVal.slice(selEnd);
      const atEnd=after.length===0;
      if(el) el.value=before;
      textCache.current[idx]=before;
      // Smart mode for new line when pressing Enter at END of a line.
      // character→dialogue is standard screenplay flow.
      // dialogue→dialogue lets writers keep adding dialogue lines naturally;
      // they can Tab to character when they want a new speaker.
      // location→action starts the scene body.
      const nextMode=lineMode==="character"?"dialogue":lineMode==="location"?"action":"action";
      const newText=atEnd?"":after;
      const newMode=atEnd?nextMode:lineMode;
      const newLine={id:Date.now(),text:newText,mode:newMode};
      for(let i=lines.length;i>idx+1;i--){textCache.current[i]=textCache.current[i-1]??"";}
      textCache.current[idx+1]=newText;
      setLines(prev=>{
        const next=[...prev];
        next[idx]={...next[idx],text:before};
        next.splice(idx+1,0,newLine);
        pageMapRef.current=computePageMap(next);
        return next;
      });
      setCurLine(idx+1);
      focusLine(idx+1,false);
      scheduleSync();
      return;
    }
    if(e.key==="Backspace"){
      const domVal=refs.current[idx]?.value;
      const curVal=domVal!==undefined?domVal:(textCache.current[idx]??"");
      if(curVal===""&&lines.length>1){
        e.preventDefault();
        setPopup(p=>({...p,visible:false}));
        deleteLineAt(idx);
        return;
      }
      // Backspace at position 0 on a non-empty line → merge this line's text
      // up into the end of the previous line, then remove this line.
      // This lets the writer join two incorrectly-split dialogue lines.
      const el=refs.current[idx];
      const pos=el?el.selectionStart:0;
      if(pos===0&&curVal.length>0&&idx>0){
        e.preventDefault();
        setPopup(p=>({...p,visible:false}));
        const prevEl=refs.current[idx-1];
        const prevVal=prevEl?.value??textCache.current[idx-1]??"";
        const merged=prevVal+curVal;
        const joinPos=prevVal.length;
        // Write merged text into previous line DOM and cache
        if(prevEl){prevEl.value=merged;autoGrow(prevEl);}
        textCache.current[idx-1]=merged;
        // Remove current line, reindex cache
        setLines(prev=>{
          const next=prev.filter((_,i)=>i!==idx);
          const newCache={};
          next.forEach((_,i)=>{newCache[i]=textCache.current[i<idx?i:i+1]??"";});
          newCache[idx-1]=merged;
          textCache.current=newCache;
          pageMapRef.current=computePageMap(next);
          return next;
        });
        setCurLine(idx-1);
        // Place cursor at the join point in the previous line
        setTimeout(()=>{
          const el=refs.current[idx-1];
          if(el){el.focus();el.setSelectionRange(joinPos,joinPos);}
        },0);
        scheduleSync();
        return;
      }
    }
  };

  const acceptChar=(char,idx)=>{
    const el=refs.current[idx];
    if(el){el.value=char.name.toUpperCase();}
    textCache.current[idx]=char.name.toUpperCase();
    setPopup(p=>({...p,visible:false}));
    scheduleSync();
    focusLine(idx);
  };

  const createChar=(name,idx)=>{
    const formatted=name.toUpperCase();
    onAddCharacter({id:Date.now(),name:formatted,role:"Supporting",voice:"",notes:""});
    const el=refs.current[idx];
    if(el){el.value=formatted;}
    textCache.current[idx]=formatted;
    setPopup(p=>({...p,visible:false}));
    scheduleSync();
    focusLine(idx);
  };

  const handleContextMenu=(e,idx)=>{
    const sel=window.getSelection()?.toString()?.trim();
    const taEl=refs.current[idx];
    const taSel=taEl?taEl.value.slice(taEl.selectionStart,taEl.selectionEnd).trim():"";
    const chosen=taSel||sel;
    if(!chosen||chosen.length<2) return;
    e.preventDefault();
    setContextMenu({x:e.clientX,y:e.clientY,text:chosen});
  };

  const addToCastFromContext=()=>{
    if(!contextMenu) return;
    const name=contextMenu.text.toUpperCase();
    if(!cast.some(c=>c.name.toUpperCase()===name)){
      onAddCharacter({id:Date.now(),name,role:"Supporting",voice:"",notes:""});
    }
    setContextMenu(null);
  };

  const saveInlineNote=(text)=>{
    if(!inlineNote) return;
    const{lineIdx,meta}=inlineNote;
    const note={id:Date.now(),text,lineIdx,meta,created:Date.now()};
    setLines(prev=>prev.map((l,i)=>i===lineIdx?{...l,notes:[...(l.notes||[]),note]}:l));
    setInlineNote(null);
  };

  const placeholder=(mode)=>({
    character:"CHARACTER NAME",dialogue:"Dialogue...",
    location:"INT./EXT. LOCATION — DAY/NIGHT",direction:"(parenthetical)",
    note:"// note...",action:"Action / description...",
  }[mode]||"");

  const taStyle=(mode)=>{
    const ls=lineStyle(mode,format);
    return{width:"100%",border:"none",outline:"none",resize:"none",background:"transparent",
      fontFamily:"'Courier New',Courier,monospace",fontSize:14,lineHeight:1.9,overflowY:"hidden",
      overflowX:"hidden",minHeight:28,padding:0,margin:0,caretColor:"#000",
      boxSizing:"border-box",display:"block",...ls};
  };

  const autoGrowOnMount=(el,text)=>{
    if(!el||!text||text.length<60) return;
    autoGrow(el);
  };

  const pageMap=pageMapRef.current;

  return(
    <div ref={containerRef} style={{flex:1,position:"relative",overflowY:"auto",
      background:darkCanvas?"#1A1A1A":"#D8D8D8",padding:"40px 0 80px"}}>
      <ModePill mode={lines[curLine]?.mode||"action"} visible={pillVisible} x={pillPos.x} y={pillPos.y}/>

      <TitlePage project={project} profile={profile} format={format} onEdit={onEditTitlePage||(() => {})}/>
      <div style={{height:40}}/>

      <div style={{width:816,margin:"0 auto",background:"#FFFFFF",
        boxShadow:darkCanvas?"0 2px 32px rgba(0,0,0,0.5)":"0 2px 16px rgba(0,0,0,0.18)"}}>
        <div style={{height:96}}/>
        <div style={{padding:"0 96px"}}>
          {lines.map((line,idx)=>{
            const isBreakBefore=pageMap.breakSet.has(idx);
            const pageNum=pageMap.lineToPage[idx]||1;
            return(
              <div key={line.id}>
                {isBreakBefore&&<PageBreakDivider pageNum={pageNum} title={project?.title} format={format}/>}
                <div style={{position:"relative"}}>
                  {line.notes?.length>0&&(
                    <span style={{position:"absolute",left:-20,top:4,fontSize:9,color:"#AAA",
                      fontWeight:700,cursor:"default",userSelect:"none"}}
                      title={line.notes.map(n=>n.text).join(" / ")}>¹</span>
                  )}
                  {line.mode==="character"&&(()=>{
                    const charName=(textCache.current[idx]||line.text||"").trim().toUpperCase();
                    const charData=cast.find(c=>c.name.toUpperCase()===charName);
                    if(!charData?.image) return null;
                    return(
                      <div style={{position:"absolute",right:-20,top:4,zIndex:50}}
                        onMouseEnter={e=>{
                          const preview=document.getElementById("char-preview-global");
                          const rect=e.currentTarget.getBoundingClientRect();
                          if(preview){preview.src=charData.image;preview.style.display="block";
                            preview.style.top=(rect.top-60)+"px";preview.style.left=(rect.left-120)+"px";}
                        }}
                        onMouseLeave={()=>{
                          const preview=document.getElementById("char-preview-global");
                          if(preview) preview.style.display="none";
                        }}>
                        <div style={{width:7,height:7,borderRadius:"50%",background:"#000",opacity:0.15,cursor:"pointer"}}/>
                      </div>
                    );
                  })()}
                  <div ref={el=>{wrapperRefs.current[idx]=el;}} style={{position:"relative",...wrapperStyle(line.mode,format)}}>
                    <textarea
                      ref={el=>{refs.current[idx]=el;if(el) autoGrowOnMount(el,line.text);}}
                      defaultValue={line.text}
                      placeholder={placeholder(line.mode)}
                      rows={1}
                      spellCheck={true}
                      autoCorrect="on"
                      autoCapitalize="sentences"
                      autoComplete="off"
                      onBlur={()=>{
                        // When leaving a character-mode line, if the name isn't in the cast yet,
                        // show the popup at this line so the writer can confirm adding them.
                        // Small delay so the popup renders before focus fully leaves.
                        if(lines[idx]?.mode==="character"){
                          const name=(refs.current[idx]?.value||textCache.current[idx]||"").trim();
                          if(name.length>0&&!cast.some(c=>c.name.toUpperCase()===name.toUpperCase())){
                            const el=refs.current[idx];
                            if(el){
                              const r=el.getBoundingClientRect();
                              const matches=cast.filter(c=>c.name.toUpperCase().startsWith(name.toUpperCase()));
                              setTimeout(()=>setPopup({visible:true,x:r.left,y:r.bottom+6,query:name,matches}),80);
                            }
                          }
                        }
                      }}
                      onFocus={()=>{
                        setCurLine(idx);showPill(refs.current[idx]);updateCounter(idx);
                        if(onCharFocus&&lines[idx]?.mode==="character")
                          onCharFocus((textCache.current[idx]||lines[idx]?.text||"").trim());
                        else if(onCharFocus) onCharFocus("");
                      }}
                      onChange={e=>{
                        autoGrow(e.target);
                        const w=wrapperRefs.current[idx];
                        if(w) lineHeights.current[idx]=w.offsetHeight;
                        handleChange(e,idx);
                      }}
                      onKeyDown={e=>handleKeyDown(e,idx)}
                      onContextMenu={e=>handleContextMenu(e,idx)}
                      style={taStyle(line.mode)}
                    />
                  </div>
                </div>
              </div>
            );
          })}
        </div>
        <div style={{height:96}}/>
      </div>

      {popup.visible&&(
        <CharPopup matches={popup.matches} query={popup.query}
          onSelect={c=>acceptChar(c,curLine)} onCreate={name=>createChar(name,curLine)}
          style={{left:popup.x,top:popup.y}}/>
      )}
      {contextMenu&&(
        <ContextMenu x={contextMenu.x} y={contextMenu.y} selectedText={contextMenu.text}
          onAddToCase={addToCastFromContext} onClose={()=>setContextMenu(null)}/>
      )}
      {inlineNote&&(
        <InlineNotePopup x={inlineNote.x} y={inlineNote.y} meta={inlineNote.meta}
          onSave={saveInlineNote} onClose={()=>setInlineNote(null)}/>
      )}
      <img id="char-preview-global" src="" alt="" style={{display:"none",position:"fixed",zIndex:1200,
        width:110,height:110,objectFit:"cover",borderRadius:6,border:"1px solid #D0D0D0",
        boxShadow:"0 4px 16px rgba(0,0,0,0.18)",pointerEvents:"none"}}/>
      <style>{`
        textarea::placeholder{color:#CCCCCC;font-style:italic;}
        textarea{scrollbar-width:none;}
        textarea::-webkit-scrollbar{display:none;}
        @keyframes sf-progress{0%{width:5%;margin-left:0;}50%{width:60%;margin-left:20%;}100%{width:5%;margin-left:95%;}}
      `}</style>
    </div>
  );
}

// ─── AI PANEL ─────────────────────────────────────────────────────────────────
function AIPanel({project,cast,onClose,onGoToProfile}){
  const [mode,setMode]=useState("write");
  const [prompt,setPrompt]=useState("");
  const [response,setResponse]=useState("");
  const [loading,setLoading]=useState(false);
  const [corrType,setCorrType]=useState("grammar");
  const fmt=FORMATS.find(f=>f.id===project?.format)?.label||"Script";
  const genre=project?.genre||"Unspecified";
  const charList=cast.map(c=>c.name).join(", ")||"none";
  const content=project?.lines?.map(l=>l.text).join("\n").slice(-1500)||"";
  const moodContext=(project?.moodCards||[]).length>0
    ?"\n\nREFERENCE CARDS:\n"+(project.moodCards||[]).map(c=>`[${c.tag}] ${c.title}: ${c.body}`).join("\n"):"";
  const isArtifact=window.location.hostname.includes("claude.ai")||window.location.protocol==="blob:";
  const isLocalDev=window.location.hostname==="localhost"||window.location.hostname==="127.0.0.1";
  const localKey=LS.get("sf_api_key",null);
  const needsOwnKey=!isArtifact&&!isLocalDev&&!localKey;
  const run=async(sys,usr)=>{
    if(needsOwnKey){setResponse("Add your Anthropic API key in Profile → API Key to use AI features.");return;}
    setLoading(true);setResponse("");
    let url,headers;
    if(isArtifact){url="https://api.anthropic.com/v1/messages";headers={"Content-Type":"application/json"};}
    else if(localKey){url="https://api.anthropic.com/v1/messages";headers={"Content-Type":"application/json","x-api-key":localKey,"anthropic-version":"2023-06-01"};}
    else{url="/api/chat";headers={"Content-Type":"application/json"};}
    try{
      const res=await fetch(url,{method:"POST",headers,body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:1000,system:sys,messages:[{role:"user",content:usr}]})});
      const d=await parseApiResponse(res);
      if(d.error) setResponse(`API error: ${d.error?.message||JSON.stringify(d.error)}`);
      else if(d.content) setResponse(d.content.filter(b=>b.type==="text").map(b=>b.text).join("")||"No response.");
      else setResponse("Unexpected response: "+JSON.stringify(d).slice(0,200));
    }catch(err){setResponse("Connection error: "+err.message);}
    setLoading(false);
  };
  const doWrite=()=>{if(!prompt.trim()) return;run(`You are a master writer. Format: ${fmt}. Genre: ${genre}. Characters: ${charList}.${moodContext} Write in exact ${fmt} format.`,`Script so far:\n${content}\n\nRequest: ${prompt}`);};
  const doCorrect=()=>{
    const map={grammar:"List every grammar, spelling, and punctuation issue.",style:"Identify weak verbs, passive voice. Give rewrites.",dialogue:"Analyze dialogue. Flag anything on-the-nose. Give punchy rewrites.",pacing:"Evaluate pacing. Where does it drag?",continuity:"Find continuity errors.",format:`Check formatting against ${fmt} industry standards.`};
    run(`You are a professional script editor. Format: ${fmt}. Genre: ${genre}. Give specific, actionable notes.`,`${map[corrType]}\n\nSCRIPT:\n${content}`);
  };
  return(
    <div style={{position:"fixed",right:0,top:0,bottom:0,width:340,background:"#FFF",borderLeft:"1px solid #E8E8E8",display:"flex",flexDirection:"column",zIndex:500,boxShadow:"-4px 0 20px rgba(0,0,0,0.06)"}}>
      <div style={{padding:"16px 20px",borderBottom:"1px solid #E8E8E8",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div><p style={{margin:0,fontSize:13,fontWeight:800,color:"#000"}}>AI Assistant</p><p style={{margin:"2px 0 0",fontSize:11,color:"#AAA"}}>{fmt} · {genre}</p></div>
        <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",fontSize:20,color:"#AAA",lineHeight:1,padding:4}}>×</button>
      </div>
      {needsOwnKey&&(
        <div style={{margin:"14px 20px 0",padding:"12px 14px",background:"#FAFAFA",border:"1px solid #E8E8E8",borderRadius:6}}>
          <p style={{margin:"0 0 6px",fontSize:12,fontWeight:700,color:"#000"}}>Add your API key to use AI features</p>
          <p style={{margin:"0 0 10px",fontSize:11.5,color:"#777",lineHeight:1.6}}>Paste a key from console.anthropic.com in Profile.</p>
          <button onClick={onGoToProfile} style={{padding:"7px 12px",borderRadius:4,background:"#000",color:"#FFF",border:"none",cursor:"pointer",fontFamily:"inherit",fontWeight:700,fontSize:11.5}}>Add API key</button>
        </div>
      )}
      <div style={{display:"flex",borderBottom:"1px solid #E8E8E8"}}>
        {[["write","Write"],["correct","Corrections"],["voice","Voice"]].map(([id,lbl])=>(
          <button key={id} onClick={()=>setMode(id)} style={{flex:1,padding:"10px 4px",background:"none",border:"none",borderBottom:`2px solid ${mode===id?"#000":"transparent"}`,color:mode===id?"#000":"#AAA",cursor:"pointer",fontFamily:"inherit",fontSize:11,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase"}}>{lbl}</button>
        ))}
      </div>
      <div style={{flex:1,overflowY:"auto",padding:20,display:"flex",flexDirection:"column",gap:16}}>

          <div>

            </div>

            <button onClick={doWrite} disabled={loading||!prompt.trim()} style={{marginTop:8,width:"100%",padding:"10px",borderRadius:4,background:"#000",color:"#FFF",border:"none",cursor:loading?"wait":"pointer",fontFamily:"inherit",fontWeight:700,fontSize:13,opacity:loading||!prompt.trim()?0.4:1}}>{loading?"Writing...":"Write"}</button>
          </div>

        {mode==="correct"&&(
          <div>
            <label style={css.label}>Correction type</label>
            <div style={{display:"flex",flexDirection:"column",gap:4,marginBottom:16}}>

          </div>
        )}
        {mode==="voice"&&(
          <div>
            <label style={css.label}>Character voice profiles</label>
            {cast.length===0?<p style={{fontSize:12,color:"#AAA",fontStyle:"italic"}}>Add characters to your cast first.</p>

        {(response||loading)&&(
          <div style={{borderTop:"1px solid #EBEBEB",paddingTop:16}}>

      </div>
    </div>
  );
}

// ─── CAST PANEL ───────────────────────────────────────────────────────────────
function CastPanel({cast,onUpdate,onAdd,onDelete,onClose}){
  const [sel,setSel]=useState(0);
  const [saved,setSaved]=useState(false);
  const imgInputRef=useRef(null);
  const cur=cast[sel];
  const upd=(field,val)=>onUpdate(cast[sel].id,field,val);
  const handleDone=()=>{setSaved(true);setTimeout(()=>{setSaved(false);onClose();},600);};
  const handleImageChange=(e)=>{
    const file=e.target.files?.[0];if(!file) return;
    const reader=new FileReader();reader.onload=(ev)=>upd("image",ev.target.result);
    reader.readAsDataURL(file);e.target.value="";
  };
  return(
    <div style={{width:420,borderRight:"1px solid #EBEBEB",display:"flex",flexShrink:0,overflow:"hidden",background:"#FFF"}}>
      <div style={{width:148,borderRight:"1px solid #EBEBEB",display:"flex",flexDirection:"column",flexShrink:0}}>
        <div style={{padding:"14px 14px 10px",borderBottom:"1px solid #EBEBEB",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <p style={{margin:0,fontSize:10,fontWeight:800,color:"#000",letterSpacing:"0.1em",textTransform:"uppercase"}}>Cast</p>
          <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",color:"#CCC",fontSize:16,lineHeight:1,padding:0}}>×</button>
        </div>
        <div style={{flex:1,overflowY:"auto"}}>
          {cast.length===0&&<p style={{padding:"14px",fontSize:12,color:"#CCC",fontStyle:"italic"}}>No cast yet</p>}
          {cast.map((c,i)=>(
            <button key={c.id} onClick={()=>setSel(i)} style={{width:"100%",padding:"10px 14px",background:i===sel?"#FAFAFA":"none",border:"none",borderLeft:`2px solid ${i===sel?"#000":"transparent"}`,cursor:"pointer",textAlign:"left",fontFamily:"inherit",display:"flex",alignItems:"center",gap:8}}>
              <div style={{width:28,height:28,borderRadius:"50%",flexShrink:0,background:c.image?"none":"#EBEBEB",border:"1px solid #E0E0E0",overflow:"hidden",display:"flex",alignItems:"center",justifyContent:"center"}}>
                {c.image?<img src={c.image} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<span style={{fontSize:10,fontWeight:700,color:"#AAA"}}>{c.name?.[0]?.toUpperCase()||"?"}</span>}
              </div>
              <div style={{overflow:"hidden",flex:1}}>
                <p style={{margin:0,fontSize:12,fontWeight:i===sel?700:500,color:i===sel?"#000":"#666",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.name}</p>
                <p style={{margin:"2px 0 0",fontSize:10,color:"#AAA"}}>{c.role}</p>
              </div>
            </button>
          ))}
        </div>
        <div style={{padding:"10px 12px 42px",borderTop:"1px solid #EBEBEB",display:"flex",gap:6}}>
          <button onClick={()=>onAdd((newIdx)=>setSel(newIdx))} style={{flex:1,padding:"7px",background:"#000",color:"#FFF",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"inherit",fontSize:11,fontWeight:700}}>+ Add</button>
          <button onClick={()=>{if(cast.length===0)return;onDelete(cast[sel].id);setSel(Math.max(0,sel-1));}} style={{padding:"7px 10px",background:"none",border:"1px solid #E0E0E0",borderRadius:4,cursor:"pointer",fontFamily:"inherit",fontSize:11,color:"#AAA"}}>✕</button>
        </div>
      </div>
      {cur?(
        <div style={{flex:1,overflowY:"auto",padding:"20px 18px 52px",display:"flex",flexDirection:"column"}}>
          <div style={{display:"flex",alignItems:"flex-end",gap:14,marginBottom:18}}>
            <div style={{width:72,height:72,borderRadius:8,flexShrink:0,background:cur.image?"none":"#F4F4F4",border:"1px solid #E8E8E8",overflow:"hidden",display:"flex",alignItems:"center",justifyContent:"center"}}>
              {cur.image?<img src={cur.image} alt={cur.name} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<span style={{fontSize:22,color:"#CCC"}}>◉</span>}
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              <input ref={imgInputRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleImageChange}/>
              <button onClick={()=>imgInputRef.current?.click()} style={{padding:"6px 12px",background:"none",border:"1px solid #D0D0D0",borderRadius:4,fontSize:11,fontWeight:600,color:"#555",cursor:"pointer",fontFamily:"inherit"}}>{cur.image?"Change photo":"Upload photo"}</button>
              {cur.image&&<button onClick={()=>upd("image",null)} style={{padding:"4px 12px",background:"none",border:"none",fontSize:11,color:"#AAA",cursor:"pointer",fontFamily:"inherit",textAlign:"left"}}>Remove</button>}
            </div>
          </div>
          <input value={cur.name||""} onChange={e=>upd("name",e.target.value)}
            ref={el=>{if(el&&cur.name==="NEW CHARACTER"){el.focus();el.select();}}}
            placeholder="CHARACTER NAME"
            style={{background:"none",border:"none",borderBottom:"2px solid #000",color:"#000",fontSize:18,fontWeight:800,outline:"none",fontFamily:"inherit",width:"100%",paddingBottom:5,marginBottom:16,letterSpacing:"0.04em"}}/>
          <div style={{marginBottom:12}}>
            <label style={css.label}>Role</label>
            <select value={cur.role||"Supporting"} onChange={e=>upd("role",e.target.value)} style={{...css.input,fontSize:12}}>
              {["Protagonist","Antagonist","Supporting","Mentor","Love Interest","Rival","Comic Relief","Background","Other"].map(r=><option key={r}>{r}</option>)}
            </select>
          </div>
          {[["age","Age"],["gender","Gender"],["height","Build"],["hair","Hair"],["eyes","Eyes"]].map(([f,l])=>(
            <div key={f} style={{marginBottom:10}}><label style={css.label}>{l}</label><input value={cur[f]||""} onChange={e=>upd(f,e.target.value)} style={{...css.input,fontSize:12}}/></div>
          ))}
          <div style={{borderTop:"1px solid #EBEBEB",margin:"14px 0 12px"}}/><p style={{...css.label,marginBottom:12}}>Voice</p>
          {[["voice","Quality"],["accent","Accent"],["pitch","Pitch"]].map(([f,l])=>(
            <div key={f} style={{marginBottom:10}}><label style={css.label}>{l}</label><input value={cur[f]||""} onChange={e=>upd(f,e.target.value)} style={{...css.input,fontSize:12}}/></div>
          ))}
          <div style={{borderTop:"1px solid #EBEBEB",margin:"14px 0 12px"}}/><p style={{...css.label,marginBottom:12}}>Psychology</p>
          {[["motivation","Motivation"],["fear","Fear"],["secret","Secret"],["arc","Arc"]].map(([f,l])=>(
            <div key={f} style={{marginBottom:10}}><label style={css.label}>{l}</label><textarea value={cur[f]||""} onChange={e=>upd(f,e.target.value)} style={{...css.input,resize:"vertical",minHeight:52,lineHeight:1.5,fontSize:12}}/></div>
          ))}
          <div style={{paddingTop:16,paddingBottom:8}}>
            <button onClick={handleDone} style={{width:"100%",padding:"10px",background:saved?"#444":"#000",color:"#FFF",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"inherit",fontWeight:700,fontSize:13,transition:"background 0.2s"}}>{saved?"✓ Saved":"Done — back to writing"}</button>
          </div>
        </div>
      ):(
        <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:12}}>
          <p style={{color:"#CCC",fontSize:12,margin:0}}>{cast.length===0?"No characters yet":"Select a character"}</p>
          {cast.length===0&&<button onClick={()=>onAdd((newIdx)=>setSel(newIdx))} style={{padding:"8px 18px",background:"#000",color:"#FFF",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"inherit",fontSize:12,fontWeight:700}}>+ Add character</button>}
        </div>
      )}
    </div>
  );
}

function AuthScreen({onAuth,initialMode="signin"}){
  const [mode,setMode]=useState(initialMode);
  const [name,setName]=useState("");
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [err,setErr]=useState("");
  const submit=()=>{
    setErr("");
    if(!email.trim()||!pass.trim()){setErr("Email and password required.");return;}
    const key=`sf_user_${email.trim().toLowerCase()}`;
    if(mode==="signup"){
      if(!name.trim()){setErr("Name required.");return;}
      if(LS.get(key,null)){setErr("Account already exists. Sign in instead.");return;}
      const user={name:name.trim(),email:email.trim().toLowerCase(),pass};
      LS.set(key,user);onAuth(user);
    } else {
      const user=LS.get(key,null);
      if(!user){setErr("No account found. Sign up instead.");return;}
      if(user.pass!==pass){setErr("Incorrect password.");return;}
      onAuth(user);
    }
  };
  return(
    <div style={{minHeight:"100vh",background:"#FFF",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
      <p style={{margin:"0 0 40px",fontSize:11,fontWeight:900,letterSpacing:"0.25em",textTransform:"uppercase",color:"#000"}}>STORYFORGE</p>
      <div style={{width:360,border:"1px solid #E8E8E8",borderRadius:8,padding:"40px 36px"}}>
        <h2 style={{margin:"0 0 28px",fontSize:22,fontWeight:900,color:"#000"}}>{mode==="signin"?"Sign in":"Create account"}</h2>
        {mode==="signup"&&<div style={{marginBottom:14}}><label style={css.label}>Name</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="B. Hill" style={css.input} onKeyDown={e=>e.key==="Enter"&&submit()}/></div>}
        <div style={{marginBottom:14}}><label style={css.label}>Email</label><input value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@email.com" style={css.input} onKeyDown={e=>e.key==="Enter"&&submit()}/></div>
        <div style={{marginBottom:20}}><label style={css.label}>Password</label><input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="••••••••" style={css.input} onKeyDown={e=>e.key==="Enter"&&submit()}/></div>
        {err&&<p style={{margin:"0 0 14px",fontSize:12,color:"#888"}}>{err}</p>}
        <button onClick={submit} style={{width:"100%",padding:"11px",background:"#000",color:"#FFF",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"inherit",fontWeight:700,fontSize:14}}>{mode==="signin"?"Sign in":"Create account"}</button>
        <p style={{margin:"16px 0 0",fontSize:12,color:"#AAA",textAlign:"center"}}>
          {mode==="signin"?"No account? ":"Have an account? "}
          <button onClick={()=>{setMode(mode==="signin"?"signup":"signin");setErr("");}} style={{background:"none",border:"none",cursor:"pointer",color:"#000",fontWeight:700,fontSize:12,fontFamily:"inherit",padding:0}}>{mode==="signin"?"Sign up":"Sign in"}</button>
        </p>
      </div>
    </div>
  );
}

          </div>
        ):(
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:16}}>

                onMouseEnter={e=>e.currentTarget.style.borderColor="#000"}
                onMouseLeave={e=>e.currentTarget.style.borderColor="#EBEBEB"}
                onClick={()=>{if(confirmDelete===p.id){setConfirmDelete(null);return;}onOpen(p,save,projects);}}>
                {renaming===p.id?(
                  <input value={renameVal} onChange={e=>setRenameVal(e.target.value)} autoFocus
                    onKeyDown={e=>{if(e.key==="Enter"){renameProject(p.id,renameVal);setRenaming(null);}if(e.key==="Escape")setRenaming(null);}}
                    onBlur={()=>{renameProject(p.id,renameVal);setRenaming(null);}}
                    onClick={e=>e.stopPropagation()}
                    style={{...css.input,fontSize:15,fontWeight:700,padding:"4px 0",marginBottom:8}}/>
                ):(
                  <p style={{margin:"0 0 6px",fontSize:15,fontWeight:700,color:"#000",lineHeight:1.3}}>{p.title}</p>

                    {confirmDelete===p.id?(

  const tog=(k,v)=>setP(prev=>({...prev,[k]:prev[k].includes(v)?prev[k].filter(x=>x!==v):[...prev[k],v]}));
  const STYLES=["Cinematic","Literary","Fast-paced","Dialogue-driven","Atmospheric","Minimalist","Dark & Gritty","Lyrical","Epic","Intimate","Experimental"];
  const steps=[
    {title:"Your name",content:(<div><label style={css.label}>Pen name or real name</label><input style={{...css.input,fontSize:16,padding:"12px 14px"}} value={p.name} onChange={e=>upd("name",e.target.value)} placeholder="e.g. B. Hill" autoFocus onKeyDown={e=>{if(e.key==="Enter"&&p.name.trim().length>0)setStep(s=>s+1);}}/></div>),ok:p.name.trim().length>0},
    {title:"Primary format",content:(<div style={{display:"flex",flexDirection:"column",gap:6}}>{FORMATS.map(f=>(<button key={f.id} onClick={()=>upd("format",f.id)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"13px 16px",borderRadius:4,cursor:"pointer",border:`1px solid ${p.format===f.id?"#000":"#E8E8E8"}`,background:p.format===f.id?"#000":"#FAFAFA",color:p.format===f.id?"#FFF":"#555",fontFamily:"inherit",fontSize:13,fontWeight:p.format===f.id?700:400,textAlign:"left"}}>{f.label}{p.format===f.id&&<span>✓</span>}</button>))}</div>),ok:true},
    {title:"Your genres",content:(<div><div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:24}}>{GENRES.map(g=>(<button key={g} onClick={()=>tog("genres",g)} style={{padding:"7px 14px",borderRadius:4,cursor:"pointer",border:`1px solid ${p.genres.includes(g)?"#000":"#E8E8E8"}`,background:p.genres.includes(g)?"#000":"#FAFAFA",color:p.genres.includes(g)?"#FFF":"#666",fontFamily:"inherit",fontSize:12,fontWeight:p.genres.includes(g)?700:400}}>{g}</button>))}</div><label style={css.label}>Default genre</label><select value={p.genre} onChange={e=>upd("genre",e.target.value)} style={css.input}>{GENRES.map(g=><option key={g}>{g}</option>)}</select></div>),ok:true},
    {title:"Writing style",content:(<div style={{display:"flex",flexWrap:"wrap",gap:8}}>{STYLES.map(s=>(<button key={s} onClick={()=>tog("styles",s)} style={{padding:"7px 14px",borderRadius:4,cursor:"pointer",border:`1px solid ${p.styles.includes(s)?"#000":"#E8E8E8"}`,background:p.styles.includes(s)?"#000":"#FAFAFA",color:p.styles.includes(s)?"#FFF":"#666",fontFamily:"inherit",fontSize:12,fontWeight:p.styles.includes(s)?700:400}}>{s}</button>))}</div>),ok:true},
  ];
  const cur=steps[step];
  return(
    <div style={{minHeight:"100vh",background:"#FFF",display:"flex",flexDirection:"column"}}>
      <div style={{padding:"20px 40px",borderBottom:"1px solid #EBEBEB",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <p style={{margin:0,fontSize:11,fontWeight:900,letterSpacing:"0.25em",textTransform:"uppercase"}}>STORYFORGE</p>
        <div style={{display:"flex",gap:6}}>{steps.map((_,i)=><div key={i} style={{width:24,height:2,borderRadius:2,background:i<=step?"#000":"#E8E8E8"}}/>)}</div>
        <p style={{margin:0,fontSize:11,color:"#AAA"}}>{step+1} / {steps.length}</p>
      </div>
      <div style={{flex:1,maxWidth:560,margin:"0 auto",padding:"60px 40px",width:"100%",boxSizing:"border-box",overflowY:"auto"}}>
        <h2 style={{fontSize:30,fontWeight:900,color:"#000",margin:"0 0 32px",letterSpacing:"-0.02em"}}>{cur.title}</h2>
        <div style={{borderTop:"1px solid #EBEBEB",marginBottom:32}}/>
        {cur.content}
      </div>
      <div style={{padding:"20px 40px",borderTop:"1px solid #EBEBEB",display:"flex",justifyContent:"space-between"}}>
        <button disabled={step===0} onClick={()=>setStep(s=>s-1)} style={{padding:"10px 20px",background:"none",border:"1px solid #E8E8E8",borderRadius:4,cursor:step===0?"not-allowed":"pointer",color:"#888",fontFamily:"inherit",fontSize:13,opacity:step===0?0.3:1}}>Back</button>
        <button disabled={!cur.ok} onClick={()=>{if(step<steps.length-1){setStep(s=>s+1);}else{LS.set("sf_profile",p);onSave(p);}}} style={{padding:"10px 28px",background:"#000",color:"#FFF",border:"none",borderRadius:4,cursor:cur.ok?"pointer":"not-allowed",fontFamily:"inherit",fontSize:13,fontWeight:700,opacity:cur.ok?1:0.3}}>{step<steps.length-1?"Continue":"Start writing"}</button>
      </div>
    </div>
  );
}

function MoodBoard({project,onUpdateCards}){
  const [prompt,setPrompt]=useState("");
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");
  const cards=project?.moodCards||[];
  const research=async()=>{
    if(!prompt.trim()) return;
    setLoading(true);setError("");
    try{
      const _isArtifact=window.location.hostname.includes("claude.ai")||window.location.protocol==="blob:";
      const _localKey=LS.get("sf_api_key",null);
      const _apiUrl=(_isArtifact||_localKey)?"https://api.anthropic.com/v1/messages":"/api/chat";
      const _headers={"Content-Type":"application/json",...(_localKey&&!_isArtifact?{"x-api-key":_localKey,"anthropic-version":"2023-06-01"}:{})};
      const res=await fetch(_apiUrl,{method:"POST",headers:_headers,body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:1000,system:"You are a creative research assistant. Return ONLY valid JSON — array of objects with keys: title (3-5 words), body (2-3 sentence insight), tag (one word: Tone/World/Character/Style/Theme/Visual). No markdown.",messages:[{role:"user",content:`Research this for a writing project. Extract 4-6 key creative reference points:\n\n${prompt}`}]})});
      const d=await parseApiResponse(res);
      const raw=d.content?.filter(b=>b.type==="text").map(b=>b.text).join("")||"[]";
      const parsed=JSON.parse(raw.replace(/```json|```/g,"").trim());
      const newCards=parsed.map((c,i)=>({id:Date.now()+i,...c,source:prompt.trim()}));
      onUpdateCards([...cards,...newCards]);setPrompt("");
    }catch(e){setError("Research failed. Try again.");}
    setLoading(false);
  };
  const removeCard=(id)=>onUpdateCards(cards.filter(c=>c.id!==id));
  return(
    <div style={{flex:1,display:"flex",flexDirection:"column",overflowY:"auto",padding:"48px 64px 80px",maxWidth:900,margin:"0 auto",width:"100%",boxSizing:"border-box"}}>
      <div style={{marginBottom:32}}><h2 style={{margin:"0 0 6px",fontSize:22,fontWeight:900,color:"#000"}}>Mood Board</h2><p style={{margin:0,fontSize:13,color:"#AAA"}}>Research reference points — injected into AI context when you write.</p></div>
      <div style={{display:"flex",gap:10,marginBottom:40}}>
        <input value={prompt} onChange={e=>setPrompt(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!loading)research();}} placeholder="e.g. Kingdom Hearts lore, Blade Runner visual tone..." style={{...css.input,flex:1,fontSize:13}}/>
        <button onClick={research} disabled={loading||!prompt.trim()} style={{padding:"9px 20px",background:"#000",color:"#FFF",border:"none",borderRadius:4,cursor:loading||!prompt.trim()?"not-allowed":"pointer",fontFamily:"inherit",fontWeight:700,fontSize:13,opacity:loading||!prompt.trim()?0.4:1,whiteSpace:"nowrap"}}>{loading?"Researching...":"Research"}</button>
      </div>
      {error&&<p style={{fontSize:12,color:"#888",marginBottom:16}}>{error}</p>}
      {cards.length===0?(<div style={{textAlign:"center",padding:"60px 0",color:"#CCC"}}><p style={{fontSize:32,margin:"0 0 12px"}}>◈</p><p style={{fontSize:13,margin:0}}>No reference cards yet.</p></div>):(
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:16}}>
          {cards.map(card=>(<div key={card.id} style={{background:"#FAFAFA",border:"1px solid #EBEBEB",borderRadius:8,padding:"16px 18px"}}>
            <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:8}}>
              <span style={{fontSize:9,fontWeight:800,letterSpacing:"0.12em",textTransform:"uppercase",padding:"3px 8px",borderRadius:3,background:"#F0F0F0",color:"#555",border:"1px solid #E0E0E0"}}>{card.tag}</span>
              <button onClick={()=>removeCard(card.id)} style={{background:"none",border:"none",cursor:"pointer",color:"#CCC",fontSize:14,lineHeight:1,padding:"0 0 0 8px"}}>×</button>
            </div>
            <p style={{margin:"0 0 6px",fontSize:13,fontWeight:700,color:"#000",lineHeight:1.3}}>{card.title}</p>

function ImportModal({profile,onImport,onClose}){

  const handleFile=async(e)=>{

    const imageTypes=["jpg","jpeg","png","gif","webp","bmp","tiff","heic"];
    const textTypes=["txt","fountain","fdx","md","rtf"];
    if(imageTypes.includes(ext)){const b64=await readAsBase64(file);setFilePayload({type:"image",base64:b64,mediaType:file.type||"image/jpeg"});setRaw("");setStatus("Image loaded.");}
    else if(ext==="pdf"){
      setStatus("Reading PDF...");const b64=await readAsBase64(file);setFilePayload({type:"pdf",base64:b64,mediaType:"application/pdf"});setRaw("");
      try{
        await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.6.347/pdf.min.js");

        const arrayBuffer=await file.arrayBuffer();const doc=await window.pdfjsLib.getDocument({data:arrayBuffer}).promise;
        let fullText="";
        for(let i=1;i<=doc.numPages;i++){const page=await doc.getPage(i);const content=await page.getTextContent();let lastY=null;content.items.forEach(item=>{const y=item.transform[5];if(lastY!==null&&Math.abs(y-lastY)>2)fullText+="\n";else if(fullText&&!fullText.endsWith("\n"))fullText+=" ";fullText+=item.str;lastY=y;});fullText+="\n";}
        const extracted=fullText.trim();
        if(extracted.length>40){setRaw(extracted);setStatus(`PDF loaded — ${extracted.split("\n").filter(l=>l.trim()).length} lines found.`);}

    else{const reader=new FileReader();reader.onload=ev=>{const text=ev.target.result;if(typeof text==="string"&&text.trim()){setRaw(text);setFilePayload(null);setStatus(`File loaded.`);}else{setError("Could not read this file.");setStatus("");}};reader.onerror=()=>setError("File could not be read.");reader.readAsText(file);}
  };
  const canImport=raw.trim().length>0||filePayload!==null;

    try{

      const res=await fetch(_apiUrl,{method:"POST",headers:_headers,body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:16000,system:"You are a script formatting engine. Classify script content into BLOCKS — not individual lines. CRITICAL: never split a single speech or paragraph into multiple objects just because it contains line breaks. Join all continuation lines into one object using \\n. A dialogue block is everything one character says until the next speaker or action beat — one object. An action block is a full paragraph — one object. Only create a new object when the TYPE changes (e.g. action to character, character to dialogue). Classify each block as: action, character, dialogue, location, direction, note. For blocks you are less than 90% confident about, add uncertain:true. Return ONLY valid JSON array of {text,mode,uncertain?}. No markdown.",messages})});
      const d=await parseApiResponse(res);

                  <div key={beat.id} draggable onDragStart={e=>handleDragStart(e,globalIdx)} onDragOver={e=>{e.preventDefault();setDragOver(globalIdx);}} onDrop={e=>handleDrop(e,globalIdx)} onDragEnd={()=>{setDragging(null);setDragOver(null);}}
                    style={{width:200,background:"#FFF",border:`1px solid ${dragOver===globalIdx?"#000":"#E0E0E0"}`,borderRadius:6,padding:"12px 14px",cursor:"grab",opacity:dragging===globalIdx?0.4:1}}>
                    {editing===beat.id?(
                      <>
                        <input value={beat.title} onChange={e=>updateBeat(beat.id,{title:e.target.value})} style={{width:"100%",border:"none",borderBottom:"1px solid #E0E0E0",outline:"none",fontSize:12,fontWeight:700,marginBottom:6,background:"transparent",fontFamily:"inherit"}} onBlur={()=>setEditing(null)} autoFocus/>
                        <textarea value={beat.body} onChange={e=>updateBeat(beat.id,{body:e.target.value})} style={{width:"100%",border:"1px solid #EBEBEB",borderRadius:3,outline:"none",fontSize:11,resize:"none",minHeight:60,padding:6,fontFamily:"inherit",lineHeight:1.5,boxSizing:"border-box"}}/>
                        <select value={beat.act} onChange={e=>updateBeat(beat.id,{act:e.target.value})} style={{...css.input,fontSize:10,padding:"3px 6px",marginTop:6}}>{ACT_LABELS.map(a=><option key={a}>{a}</option>)}</select>
                      </>
                    ):(
                      <>
                        <p style={{margin:"0 0 5px",fontSize:12,fontWeight:700,color:"#000",lineHeight:1.3}}>{beat.title||"Untitled"}</p>
                        {beat.body&&<p style={{margin:"0 0 6px",fontSize:11,color:"#666",lineHeight:1.5}}>{beat.body.slice(0,80)}{beat.body.length>80?"…":""}</p>}
                      </>
                    )}
                    <div style={{display:"flex",justifyContent:"space-between",marginTop:8}}>
                      <button onClick={()=>setEditing(beat.id)} style={{background:"none",border:"none",cursor:"pointer",fontSize:10,color:"#BBB",padding:0,fontFamily:"inherit"}}>Edit</button>
                      <button onClick={()=>deleteBeat(beat.id)} style={{background:"none",border:"none",cursor:"pointer",fontSize:10,color:"#CCC",padding:0,fontFamily:"inherit"}}>×</button>
                    </div>
                  </div>
                );
              })}
            </div>
            <div style={{borderTop:"1px solid #EBEBEB",marginTop:20}}/>
          </div>
        );
      })}
    </div>
  );
}

const SCENE_STATUS={todo:"○",inprogress:"◑",done:"●",revision:"✗"};
function SceneNavigator({lines,onJumpTo,collapsed,onToggle}){
  const [statuses,setStatuses]=useState({});
  const scenes=[];let page=1;
  lines.forEach((line,idx)=>{if(line.mode==="location"&&line.text?.trim()) scenes.push({idx,text:line.text.trim(),page});if(idx>0&&idx%55===0) page++;});
  const cycleStatus=(idx,e)=>{e.stopPropagation();const keys=Object.keys(SCENE_STATUS);const cur=statuses[idx]||"todo";const next=keys[(keys.indexOf(cur)+1)%keys.length];setStatuses(s=>({...s,[idx]:next}));};
  if(collapsed) return null;
  return(
    <div style={{width:220,minWidth:220,borderRight:"1px solid #EBEBEB",background:"#FAFAFA",display:"flex",flexDirection:"column",flexShrink:0,overflow:"hidden"}}>
      <div style={{padding:"12px 12px 10px",borderBottom:"1px solid #EBEBEB",display:"flex",justifyContent:"space-between",alignItems:"center",flexShrink:0}}>
        <span style={{fontSize:9,fontWeight:800,color:"#AAA",letterSpacing:"0.14em",textTransform:"uppercase"}}>Scenes</span>
        <button onClick={onToggle} style={{background:"none",border:"none",cursor:"pointer",color:"#BBB",fontSize:13,padding:2}}>×</button>
      </div>
      <div style={{flex:1,overflowY:"auto"}}>
        {scenes.length===0&&<p style={{padding:"16px 12px",fontSize:11,color:"#CCC",fontStyle:"italic"}}>No scene headings yet.</p>}
        {scenes.map((s,i)=>(
          <div key={s.idx} onClick={()=>onJumpTo(s.idx)} style={{padding:"8px 12px",borderBottom:"1px solid #F0F0F0",cursor:"pointer",display:"flex",alignItems:"flex-start",gap:8}}
            onMouseEnter={e=>e.currentTarget.style.background="#F5F5F5"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
            <span style={{fontSize:9,color:"#CCC",marginTop:2,flexShrink:0,minWidth:16}}>{i+1}</span>
            <div style={{flex:1,overflow:"hidden"}}><p style={{margin:0,fontSize:11,color:"#333",lineHeight:1.4,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.text}</p><span style={{fontSize:9,color:"#BBB"}}>p.{s.page}</span></div>
            <button onClick={e=>cycleStatus(s.idx,e)} style={{background:"none",border:"none",cursor:"pointer",fontSize:11,color:"#AAA",flexShrink:0,padding:0}}>{SCENE_STATUS[statuses[s.idx]||"todo"]}</button>
          </div>
        ))}
      </div>
    </div>
  );
}

function SceneGallery({project,onUpdate,currentPage}){
  const scenes=project?.sceneGallery||[];
  const [adding,setAdding]=useState(false);
  const [form,setForm]=useState({label:"",fromPage:"",toPage:"",image:null});
  const fileRef=useRef(null);
  const save=(updated)=>onUpdate({sceneGallery:updated});
  const handleImage=(e)=>{const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>setForm(f=>({...f,image:ev.target.result}));reader.readAsDataURL(file);e.target.value="";};
  const addScene=()=>{if(!form.fromPage||!form.toPage||!form.image)return;const entry={id:Date.now(),label:form.label||`p.${form.fromPage}–${form.toPage}`,fromPage:parseInt(form.fromPage),toPage:parseInt(form.toPage),image:form.image};save([...scenes,entry]);setForm({label:"",fromPage:"",toPage:"",image:null});setAdding(false);};
  const deleteScene=(id)=>save(scenes.filter(s=>s.id!==id));
  const active=scenes.filter(s=>currentPage>=s.fromPage&&currentPage<=s.toPage);
  const inactive=scenes.filter(s=>currentPage<s.fromPage||currentPage>s.toPage);
  return(
    <div style={{width:220,minWidth:220,borderLeft:"1px solid #EBEBEB",background:"#FAFAFA",display:"flex",flexDirection:"column",flexShrink:0,overflow:"hidden"}}>
      <div style={{padding:"12px 14px 10px",borderBottom:"1px solid #EBEBEB",display:"flex",justifyContent:"space-between",alignItems:"center",flexShrink:0}}>
        <span style={{fontSize:9,fontWeight:800,color:"#AAA",letterSpacing:"0.14em",textTransform:"uppercase"}}>Scene Gallery</span>
        <button onClick={()=>setAdding(o=>!o)} style={{background:"none",border:"none",cursor:"pointer",color:adding?"#000":"#BBB",fontSize:16,lineHeight:1,padding:0}}>+</button>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"12px 12px 48px"}}>
        {adding&&(
          <div style={{background:"#FFF",border:"1px solid #E0E0E0",borderRadius:6,padding:12,marginBottom:14}}>
            <p style={{margin:"0 0 8px",fontSize:10,fontWeight:800,color:"#AAA",textTransform:"uppercase"}}>New Scene</p>
            <input value={form.label} onChange={e=>setForm(f=>({...f,label:e.target.value}))} placeholder="Label" style={{...css.input,fontSize:11,marginBottom:6}}/>
            <div style={{display:"flex",gap:6,marginBottom:6}}>
              <input value={form.fromPage} onChange={e=>setForm(f=>({...f,fromPage:e.target.value}))} placeholder="From p." type="number" min="1" style={{...css.input,fontSize:11,flex:1}}/>
              <input value={form.toPage} onChange={e=>setForm(f=>({...f,toPage:e.target.value}))} placeholder="To p." type="number" min="1" style={{...css.input,fontSize:11,flex:1}}/>
            </div>
            <div onClick={()=>fileRef.current?.click()} style={{border:"1px dashed #D0D0D0",borderRadius:4,padding:"8px",textAlign:"center",cursor:"pointer",marginBottom:8,background:form.image?"none":"#FAFAFA",overflow:"hidden"}}>
              {form.image?<img src={form.image} alt="" style={{width:"100%",height:80,objectFit:"cover",borderRadius:3}}/>:<p style={{margin:0,fontSize:11,color:"#BBB"}}>Click to add image</p>}
            </div>
            <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleImage}/>
            <div style={{display:"flex",gap:6}}>
              <button onClick={addScene} disabled={!form.fromPage||!form.toPage||!form.image} style={{flex:1,padding:"6px",background:"#000",color:"#FFF",border:"none",borderRadius:4,cursor:"pointer",fontFamily:"inherit",fontSize:11,fontWeight:700,opacity:(!form.fromPage||!form.toPage||!form.image)?0.4:1}}>Add</button>
              <button onClick={()=>{setAdding(false);setForm({label:"",fromPage:"",toPage:"",image:null});}} style={{padding:"6px 10px",background:"none",border:"1px solid #E0E0E0",borderRadius:4,cursor:"pointer",fontFamily:"inherit",fontSize:11,color:"#888"}}>Cancel</button>
            </div>
          </div>
        )}
        {active.length>0&&(
          <div style={{marginBottom:16}}>
            <p style={{margin:"0 0 8px",fontSize:9,fontWeight:800,color:"#000",textTransform:"uppercase"}}>Now — p.{currentPage}</p>
            <div style={{display:"grid",gridTemplateColumns:`repeat(${active.length<=1?1:2},1fr)`,gap:4}}>
              {active.map(s=>(<div key={s.id} style={{position:"relative",borderRadius:4,overflow:"hidden",aspectRatio:"4/3"}}>
                <img src={s.image} alt={s.label} style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}/>
                <div style={{position:"absolute",bottom:0,left:0,right:0,background:"rgba(0,0,0,0.45)",padding:"3px 6px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontSize:9,color:"#FFF",fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1}}>{s.label}</span>
                  <button onClick={()=>deleteScene(s.id)} style={{background:"none",border:"none",cursor:"pointer",color:"rgba(255,255,255,0.6)",fontSize:11,padding:0,lineHeight:1,marginLeft:4,flexShrink:0}}>×</button>
                </div>
              </div>))}
            </div>
          </div>
        )}
        {inactive.length>0&&(
          <div>
            <p style={{margin:"0 0 8px",fontSize:9,fontWeight:800,color:"#CCC",textTransform:"uppercase"}}>All Scenes</p>
            {inactive.map(s=>(<div key={s.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:"1px solid #F0F0F0"}}>
              <div style={{width:36,height:28,borderRadius:3,overflow:"hidden",flexShrink:0}}><img src={s.image} alt={s.label} style={{width:"100%",height:"100%",objectFit:"cover"}}/></div>
              <div style={{flex:1,overflow:"hidden"}}><p style={{margin:0,fontSize:11,fontWeight:600,color:"#555",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.label}</p><span style={{fontSize:9,color:"#CCC"}}>p.{s.fromPage}–{s.toPage}</span></div>
              <button onClick={()=>deleteScene(s.id)} style={{background:"none",border:"none",cursor:"pointer",color:"#CCC",fontSize:13,padding:0,flexShrink:0}}>×</button>
            </div>))}
          </div>
        )}
        {scenes.length===0&&!adding&&(<div style={{textAlign:"center",padding:"32px 0",color:"#CCC"}}><p style={{fontSize:12,margin:"0 0 8px"}}>No scenes yet.</p><p style={{fontSize:11,margin:0,lineHeight:1.6}}>Click + to attach an image to a page range.</p></div>)}
      </div>
    </div>
  );
}

function App({profile,onEditProfile,onHome,initialProject,onSaveProject,onBackToDash}){

  const [importOpen,setImportOpen]=useState(false);
  const [focusMode,setFocusMode]=useState(false);
  const [shortcutsOpen,setShortcutsOpen]=useState(false);
  const [sceneNavCollapsed,setSceneNavCollapsed]=useState(true);
  const [showFormatGuide,setShowFormatGuide]=useState(false);
  const [wordCount,setWordCount]=useState(0);
  const [lastSaved,setLastSaved]=useState(null);
  const [projectMenuOpen,setProjectMenuOpen]=useState(false);
  const [darkCanvas,setDarkCanvas]=useState(false);
  const [galleryOpen,setGalleryOpen]=useState(false);
  const [charPanelOpen,setCharPanelOpen]=useState(false);
  const [currentCharName,setCurrentCharName]=useState("");
  const [titlePageEditorOpen,setTitlePageEditorOpen]=useState(false);

  const active=projects.find(p=>p.id===activeId)||projects[0]||null;

  const mountedRef=useRef(false);
  useEffect(()=>{
    if(!mountedRef.current){mountedRef.current=true;return;}
    if(onSaveProject&&active)onSaveProject(active);
    else LS.set("sf_projects",projects);
  },[projects]);

  useEffect(()=>{
    const handler=(e)=>{
      if(!(e.metaKey||e.ctrlKey)) return;
      if(e.key==="k"&&AI_FEATURES_ENABLED){e.preventDefault();setAiOpen(o=>!o);}
      if(e.key==="b"){e.preventDefault();setNav(n=>n==="beats"?"write":"beats");}
      if(e.key==="f"){e.preventDefault();setFocusMode(o=>!o);}
      if(e.key==="m"){e.preventDefault();setSceneNavCollapsed(o=>!o);}
      if(e.key==="/"){e.preventDefault();setShortcutsOpen(o=>!o);}
    };
    window.addEventListener("keydown",handler);
    return()=>window.removeEventListener("keydown",handler);
  },[]);

  useEffect(()=>{
    const wc=(active?.lines||[]).reduce((acc,l)=>acc+(l.text||"").split(/\s+/).filter(Boolean).length,0);
    setWordCount(wc);
  },[active?.id,active?.lines]);

  const newProject=()=>{
    const p={id:Date.now(),title:"Untitled",format:profile.format,genre:profile.genre,lines:[],cast:[],notes:"",moodCards:[],beats:[],sceneGallery:[],created:Date.now()};
    setProjects(prev=>[p,...prev]);setActiveId(p.id);setNav("write");
  };

  const updateProject=(id,changes)=>setProjects(prev=>prev.map(p=>p.id===id?{...p,...changes}:p));
  const updateLines=(lines)=>{if(active){updateProject(active.id,{lines});setLastSaved(new Date());}};
  const updateNotes=(notes)=>{if(active)updateProject(active.id,{notes});};
  const addCharacter=(char)=>{if(!active)return;const exists=active.cast?.some(c=>c.name.toUpperCase()===char.name.toUpperCase());if(!exists)updateProject(active.id,{cast:[...(active.cast||[]),char]});};
  const updateCharacter=(charId,field,val)=>{if(!active)return;updateProject(active.id,{cast:active.cast.map(c=>c.id===charId?{...c,[field]:val}:c)});};
  const updateMoodCards=(cards)=>{if(active)updateProject(active.id,{moodCards:cards});};
  const updateBeats=(changes)=>{if(active)updateProject(active.id,changes);};
  const updateSceneGallery=(changes)=>{if(active)updateProject(active.id,changes);};

  const importScript=(imported)=>{
    const p={id:Date.now(),title:imported.title,format:imported.format,genre:imported.genre,lines:imported.lines,cast:imported.cast||[],notes:"",moodCards:[],beats:[],sceneGallery:[],created:Date.now()};
    setProjects(prev=>[p,...prev]);setActiveId(p.id);setNav("write");setImportOpen(false);
  };

  const cast=active?.cast||[];
  const sceneNavRef=useRef(null);

  const fmtLastSaved=()=>{if(!lastSaved)return"Not saved";const sec=Math.floor((Date.now()-lastSaved)/1000);if(sec<60)return"Just now";return`${Math.floor(sec/60)}m ago`;};

  return(
    <div style={{height:"100vh",display:"flex",background:"#FFF",color:"#0A0A0A",fontFamily:"-apple-system,'Segoe UI',sans-serif",overflow:"hidden"}}>
      {focusMode&&(
        <div style={{position:"fixed",inset:0,zIndex:2000,background:"#FFF",display:"flex",flexDirection:"column"}}>
          <div style={{padding:"10px 20px",display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:"1px solid #EBEBEB"}}>
            <span style={{fontSize:12,fontWeight:700,color:"#000"}}>{active?.title||"Untitled"}</span>
            <div style={{display:"flex",gap:16,alignItems:"center"}}>
              <span style={{fontSize:11,color:"#AAA"}}>p.{pageInfo.cur}/{pageInfo.total} · {wordCount.toLocaleString()} words</span>
              <button onClick={()=>setFocusMode(false)} style={{background:"none",border:"1px solid #DDD",borderRadius:4,padding:"4px 12px",cursor:"pointer",fontSize:11,fontFamily:"inherit",color:"#666"}}>Exit Focus ⌘F</button>
            </div>
          </div>
          <div style={{flex:1,overflow:"hidden"}}>
            {active&&<SmartEditor project={active} cast={cast} onUpdateContent={updateLines} onAddCharacter={addCharacter} format={active.format} onPageChange={(cur,total)=>setPageInfo({cur,total})} focusMode={true} scrollRef={sceneNavRef} profile={profile} onEditTitlePage={()=>setTitlePageEditorOpen(true)}/>}
          </div>
